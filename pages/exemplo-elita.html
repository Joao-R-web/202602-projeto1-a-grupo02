<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Bulbe - Acompanhe suas etapas</title>

  <!-- Fonte da Bulbe -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">

  <!-- CSS comum do grupo (sempre primeiro) -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <!-- CSS individual da Elita -->
  <link rel="stylesheet" href="style-elita.css">

  <!-- JavaScript comum do grupo -->
  <script type="module" src="../assets/js/main.js"></script>

  <!-- JavaScript individual da Elita -->
  <script type="module" src="app-elita.js"></script>

</head>

<body>

  <div class="app">

    <!-- CABEÇALHO -->
    <header class="cabecalho">

      <!-- Barra de status -->
      <div class="barra-status">

        <span>10:12</span>

        <div class="status-icones">

          <svg width="18" height="12" viewBox="0 0 18 12"
            fill="currentColor" aria-hidden="true">
            <rect x="0" y="8" width="3" height="4" rx="1"/>
            <rect x="5" y="5" width="3" height="7" rx="1"/>
            <rect x="10" y="2.5" width="3" height="9.5" rx="1"/>
            <rect x="15" y="0" width="3" height="12" rx="1"/>
          </svg>

          <svg width="24" height="12" viewBox="0 0 24 12"
            fill="none" aria-hidden="true">
            <rect x="0.5" y="0.5" width="20" height="11"
              rx="3" stroke="currentColor"/>
            <rect x="2.5" y="2.5" width="16" height="7"
              rx="1.5" fill="currentColor"/>
            <rect x="22" y="4" width="2" height="4"
              rx="1" fill="currentColor"/>
          </svg>

        </div>
      </div>

      <!-- Barra superior: USUÁRIO LOGADO -->
      <div class="barra-topo">

        <!-- Menu -->
        <button type="button" class="botao-icone"
          aria-label="Abrir menu">

          <svg width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">

            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>

          </svg>

        </button>

        <!-- Logo -->
        <img
          class="logo-img"
          src="../assets/img/logo-bulbe-branca.png"
          alt="Bulbe"
          width="101"
          height="29"
        >

        <!-- Notificações e perfil -->
        <div class="acoes-direita">

          <button type="button" class="botao-icone"
            aria-label="Notificações: 2 novas">

            <svg width="22" height="22" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">

              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"/>

            </svg>

            <span class="indicador">2</span>

          </button>

          <!-- Perfil -->
          <div class="perfil" aria-label="Perfil">
            EF
          </div>

        </div>

      </div>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo" id="conteudo">

      <!-- O JavaScript app-elita.js carrega as etapas aqui -->

      <p class="carregando">
        Carregando suas etapas...
      </p>

    </main>

    <!-- RODAPÉ: USUÁRIO LOGADO -->
    <footer class="rodape">

      <nav class="navegacao" aria-label="Navegação principal">

        <!-- Conexão -->
        <button type="button" class="nav-item ativo"
          aria-current="page">

          <svg width="26" height="26" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">

            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>

          </svg>

          Conexão

        </button>

        <!-- Faturas -->
        <button type="button" class="nav-item">

          <svg width="26" height="26" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">

            <path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="9" y1="12" x2="15" y2="12"/>

          </svg>

          Faturas

        </button>

        <!-- Consumo -->
        <button type="button" class="nav-item">

          <svg width="26" height="26" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">

            <line x1="6" y1="20" x2="6" y2="12"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="18" y1="20" x2="18" y2="9"/>

          </svg>

          Consumo

        </button>

        <!-- Indicações -->
        <button type="button" class="nav-item">

          <svg width="26" height="26" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">

            <rect x="3" y="8" width="18" height="4" rx="1"/>
            <path d="M5 12v9h14v-9"/>
            <line x1="12" y1="8" x2="12" y2="21"/>
            <path d="M12 8c-2.5 0-4-1-4-2.5S9.5 3 11 4c.8.6 1 2.5 1 4z"/>
            <path d="M12 8c2.5 0 4-1 4-2.5S14.5 3 13 4c-.8.6-1 2.5-1 4z"/>

          </svg>

          Indicações

        </button>

      </nav>

    </footer>

  </div>

</body>
</html>
