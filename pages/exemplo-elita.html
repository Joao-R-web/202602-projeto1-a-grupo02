<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bulbe - Acompanhe suas etapas</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --azul-bulbe: #17305a;        
      --azul-claro: #8a9bb5;        
      --borda: #dde3ec;             
      --texto-suave: #5b6b82;       
      --vermelho: #d93a2f;          
      --fundo-pagina: #ececec;
      --altura-app: 100dvh;         
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: var(--altura-app);
      background-color: var(--fundo-pagina);
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--azul-bulbe);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(390px, 100vw);
      height: min(820px, 96vh);
      background-color: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
    }

    @media (pointer: coarse), (max-width: 600px) {
      body {
        display: block;
        background: #ffffff;
      }
      .app {
        width: 100%;
        height: var(--altura-app);
        border-radius: 0;
        box-shadow: none;
      }
    }

    .cabecalho {
      flex: 0 0 auto;
      padding: env(safe-area-inset-top) 16px 12px;
    }

    .barra-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      padding: 0 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-icones {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .barra-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 14px;
    }

    .botao-icone {
      background: none;
      border: none;
      color: var(--azul-bulbe);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      position: relative;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .acoes-direita {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .indicador {
      position: absolute;
      top: 0;
      right: 0;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background-color: var(--vermelho);
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .perfil {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--azul-bulbe);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .conteudo {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
    }

    /* Estilos específicos da tela de etapas injetada via fetch */
    .etapas-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }

    .etapa-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .etapa-icone {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .etapa-item.concluido .etapa-icone {
      background-color: #27ae60;
      color: #ffffff;
    }

    .etapa-item.pendente .etapa-icone {
      background-color: var(--borda);
      color: var(--texto-suave);
    }

    .etapa-texto h4 {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .etapa-item.concluido .etapa-texto h4 {
      color: var(--azul-bulbe);
    }

    .etapa-item.pendente .etapa-texto h4 {
      color: var(--azul-claro);
    }

    .etapa-texto p {
      font-size: 0.75rem;
      color: var(--texto-suave);
      margin-top: 2px;
    }

    .btn-continuar {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: #f0f2f5;
      border: none;
      border-radius: 14px;
      color: var(--azul-bulbe);
      font-weight: bold;
      cursor: pointer;
    }

    .rodape {
      flex: 0 0 auto;
      background-color: #ffffff;
    }

    .navegacao {
      display: flex;
      justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--borda);
    }

    .nav-item {
      flex: 1;
      background: none;
      border: none;
      font-family: inherit;
      color: var(--azul-claro);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .nav-item.ativo {
      color: var(--azul-bulbe);
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="app">
    <header class="cabecalho">
      <div class="barra-status">
        <span>10:12</span>
        <div class="status-icones">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
            <rect x="0" y="8" width="3" height="4" rx="1"/>
            <rect x="5" y="5" width="3" height="7" rx="1"/>
            <rect x="10" y="2.5" width="3" height="9.5" rx="1"/>
            <rect x="15" y="0" width="3" height="12" rx="1"/>
          </svg>
          <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
            <rect x="0.5" y="0.5" width="20" height="11" rx="3" stroke="currentColor"/>
            <rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/>
            <rect x="22" y="4" width="2" height="4" rx="1" fill="currentColor"/>
          </svg>
        </div>
      </div>

      <div class="barra-topo">
        <button class="botao-icone" aria-label="Abrir menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>

        <h1 class="logo">bulbe</h1>

        <div class="acoes-direita">
          <button class="botao-icone" aria-label="Notificações">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
            <span class="indicador">2</span>
          </button>
          <div class="perfil">FA</div>
        </div>
      </div>
    </header>

    <!-- O conteúdo será injetado dinamicamente via fetch aqui -->
    <main class="conteudo" id="conteudo">
    </main>

    <footer class="rodape">
      <nav class="navegacao" aria-label="Navegação principal">
        <button class="nav-item ativo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          Conexão
        </button>
        <button class="nav-item">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
          </svg>
          Faturas
        </button>
        <button class="nav-item">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="6" y1="20" x2="6" y2="12"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="18" y1="20" x2="18" y2="9"/>
          </svg>
          Consumo
        </button>
        <button class="nav-item">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="18" height="4" rx="1"/>
            <path d="M5 12v9h14v-9"/>
            <line x1="12" y1="8" x2="12" y2="21"/>
            <path d="M12 8c-2.5 0-4-1-4-2.5S9.5 3 11 4c.8.6 1 2.5 1 4z"/>
            <path d="M12 8c2.5 0 4-1 4-2.5S14.5 3 13 4c-.8.6-1 2.5-1 4z"/>
          </svg>
          Indicações
        </button>
      </nav>
    </footer>
  </div>

  <!-- Script que faz o fetch do JSON e monta a tela -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("dados.json")
        .then(response => {
          if (!response.ok) throw new Error("Erro ao carregar os dados JSON");
          return response.json();
        })
        .then(data => {
          const conteudo = document.getElementById("conteudo");

          conteudo.innerHTML = `
            <div style="font-size: 0.8rem; font-weight: bold; color: var(--azul-claro); margin-bottom: 6px;">
              ${data.passoAtual}
            </div>
            <div style="width: 100%; height: 6px; background: var(--borda); border-radius: 3px; margin-bottom: 16px; overflow: hidden;">
              <div style="width: ${data.progresso}%; height: 100%; background: var(--azul-bulbe); border-radius: 3px;"></div>
            </div>

            <h2 style="font-size: 1.25rem; margin-bottom: 4px; color: var(--azul-bulbe);">${data.titulo}</h2>
            <p style="font-size: 0.8rem; color: var(--texto-suave); margin-bottom: 20px;">${data.subtitulo}</p>

            <div class="etapas-wrapper">
              ${data.etapas.map((etapa, index) => {
                const isConcluido = etapa.status === "concluido";
                return `
                  <div class="etapa-item ${etapa.status}">
                    <div class="etapa-icone">${isConcluido ? '✓' : index + 1}</div>
                    <div class="etapa-texto">
                      <h4>${etapa.titulo}</h4>
                      <p>${etapa.descricao}</p>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <button class="btn-continuar">Continuar</button>
          `;
        })
        .catch(error => console.error("Erro:", error));
    });
  </script>
</body>
</html>
