<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bulbe - Acompanhe suas etapas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="cabecalho">

      <div class="barra-status">
        <span>10:12</span>

        <div class="status-icones">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor">
            <rect x="0" y="8" width="3" height="4" rx="1" />
            <rect x="5" y="5" width="3" height="7" rx="1" />
            <rect x="10" y="2.5" width="3" height="9.5" rx="1" />
            <rect x="15" y="0" width="3" height="12" rx="1" />
          </svg>

          <svg width="24" height="12" viewBox="0 0 24 12" fill="none">
            <rect x="0.5" y="0.5" width="20" height="11" rx="3" stroke="currentColor" />
            <rect x="2.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor" />
            <rect x="22" y="4" width="2" height="4" rx="1" fill="currentColor" />
          </svg>
        </div>
      </div>

      <div class="barra-topo">

        <button class="botao-icone" aria-label="Abrir menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="17" x2="20" y2="17" />
          </svg>
        </button>

        <h1 class="logo"><img src="logo-bulbe-branca-elita.png" alt="Bulbe"></h1>

        <div class="acoes-direita">

          <button class="botao-icone" aria-label="Notificações">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.7 21a2 2 0 0 1-3.4 0" />
            </svg>
            <span class="indicador">2</span>
          </button>

          <div class="perfil">EF</div>

        </div>
      </div>
    </header>

    <main class="conteudo" id="conteudo">
      <p class="carregando">Carregando suas etapas...</p>
    </main>

    <footer class="rodape">

      <nav class="navegacao" aria-label="Navegação principal">

        <button class="nav-item ativo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          Conexão
        </button>

        <button class="nav-item">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M6 2h12v20l-3-2-3 2-3-2-3 2z" />
            <line x1="9" y1="8" x2="15" y2="8" />
            <line x1="9" y1="12" x2="15" y2="12" />
          </svg>
          Faturas
        </button>

        <button class="nav-item">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <line x1="6" y1="20" x2="6" y2="12" />
            <line x1="12" y1="20" x2="12" y2="4" />
            <line x1="18" y1="20" x2="18" y2="9" />
          </svg>
          Consumo
        </button>

        <button class="nav-item">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="18" height="4" rx="1" />
            <path d="M5 12v9h14v-9" />
            <line x1="12" y1="8" x2="12" y2="21" />
            <path d="M12 8c-2.5 0-4-1-4-2.5S9.5 3 11 4c.8.6 1 2.5 1 4z" />
            <path d="M12 8c2.5 0 4-1 4-2.5S14.5 3 13 4c-.8.6-1 2.5-1 4z" />
          </svg>
          Indicações
        </button>

      </nav>
    </footer>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      fetch("dados.json")
        .then(response => {
          if (!response.ok) {
            throw new Error("Não foi possível carregar os dados.");
          }
          return response.json();
        })

        .then(data => {

          const conteudo = document.getElementById("conteudo");

          conteudo.innerHTML = `

                <section class="introducao">
                    <h2>${data.titulo}</h2>
                    <p>${data.subtitulo}</p>
                </section>

                <section class="etapas-wrapper">

                    ${data.etapas.map((etapa, index) => {

            const icone = etapa.status === "concluido"
              ? "✓"
              : index + 1;

            return `
                            <div class="etapa-item ${etapa.status}">

                                <div class="etapa-icone">
                                    ${icone}
                                </div>

                                <div class="etapa-texto">
                                    <h3>${etapa.titulo}</h3>
                                    <p>${etapa.descricao}</p>
                                </div>

                            </div>
                        `;

          }).join("")}

                </section>

                <section class="aviso-fatura">

                    <div class="icone-fatura">
                        <svg width="40" height="40" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <path d="M14 2v6h6"/>
                            <path d="M8 13h8"/>
                            <path d="M8 17h5"/>
                        </svg>
                    </div>

                    <div class="texto-aviso">
                        <h3>Fique de olho!</h3>
                        <p>
                            Em breve sua primeira fatura da Bulbe estará disponível,
                            e você poderá consultar os valores e acompanhar seus descontos.
                        </p>
                    </div>

                </section>

                <button class="btn-continuar">
                    Continuar
                </button>

            `;
        })

        .catch(error => {
          console.error("Erro:", error);

          document.getElementById("conteudo").innerHTML =
            '<p class="erro">Não foi possível carregar suas etapas.</p>';
        });

    });
  </script>

</body>

</html>
