ltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Bulbe | Créditos do mês<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo (sempre primeiro) e CSS desta tela -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n  <style>\n/* =========================================================\n   Tela: Créditos do mês\n   Só o que é desta tela. O resto vem de assets/css/style.css.\n   ========================================================= */\n\n:root {\n  --cre-verde: #23A455;\n  --cre-verde-escuro: #1D6B3F;\n  --cre-verde-fundo: #E4F3EA;\n  --cre-cartao: #EEF2F8;\n  --cre-texto: #1F2340;\n}\n\n\n/* ---------- Destaque: créditos injetados ---------- */\n\n.creditos {\n  padding: 20px 16px 16px;\n  border-left: 4px solid var(--cre-verde);\n  border-radius: var(--raio);\n  background: var(--cre-verde-fundo);\n  text-align: center;\n}\n\n.creditos__rotulo {\n  font-size: 0.8rem;\n  font-weight: 700;\n  line-height: 1.3;\n  color: var(--cre-verde-escuro);\n}\n\n.creditos__valor {\n  margin-top: 4px;\n  font-size: 4rem;\n  font-weight: 800;\n  line-height: 1.05;\n  color: var(--azul-bulbe);\n}\n\n.creditos__unidade {\n  font-size: 1.5rem;\n  font-weight: 700;\n}\n\n.creditos__detalhe {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  line-height: 1.35;\n  color: var(--cre-texto);\n}\n\n\n/* ---------- Sinal positivo ---------- */\n\n.sinal {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  margin-top: 14px;\n  padding: 10px 12px;\n  border-radius: 12px;\n  background: #ffffff;\n  text-align: left;\n  font-size: 0.8rem;\n  font-weight: 700;\n  line-height: 1.3;\n}\n\n.sinal svg {\n  flex-shrink: 0;\n  box-sizing: content-box;\n  padding: 6px;\n  border-radius: 50%;\n  background: var(--cre-verde);\n  color: #ffffff;\n}\n\n.sinal small {\n  display: block;\n  font-size: 0.7rem;\n  font-weight: 400;\n  color: var(--texto-suave);\n}\n\n.sinal--positivo {\n  color: var(--cre-verde-escuro);\n}\n\n\n/* ---------- Cálculo do mês ---------- */\n\n.calculo {\n  padding: 16px 14px;\n  border-radius: var(--raio);\n  background: var(--cre-cartao);\n}\n\n.calculo__titulo {\n  margin-bottom: 8px;\n  font-size: 0.95rem;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--azul-bulbe);\n}\n\n.calculo__linhas {\n  display: flex;\n  flex-direction: column;\n}\n\n.calculo__linha {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 8px 0;\n  border-bottom: 1px dashed var(--borda);\n  font-size: 0.85rem;\n  line-height: 1.3;\n  color: var(--cre-texto);\n}\n\n.calculo__linha dd {\n  font-weight: 700;\n  white-space: nowrap;\n}\n\n.calculo__linha small {\n  font-size: 0.7rem;\n  color: var(--texto-suave);\n}\n\n.calculo__linha--conta dt {\n  color: var(--texto-suave);\n}\n\n.calculo__economia {\n  color: var(--cre-verde-escuro);\n}\n\n.calculo__linha--total {\n  border-bottom: 0;\n  padding-bottom: 0;\n}\n\n.calculo__linha--total dt {\n  font-weight: 700;\n  color: var(--azul-bulbe);\n}\n\n.calculo__linha--total dd {\n  font-size: 1.2rem;\n  color: var(--azul-bulbe);\n}\n\n.nota-creditos {\n  margin-top: -8px;\n  font-size: 0.65rem;\n  color: var(--texto-suave);\n}\n\n\n/* ---------- Botão de contorno (mesmo da tela Consumo) ---------- */\n\n.botao--contorno {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 42px;\n  border: 2px solid var(--azul-bulbe);\n  border-radius: 12px;\n  background: #ffffff;\n  font-size: 0.8rem;\n  font-weight: 700;\n  line-height: 1.2;\n  text-align: center;\n  text-decoration: none;\n  color: var(--azul-bulbe);\n}\n\n.botao--contorno:hover {\n  background: #F1F2FB;\n}\n\n/* Botões do fim da tela: ficam juntos, colados embaixo */\n.botoes-fim {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  margin-top: auto;\n}\n\n\n/* ---------- Abas: linha azul na aba ativa ---------- */\n\n.nav-item {\n  position: relative;\n  text-decoration: none;\n}\n\n.nav-item.ativo::before {\n  content: \"\";\n  position: absolute;\n  top: -9px;\n  left: 0;\n  right: 0;\n  height: 2px;\n  background: var(--azul-bulbe);\n}\n\n<\/style>\n\n  <!-- JavaScript comum do grupo -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n<\/head>\n\n<body>\n\n  <div class=\"app\">\n\n    <!-- Cabeçalho padrão do grupo: azul, com barra de status, voltar e logo branca -->\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria- -2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/>\n            <circle cx=\"9\" cy=\"7\" r=\"4\"/>\n            <line x1=\"19\" y1=\"8\" x2=\"19\" y2=\"14\"/>\n            <line x1=\"22\" y1=\"11\" x2=\"16\" y2=\"11\"/>\n          <\/svg>\n          Indicações\n        <\/button>\n\n      <\/nav>\n    <\/footer>\n\n  <\/div>\n\n<\/body>\n<\/html>\n", "pages/hu-mariana/index.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Perguntas frequentes · Bulbe<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n  <style>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas nesta pasta: index.html (FAQ) → mudanca-endereco.html → novo-endereco.html → pedido-enviado.html\n\n   Parte 1: base do template do grupo (mesmo CSS de pages/exemplo.html:\n            fonte Poppins, azul #08068D e app 360 x 812).\n   Parte 2: variante de adesão (cabeçalho azul, rodapé de ação)\n            e componentes das quatro telas.\n   ========================================================= */\n\n/* ---------- Parte 1 · Base do template ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\n:root {\n  --azul-bulbe: #08068D;        \n  --azul-claro: #8a9bb5;        \n  --borda: #dde3ec;             \n  --texto-suave: #5b6b82;       \n  --vermelho: #d93a2f;          \n  --fundo-pagina: #ececec;\n  --altura-app: 100dvh;         \n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.barra-topo {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin: 8px 0 14px;\n}\n\n.botao-icone {\n  background: none;\n  border: none;\n  color: var(--azul-bulbe);\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  width: 36px;\n  height: 36px;\n  position: relative;\n}\n\n.logo {\n  font-size: 1.5rem;\n  font-weight: 800;\n  letter-spacing: -0.5px;\n}\n\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.indicador {\n  position: absolute;\n  top: 0;\n  right: 0;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: var(--azul-bulbe);\n  color: #ffffff;\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 0 16px;\n}\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 4px 0 8px; }\n}\n\n/* ---------- Parte 2 · Adesão e telas da HU ---------- */\n/* =========================================================\n   Variação do template para quem AINDA NÃO É CLIENTE (adesão)\n   Uso: <div class=\"app app--adesao\">\n   - Cabeçalho: voltar + logo + etapa (sem sino e sem perfil)\n   - Rodapé: botão de ação da etapa (sem as abas do app logado)\n   Usa só as variáveis do template.css; as novas estão abaixo.\n   ========================================================= */\n\n:root {\n  --verde: #23C97B;\n  --verde-escuro: #0B3D25;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --whatsapp: #075E54;\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n  --desabilitado: #A4B3C1;\n  --raio: 10px;\n  --altura-botao: 48px;\n}\n\n/* ---------- Cabeçalho da adesão ---------- */\n/* Azul da marca com o logo branco, como no app da Bulbe.\n   Se o PR oficial deixar o cabeçalho do template azul, este bloco vira redundante. */\n\n.app--adesao .cabecalho {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone {\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  justify-self: center;\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n.app--adesao .barra-topo {\n  display: grid;\n  grid-template-columns: 44px 1fr 44px;\n  margin: 4px 0 10px;\n}\n\n.app--adesao .botao-icone {\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  text-decoration: none;\n}\n\n.etapa {\n  justify-self: end;\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n.progresso {\n  height: 4px;\n  margin: 0 -16px -12px;   /* encosta nas bordas do app, por baixo do cabeçalho */\n  background: rgba(255, 255, 255, 0.2);\n}\n\n.progresso__barra {\n  height: 100%;\n  background: linear-gradient(90deg, var(--verde), #19A39B);\n}\n\n/* ---------- Conteúdo ---------- */\n\n.app--adesao .conteudo {\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, a área de conteúdo rola (overflow do template). */\n.app--adesao .conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                      /* tipografia de título da Bulbe: Poppins SemiBold 24/32 */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n/* ---------- Rodapé de ação (no lugar das abas) ---------- */\n\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n/* ---------- Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #FFFFFF;\n  font-size: 0.95rem;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n/* ---------- Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;   /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Abas \"Para mim / Para outra pessoa\": um trilho cinza com as duas opções.\n   A marcada fica preenchida no azul da marca, com ✓ (padrão do \"Sim/Não\" da Bulbe).\n   A não marcada não tem borda, para não parecer um campo de digitação. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;   /* \"✓ Para outra pessoa\" cabe numa linha mesmo em 360 px */\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #FFFFFF;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n/* Campo de WhatsApp: ícone do WhatsApp dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;          /* (48px de altura do campo - 20px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.termos a,\n.subtitulo a,\n.link-secundario {\n  color: var(--azul-bulbe);\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela (o resumo da ilustração em palavras) */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n/* ---------- Perguntas frequentes (index.html) ---------- */\n\n.faq {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n}\n\n.faq__item {\n  border-bottom: 1px solid var(--borda);\n}\n\n.faq__pergunta,\n.faq__destaque {\n  list-style: none;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  min-height: 56px;\n  padding: 12px 0;\n  font-size: 0.9rem;\n  line-height: 1.4;\n  color: var(--texto-suave);\n  cursor: pointer;\n}\n\n.faq__mais {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border: 1.5px solid var(--azul-claro);\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--azul-claro);\n}\n\n/* Pergunta nova, com destaque: leva para a tela da HU */\n.faq__destaque {\n  margin-top: 16px;\n  padding: 12px 14px;\n  border: 2px solid #1D5FD1;\n  border-radius: 12px;\n  background: var(--info-fundo);\n  color: var(--azul-bulbe);\n  font-weight: 600;\n  text-decoration: none;\n}\n\n.faq__destaque .faq__mais {\n  border-color: #1D5FD1;\n  color: #1D5FD1;\n}\n\n.faq__destaque-texto {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 6px;\n}\n\n.selo-novo {\n  padding: 1px 8px;\n  border-radius: 999px;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.65rem;\n  font-weight: 700;\n  letter-spacing: 0.4px;\n}\n\n.faq__destaque:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.card-seguro {\n  padding: 14px;\n  border: 1px solid var(--verde-borda);\n  border-radius: 12px;\n  background: var(--verde-fundo);\n  color: var(--verde-escuro);\n  font-size: 0.8rem;\n  line-height: 1.5;\n}\n\n.card-seguro strong {\n  display: block;\n  margin-bottom: 4px;\n  font-size: 0.9rem;\n}\n\n/* ---------- Mudar de endereço (mudanca-endereco.html) ---------- */\n\n.resposta-destaque {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 16px;\n  border-radius: 14px;\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-size: 1.05rem;\n  line-height: 1.4;\n  font-weight: 600;\n}\n\n.resposta-destaque svg {\n  flex: 0 0 auto;\n}\n\n.texto-apoio {\n  font-size: 0.85rem;\n  line-height: 1.5;\n  color: var(--texto-suave);\n}\n\n.passos {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  padding: 16px;\n  border: 1px solid var(--borda);\n  border-radius: 14px;\n}\n\n.passos__titulo {\n  font-size: 1.05rem;\n  font-weight: 600;\n}\n\n.passo {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.passo__numero {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.85rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.acoes {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.botao--contorno {\n  background: #FFFFFF;\n  border: 2px solid var(--whatsapp);\n  color: var(--whatsapp);\n}\n\n.botao--contorno:hover {\n  background: var(--verde-fundo);\n}\n\n.nota-final {\n  text-align: center;\n  font-size: 0.78rem;\n  color: var(--texto-suave);\n}\n\n.status-simulado {\n  padding: 10px 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n/* ---------- Novo endereço (novo-endereco.html) ---------- */\n\n.campo__ajuda {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo--arquivo input[type=\"file\"] {\n  height: auto;\n  padding: 12px;\n  font-size: 0.85rem;\n}\n\n.campo--arquivo input[type=\"file\"]::file-selector-button {\n  margin-right: 10px;\n  padding: 6px 12px;\n  border: 1px solid var(--azul-bulbe);\n  border-radius: 8px;\n  background: #FFFFFF;\n  color: var(--azul-bulbe);\n  font: inherit;\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.linha-dupla {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n\n/* ---------- Pedido enviado (pedido-enviado.html) ---------- */\n\n.selo-sucesso {\n  align-self: center;\n  width: 64px;\n  height: 64px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.centro {\n  text-align: center;\n}\n\n.resumo {\n  padding: 14px;\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  font-size: 0.85rem;\n  line-height: 1.5;\n}\n\n.resumo dt {\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.resumo dd + dt {\n  margin-top: 8px;\n}\n\n.passo--feito .passo__numero {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.campo input::placeholder {\n  color: #A4B3C1;\n}\n\n/* Perguntas antigas: só texto, sem ação (a pergunta nova é a única que leva a outra tela) */\n.faq__pergunta {\n  cursor: default;\n}\n\n<\/style>\n  \n<\/head>\n\n<body data-tela=\"faq\">\n\n  <div class=\"app app--adesao\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"11\" rx=\"3\" stroke=\"currentColor\"/>\n            <rect x=\"2.5\" y=\"2.5\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>\n            <rect x=\"22\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n\n      <div class=\"barra-topo\">\n        <span><\/span>\n        <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAdCAYAAABcz8ldAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAOdEVYdFNvZnR3YXJlAEZpZ21hnrGWYwAABKRJREFUeAHtWs1u20YQnqWcuIALVL0FSYFu0BToreYTlH6Cuk9QCX4A07e2aCEKyd3qqadEyhPUfQLRpx5l31L0IBZo0KPZSw+O68mMuUzWqyW5FGU5CvQBC4s7P/y4w53ZXRrwOmJ4x2DwGxb0x/CeYAPWuBV8MflO/g9e+Ar+ixJ/kOb964AsGXIStje8D/cvEUIB0L4jtpC6D3K5B2ssDZ9Nvt+9K7YmHkJEl23uEyjCzyc/bOc66xmyBDya/BgIAT2aEcGsVFC6anFATvjKGhAqkhJmjTnPJUKIEygB2bKd1LqOyCatsOG3ZVfr4vvEUBNNeNf068SP09Nd2BqAgG+tfkGMXmGrn/hRkvcVzZCA2hDs5BL60ydCowLbDjWdQAzZoJShbdxvpOzqIoD5eZv6zGkfsueRFjk/05HymZjyR5OfQk9gD1Rq0iEQjmm2RC/8x7Epm6eGSGpDIjRVb86qQIIjbyWfUIvAEgwFHugO65F+aAo9uAqoEQyRIIruH/6T4IX/JLY5bVLUpSKzDasFCSW8tWBIcAMP+iHZ9fTOc9gYcACyK0rZCP1zbPl/+o9HZc6KUlZMbcfo4wfgPP+VQeZXIuNX1YklIYYGvFUwxjCbZo4hS0+JumZ/Zl2IyP6U/LEeUF1IqZh3PSH2KRAHep0oRd0dLxdtNe11HGrykSGTDj6l44587p16Ae+hoWNyP8NskVLEeWLoTzGrPfOj7oMpm22cRbv       <\/span>\n        <span class=\"faq__mais\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"/><\/svg><\/span>\n      <\/a>\n\n      <section class=\"card-seguro\" aria-labelledby=\"titulo-seguro\">\n        <strong id=\"titulo-seguro\">Ambiente 100% seguro<\/strong>\n        Dados criptografados. Você mantém controle total de suas informações.\n      <\/section>\n\n    <\/main>\n  <\/div>\n\n  <script>\n    function ajustarAltura() {\n      document.documentElement.style.setProperty(\"--altura-app\", window.innerHeight + \"px\");\n    }\n\n    ajustarAltura();\n    window.addEventListener(\"resize\", ajustarAltura);\n    window.addEventListener(\"orientationchange\", ajustarAltura);\n  <\/script>\n\n<script>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas em pages/hu-mariana/: index.html (FAQ) → mudanca-endereco.html\n   → novo-endereco.html → pedido-enviado.html\n   O pedido de transferência e o WhatsApp são SIMULADOS: nada é enviado.\n   ========================================================= */\n\nconst CHAVE_PEDIDO = 'bulbe-pedido-transferencia';\n\n/* ---------- Utilitários ---------- */\n\nconst somenteDigitos = (texto) => texto.replace(/\\D/g, '');\n\nfunction mascararCep(texto) {\n  const d = somenteDigitos(texto).slice(0, 8);\n  return d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d;\n}\n\n// sessionStorage pode falhar (aba anônima, bloqueio do navegador): nunca deixa a página quebrar.\nfunction salvarPedido(dados) {\n  try {\n    sessionStorage.setItem(CHAVE_PEDIDO, JSON.stringify(dados));\n  } catch (erro) {\n    console.warn('Não foi possível salvar o pedido nesta sessão.', erro);\n  }\n}\n\nfunction lerPedido() {\n  try {\n    const bruto = sessionStorage.getItem(CHAVE_PEDIDO);\n    return bruto ? JSON.parse(bruto) : null;\n  } catch (erro) {\n    return null;\n  }\n}\n\n/* ---------- Tela 2: Mudei de endereço ---------- */\n\nfunction iniciarTelaMudanca() {\n  // Simulação: na versão real, o link abre o WhatsApp oficial da Bulbe.\n  document.getElementById('botao-whatsapp').addEventListener('click', (evento) => {\n    evento.preventDefault();\n    document.getElementById('status-whatsapp').hidden = false;\n  });\n}\n\n/* ---------- Tela 3: Informe o novo endereço ---------- */\n\nfunction iniciarTelaEndereco() {\n  const form = document.getElementById('form-endereco');\n  const botao = document.getElementById('botao-enviar');\n\n  const campos = {\n    cep: document.getElementById('cep'),\n    rua: document.getElementById('rua'),\n    cidade: document.getElementById('cidade'),\n    conta: document.getElementById('conta')\n  };\n\n  // Regras simples de validação (esboço).\n  const valido = {\n    cep: (campo) => somenteDigitos(campo.value).length === 8,\n    // Precisa de número (ou \"s/n\"), como pede o rótulo \"Rua e número\".\n    rua: (campo) => campo.value.trim().length >= 5 && /\\d|\\bs\\/?n\\b/i.test(campo.value),\n    cidade: (campo) => campo.value.trim().length >= 2,\n    conta: (campo) => campo.files.length > 0\n  };\n\n  const campoValido = (chave) => valido[chave](campos[chave]);\n\n  function mostrarErro(chave) {\n    const campo = campos[chave];\n    const ok = campoValido(chave);\n    campo.setAttribute('aria-invalid', String(!ok));\n    document.getElementById(`${campo.id}-erro`).hidden = ok;\n  }\n\n  function atualizarBotao() {\n    botao.disabled = !Object.keys(campos).every(campoValido);\n  }\n\n  Object.keys(campos).forEach((chave) => {\n    const campo = campos[chave];\n    const evento = chave === 'conta' ? 'change' : 'input';\n    campo.addEventListener(evento, () => {\n      if (chave === 'cep') campo.value = mascararCep(campo.value);\n      if (campo.getAttribute('aria-invalid') === 'true') mostrarErro(chave);\n      atualizarBotao();\n    });\n    campo.addEventListener('blur', () => mostrarErro(chave));\n  });\n\n  form.addEventListener('submit', (evento) => {\n    evento.preventDefault();\n    Object.keys(campos).forEach(mostrarErro);\n    if (botao.disabled) return;\n\n    salvarPedido({\n      cep: campos.cep.value,\n      rua: campos.rua.value.trim(),\n      cidade: campos.cidade.value.trim(),\n      conta: campos.conta.files[0].name\n    });\n    window.__bulbeIr('pedido-enviado.html');\n  });\n}\n\n/* ---------- Tela 4: Pedido enviado ---------- */\n\nfunction iniciarTelaEnviado() {\n  const pedido = lerPedido();\n  if (!pedido) return; // sem pedido salvo, mantém o texto de exemplo do HTML\n\n  // textContent (e não innerHTML) evita injetar HTML vindo do que o usuário digitou.\n  document.getElementById('resumo-endereco').textContent =\n    `${pedido.rua}, ${pedido.cidade} (CEP ${pedido.cep})`;\n  document.getElementById('resumo-conta').textContent = pedido.conta;\n}\n\n/* ---------- Roteamento simples por página ---------- */\n\nconst telas = {\n  mudanca: iniciarTelaMudanca,\n  endereco: iniciarTelaEndereco,\n  enviado: iniciarTelaEnviado\n};\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  const iniciar = telas[document.body.dataset.tela];\n  if (iniciar) iniciar();\n});\n\n<\/script>\n<\/body>\n<\/html>\n", "pages/hu-mariana/mudanca-endereco.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Mudei de endereço · Bulbe<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n  <style>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas nesta pasta: index.html (FAQ) → mudanca-endereco.html → novo-endereco.html → pedido-enviado.html\n\n   Parte 1: base do template do grupo (mesmo CSS de pages/exemplo.html:\n            fonte Poppins, azul #08068D e app 360 x 812).\n   Parte 2: variante de adesão (cabeçalho azul, rodapé de ação)\n            e componentes das quatro telas.\n   ========================================================= */\n\n/* ---------- Parte 1 · Base do template ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\n:root {\n  --azul-bulbe: #08068D;        \n  --azul-claro: #8a9bb5;        \n  --borda: #dde3ec;             \n  --texto-suave: #5b6b82;       \n  --vermelho: #d93a2f;          \n  --fundo-pagina: #ececec;\n  --altura-app: 100dvh;         \n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.barra-topo {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin: 8px 0 14px;\n}\n\n.botao-icone {\n  background: none;\n  border: none;\n  color: var(--azul-bulbe);\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  width: 36px;\n  height: 36px;\n  position: relative;\n}\n\n.logo {\n  font-size: 1.5rem;\n  font-weight: 800;\n  letter-spacing: -0.5px;\n}\n\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.indicador {\n  position: absolute;\n  top: 0;\n  right: 0;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: var(--azul-bulbe);\n  color: #ffffff;\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 0 16px;\n}\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 4px 0 8px; }\n}\n\n/* ---------- Parte 2 · Adesão e telas da HU ---------- */\n/* =========================================================\n   Variação do template para quem AINDA NÃO É CLIENTE (adesão)\n   Uso: <div class=\"app app--adesao\">\n   - Cabeçalho: voltar + logo + etapa (sem sino e sem perfil)\n   - Rodapé: botão de ação da etapa (sem as abas do app logado)\n   Usa só as variáveis do template.css; as novas estão abaixo.\n   ========================================================= */\n\n:root {\n  --verde: #23C97B;\n  --verde-escuro: #0B3D25;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --whatsapp: #075E54;\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n  --desabilitado: #A4B3C1;\n  --raio: 10px;\n  --altura-botao: 48px;\n}\n\n/* ---------- Cabeçalho da adesão ---------- */\n/* Azul da marca com o logo branco, como no app da Bulbe.\n   Se o PR oficial deixar o cabeçalho do template azul, este bloco vira redundante. */\n\n.app--adesao .cabecalho {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone {\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  justify-self: center;\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n.app--adesao .barra-topo {\n  display: grid;\n  grid-template-columns: 44px 1fr 44px;\n  margin: 4px 0 10px;\n}\n\n.app--adesao .botao-icone {\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  text-decoration: none;\n}\n\n.etapa {\n  justify-self: end;\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n.progresso {\n  height: 4px;\n  margin: 0 -16px -12px;   /* encosta nas bordas do app, por baixo do cabeçalho */\n  background: rgba(255, 255, 255, 0.2);\n}\n\n.progresso__barra {\n  height: 100%;\n  background: linear-gradient(90deg, var(--verde), #19A39B);\n}\n\n/* ---------- Conteúdo ---------- */\n\n.app--adesao .conteudo {\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, a área de conteúdo rola (overflow do template). */\n.app--adesao .conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                      /* tipografia de título da Bulbe: Poppins SemiBold 24/32 */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n/* ---------- Rodapé de ação (no lugar das abas) ---------- */\n\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n/* ---------- Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #FFFFFF;\n  font-size: 0.95rem;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n/* ---------- Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;   /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Abas \"Para mim / Para outra pessoa\": um trilho cinza com as duas opções.\n   A marcada fica preenchida no azul da marca, com ✓ (padrão do \"Sim/Não\" da Bulbe).\n   A não marcada não tem borda, para não parecer um campo de digitação. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;   /* \"✓ Para outra pessoa\" cabe numa linha mesmo em 360 px */\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #FFFFFF;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n/* Campo de WhatsApp: ícone do WhatsApp dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;          /* (48px de altura do campo - 20px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.termos a,\n.subtitulo a,\n.link-secundario {\n  color: var(--azul-bulbe);\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela (o resumo da ilustração em palavras) */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n/* ---------- Perguntas frequentes (index.html) ---------- */\n\n.faq {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n}\n\n.faq__item {\n  border-bottom: 1px solid var(--borda);\n}\n\n.faq__pergunta,\n.faq__destaque {\n  list-style: none;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  min-height: 56px;\n  padding: 12px 0;\n  font-size: 0.9rem;\n  line-height: 1.4;\n  color: var(--texto-suave);\n  cursor: pointer;\n}\n\n.faq__mais {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border: 1.5px solid var(--azul-claro);\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--azul-claro);\n}\n\n/* Pergunta nova, com destaque: leva para a tela da HU */\n.faq__destaque {\n  margin-top: 16px;\n  padding: 12px 14px;\n  border: 2px solid #1D5FD1;\n  border-radius: 12px;\n  background: var(--info-fundo);\n  color: var(--azul-bulbe);\n  font-weight: 600;\n  text-decoration: none;\n}\n\n.faq__destaque .faq__mais {\n  border-color: #1D5FD1;\n  color: #1D5FD1;\n}\n\n.faq__destaque-texto {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 6px;\n}\n\n.selo-novo {\n  padding: 1px 8px;\n  border-radius: 999px;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.65rem;\n  font-weight: 700;\n  letter-spacing: 0.4px;\n}\n\n.faq__destaque:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.card-seguro {\n  padding: 14px;\n  border: 1px solid var(--verde-borda);\n  border-radius: 12px;\n  background: var(--verde-fundo);\n  color: var(--verde-escuro);\n  font-size: 0.8rem;\n  line-height: 1.5;\n}\n\n.card-seguro strong {\n  display: block;\n  margin-bottom: 4px;\n  font-size: 0.9rem;\n}\n\n/* ---------- Mudar de endereço (mudanca-endereco.html) ---------- */\n\n.resposta-destaque {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 16px;\n  border-radius: 14px;\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-size: 1.05rem;\n  line-height: 1.4;\n  font-weight: 600;\n}\n\n.resposta-destaque svg {\n  flex: 0 0 auto;\n}\n\n.texto-apoio {\n  font-size: 0.85rem;\n  line-height: 1.5;\n  color: var(--texto-suave);\n}\n\n.passos {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  padding: 16px;\n  border: 1px solid var(--borda);\n  border-radius: 14px;\n}\n\n.passos__titulo {\n  font-size: 1.05rem;\n  font-weight: 600;\n}\n\n.passo {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.passo__numero {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.85rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.acoes {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.botao--contorno {\n  background: #FFFFFF;\n  border: 2px solid var(--whatsapp);\n  color: var(--whatsapp);\n}\n\n.botao--contorno:hover {\n  background: var(--verde-fundo);\n}\n\n.nota-final {\n  text-align: center;\n  font-size: 0.78rem;\n  color: var(--texto-suave);\n}\n\n.status-simulado {\n  padding: 10px 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n/* ---------- Novo endereço (novo-endereco.html) ---------- */\n\n.campo__ajuda {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo--arquivo input[type=\"file\"] {\n  height: auto;\n  padding: 12px;\n  font-size: 0.85rem;\n}\n\n.campo--arquivo input[type=\"file\"]::file-selector-button {\n  margin-right: 10px;\n  padding: 6px 12px;\n  border: 1px solid var(--azul-bulbe);\n  border-radius: 8px;\n  background: #FFFFFF;\n  color: var(--azul-bulbe);\n  font: inherit;\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.linha-dupla {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n\n/* ---------- Pedido enviado (pedido-enviado.html) ---------- */\n\n.selo-sucesso {\n  align-self: center;\n  width: 64px;\n  height: 64px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.centro {\n  text-align: center;\n}\n\n.resumo {\n  padding: 14px;\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  font-size: 0.85rem;\n  line-height: 1.5;\n}\n\n.resumo dt {\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.resumo dd + dt {\n  margin-top: 8px;\n}\n\n.passo--feito .passo__numero {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.campo input::placeholder {\n  color: #A4B3C1;\n}\n\n/* Perguntas antigas: só texto, sem ação (a pergunta nova é a única que leva a outra tela) */\n.faq__pergunta {\n  cursor: default;\n}\n\n<\/style>\n  \n<\/head>\n\n<body data-tela=\"mudanca\">\n\n  <div class=\"app app--adesao\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"11\" rx=\"3\" stroke=\"currentColor\"/>\n            <rect x=\"2.5\" y=\"2.5\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>\n            <rect x=\"22\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n\n      <div
