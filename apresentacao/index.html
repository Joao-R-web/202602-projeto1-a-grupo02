<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apresentação final (offline) · Squad 02 · Bulbe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: palco azul da Bulbe; à esquerda a história de usuário, à direita o celular com a tela real (iframe). */
  :root {
    --palco: #08068D;
    --palco-fundo: #050466;
    --painel: rgba(255, 255, 255, 0.07);
    --borda: rgba(255, 255, 255, 0.16);
    --texto: #ffffff;
    --texto-suave: rgba(255, 255, 255, 0.72);
    --verde: #23C97B;
    --verde-texto: #04301b;
    --aparelho: #0b0b14;
    --fonte: "Poppins", "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--fonte);
    color: var(--texto);
    background: radial-gradient(120% 90% at 85% 10%, #1b3fd1 0%, var(--palco) 45%, var(--palco-fundo) 100%) fixed, var(--palco);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    overflow-x: hidden;
  }

  .palco {
    min-height: calc(100% - 0px);
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 40px;
    align-items: center;
  }

  /* ---------- Painel da história ---------- */

  .painel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .marca {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.8rem;
    color: var(--texto-suave);
  }

  .marca img { height: 26px; width: auto; }

  .contador {
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--texto-suave);
    font-variant-numeric: tabular-nums;
  }

  .painel h1 {
    margin: 0;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    line-height: 1.2;
    font-weight: 700;
    text-wrap: balance;
  }

  .quem {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .etiqueta {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--painel);
    border: 1px solid var(--borda);
  }

  .etiqueta--hu {
    background: var(--verde);
    color: var(--verde-texto);
    border-color: var(--verde);
  }

  .historia {
    margin: 0;
    max-width: 62ch;
    font-size: 1rem;
    line-height: 1.6;
  }

  .bloco {
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bloco h2 {
    margin: 0;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--verde);
  }

  /* Telas do fluxo: atalhos que trocam a tela dentro do celular */
  .telas {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .telas button,
  .controles button,
  .indice button {
    font: inherit;
    color: var(--texto);
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 8px;
    cursor: pointer;
  }

  .telas button {
    padding: 6px 10px;
    font-size: 0.78rem;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .telas button b {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 0.65rem;
    background: rgba(255, 255, 255, 0.16);
  }

  .telas button[aria-current="true"] {
    background: #ffffff;
    color: var(--palco);
    font-weight: 600;
  }

  .telas button[aria-current="true"] b {
    background: var(--verde);
    color: var(--verde-texto);
  }

  .dica {
    margin: 0;
    font-size: 0.75rem;
    color: var(--texto-suave);
  }

  .controles {
    display: flex;
    gap: 8px;
  }

  .controles button {
    flex: 1;
    min-height: 44px;
    font-size: 0.9rem;
    font-weight: 600;
  }

  .controles button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .indice {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .indice button {
    padding: 6px 10px;
    font-size: 0.75rem;
  }

  .indice button[aria-current="true"] {
    background: var(--verde);
    color: var(--verde-texto);
    border-color: var(--verde);
    font-weight: 600;
  }

  button:hover { filter: brightness(1.15); }

  button:focus-visible {
    outline: 3px solid var(--verde);
    outline-offset: 2px;
  }

  /* ---------- Celular ---------- */

  .celular-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .celular {
    --escala: 1;
    width: calc(384px * var(--escala));
    height: calc(836px * var(--escala));
    position: relative;
    flex: none;
  }

  .aparelho {
    position: absolute;
    top: 0;
    left: 0;
    width: 384px;
    height: 836px;
    padding: 12px;
    border-radius: 44px;
    background: var(--aparelho);
    box-shadow: 0 0 0 2px #2a2a3a, 0 30px 70px rgba(0, 0, 0, 0.5);
    transform: scale(var(--escala));
    transform-origin: top left;
  }

  .tela {
    width: 360px;
    height: 812px;
    border-radius: 32px;
    overflow: hidden;
    background: #ffffff;
    position: relative;
  }

  .tela iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* Tela de aviso (fluxo ainda em desenvolvimento) e capa */
  .aviso-tela {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    color: var(--palco);
  }

  .aviso-tela__topo {
    background: var(--palco);
    padding: 52px 16px 16px;
    display: flex;
    justify-content: center;
  }

  .aviso-tela__topo img { height: 29px; width: auto; }

  .aviso-tela__corpo {
    flex: 1;
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    text-align: center;
  }

  .aviso-tela__corpo strong {
    font-size: 1.3rem;
    line-height: 1.3;
  }

  .aviso-tela__corpo p {
    margin: 0;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #5b6b82;
  }

  .selo {
    align-self: center;
    padding: 4px 12px;
    border-radius: 999px;
    background: #FFF4D6;
    color: #7a5200;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .reiniciar {
    font: inherit;
    font-size: 0.78rem;
    color: var(--texto-suave);
    background: none;
    border: 0;
    text-decoration: underline;
    cursor: pointer;
  }

  /* Capa e encerramento: lista de pessoas */
  .equipe {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .equipe li {
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 0.82rem;
    line-height: 1.35;
  }

  .equipe span {
    display: block;
    font-size: 0.72rem;
    color: var(--texto-suave);
  }

  .numero {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--verde);
    line-height: 1;
  }

  /* Capa e encerramento: o card da dor e a lista da equipe, com espaço entre eles */
  #extra {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #extra:empty { display: none; }

  [hidden] { display: none !important; }

  @media (max-width: 860px) {
    .palco {
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
    }
    .celular-area { order: -1; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .painel > * { animation: entrar 0.35s ease both; }
    @keyframes entrar { from { opacity: 0.001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
  .nota-integracao {
    margin: 0;
    padding: 10px 14px;
    border: 1px dashed rgba(255, 255, 255, 0.45);
    border-radius: 12px;
    font-size: 0.85rem;
    color: #DDE3F5;
  }
  .nota-integracao b { color: var(--verde); font-weight: 600; }
  .painel h1.titulo--grande { font-size: clamp(3rem, 7vw, 5.5rem); line-height: 1.05; }
  .disclaimer { margin: 0; font-size: 0.85rem; color: var(--texto-suave, #C9D3F2); opacity: 0.9; }
  /* Capa (vinda do PPTX): linha de contexto e listas de integrantes e professores */
  .eyebrow {
    margin: 0;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--verde);
  }

  .eyebrow:empty { display: none; }

  .capa-grupos {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .capa-grupo h2 {
    margin: 0 0 6px;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #9cc3ff;
  }

  .capa-grupo ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 0.85rem;
    font-weight: 600;
    line-height: 1.4;
  }

  @media (max-width: 520px) {
    .capa-grupos { grid-template-columns: minmax(0, 1fr); }
  }

  /* Slide da dor (vindo do PPTX): número grande e card verde */
  .dor-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 24px;
    align-items: center;
  }

  .dor-numero {
    font-size: clamp(3.5rem, 9vw, 6rem);
    font-weight: 800;
    line-height: 1;
    color: #ffffff;
  }

  .dor-legenda {
    margin: 12px 0 0;
    font-size: 1rem;
    line-height: 1.5;
    max-width: 34ch;
  }

  .dor-cards {
    background: var(--verde);
    color: var(--verde-texto);
    border-radius: 16px;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .dor-cards h2 {
    margin: 0 0 2px;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .dor-cards p {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .dor-grid { grid-template-columns: minmax(0, 1fr); }
  }

  .nota { margin: 0; font-size: 1rem; line-height: 1.6; color: var(--texto-suave); }
  /* Capa, dor e encerramento sem celular: o painel ocupa a largura toda */
  .palco--sem-celular { grid-template-columns: minmax(0, 1fr); max-width: 960px; }
</style>
</head>

  // ---------- Elementos ----------
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  let atual = 0;

  function criar(tag, texto, classe) {
    const el = document.createElement(tag);
    if (texto !== undefined) el.textContent = texto;
    if (classe) el.className = classe;
    return el;
  }

  // ---------- Celular: escala para caber na altura da janela ----------
  function ajustarCelular() {
    const estreito = window.innerWidth <= 860;
    const alturaLivre = estreito ? window.innerHeight * 0.8 : window.innerHeight - 70;
    const larguraLivre = window.innerWidth - 32;
    const escala = Math.min(1, alturaLivre / 836, larguraLivre / 384);
    $('celular').style.setProperty('--escala', Math.max(0.5, escala).toFixed(3));
  }

  // ---------- Telas do fluxo ----------
  function marcarTelaAtual() {
    const s = SLIDES[atual];
    const caminho = telaAtual;
    $('telas').querySelectorAll('button').forEach((b, i) => {
      const alvo = decodeURIComponent(s.telas[i][1].replace(/^(\.\.\/)+/, ''));
      b.setAttribute('aria-current', String(caminho.endsWith(alvo)));
    });
  }

  // Quando um fluxo integrado leva à tela de outra história, o slide acompanha a tela.
  function slideDaTela(caminho) {
    return SLIDES.findIndex((s) => (s.telas || []).some(([, alvo]) =>
      caminho.endsWith(decodeURIComponent(alvo.replace(/^(\.\.\/)+/, '')))));
  }

  app.addEventListener('load', () => {
    const caminho = telaAtual;
    const dono = caminho ? slideDaTela(caminho) : -1;
    if (dono >= 0 && dono !== atual) mostrar(dono, true);
    marcarTelaAtual();
    integrarFluxo();
  });

      return;
    }

    // Reforço: se a tela do Antônio seguiu para a tela 2 com "Para mim" marcado,
    // a apresentação leva para o fluxo do Lucas mesmo assim.
    if (caminho.endsWith('hu-antonio/como-fica.html')) {
      let modo = null;
      try { modo = (JSON.parse(app.contentWindow.sessionStorage.getItem('bulbe-cadastro')) || {}).modo; } catch (e) { /* sem sessão */ }
      if (modo === 'mim') {
        try { app.contentWindow.sessionStorage.removeItem('bulbe-cadastro'); } catch (e) { /* ok */ }
        abrirTela(TELA_LUCAS);
      }
      return;
    }

    if (caminho.endsWith('hu-antonio/index.html') || caminho.endsWith('hu-antonio/')) {
      const paraMim = doc.getElementById('para-mim');
      const etapa = doc.querySelector('.etapa');
      const barra = doc.querySelector('.progresso__barra');
      const atualizar = () => {
        if (etapa) etapa.textContent = paraMim.checked ? '1/4' : '1/3';
        if (barra) barra.style.width = paraMim.checked ? '25%' : '33%';
      };
      doc.querySelectorAll('input[name="para-quem"]').forEach((r) => r.addEventListener('change', atualizar));
      atualizar();
      // Captura o envio antes do script da tela: "Para mim" segue para o fluxo do Lucas.
      const seguirParaLucas = (evento) => {
        if (!paraMim.checked) return;
        const botao = doc.getElementById('botao-proximo');
        if (!botao || botao.disabled) return;
        evento.preventDefault();
        evento.stopPropagation();
        abrirTela(TELA_LUCAS);
      };
      doc.addEventListener('submit', seguirParaLucas, true);
      const botaoProximo = doc.getElementById('botao-proximo');
      if (botaoProximo) botaoProximo.addEventListener('click', seguirParaLucas, true);
      return;
    }

    // Telas de quem já está logado (Maria e Henrique): as abas do rodapé ligam uma à outra.
    const ehMaria = caminho.endsWith('pages/exemplo-elita.html');
    const ehHenrique = ['consumo/index.html', 'consumo-cenarios/index.html', 'consumo-creditos/index.html'].some((k) => caminho.endsWith('pages/' + k));
    if (ehMaria || ehHenrique) {
      const destino = ehMaria
        ? { aba: 'Consumo', tela: 'pages/consumo/index.html' }
        : { aba: 'Conexão', tela: 'pages/exemplo-elita.html' };
      doc.querySelectorAll('.navegacao .nav-item').forEach((item) => {
        if (item.textContent.trim() !== destino.aba) return;
        item.style.cursor = 'pointer';
        item.addEventListener('click', (evento) => {
          evento.preventDefault();
          abrirTela(destino.tela);
        });
      });
      return;
    }

    const chave = Object.keys(ETAPAS_LUCAS).find((k) => caminho.endsWith(k));
    if (chave) {
      const etapa = doc.querySelector('.etapa');
      if (etapa) etapa.textContent = ETAPAS_LUCAS[chave];
      if (chave === 'hu-lucas/index.html') {
        const voltar = doc.querySelector('.barra-topo .botao-icone');
        if (voltar) voltar.setAttribute('href', '../hu-antonio/index.html');
      }
    }
  }

  // Telas embutidas neste arquivo (geradas a partir do repositório)
  const PAGINAS = {"pages/Telas-João/index.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Bulbe<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n\n  <!-- CSS próprio da tela -->\n  <style>\n/* =====================================================\n   CSS PRÓPRIO DA TELA \"COMO FUNCIONA A BULBE\"\n   Tudo fica dentro de .funciona para não mexer nas outras telas.\n   ===================================================== */\n\n.funciona {\n  --f-azul: #08068D;\n  --f-borda: #E2E1F0;\n  --f-texto-suave: #62627A;\n  --f-verde: #159B72;\n  --f-verde-botao: #22C67F;\n  --f-verde-claro: #E5F7F0;\n  --f-fundo-card: #F5F5FA;\n\n  color: var(--f-azul);\n}\n\n/* CARD BRANCO (mesmo estilo dos cards do carrossel) */\n\n.funciona .card-branco {\n  background-color: #ffffff;\n  border: 1px solid var(--f-borda);\n  color: var(--f-azul);\n  border-radius: 20px;\n  padding: 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.funciona .card-branco h2 {\n  font-size: 1.1rem;\n  font-weight: 800;\n}\n\n/* LISTA DE ETAPAS */\n\n.funciona .lista-etapas {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.funciona .lista-etapas li {\n  display: flex;\n  gap: 10px;\n  align-items: flex-start;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n/* NÚMEROS DAS ETAPAS */\n\n.funciona .num {\n  flex: none;\n  width: 22px;\n  height: 22px;\n  border-radius: 50%;\n  background-color: var(--f-verde);\n  color: #ffffff;\n  font-size: 0.75rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n/* BOTÃO VERDE */\n\n.funciona .botao-verde {\n  margin-top: 4px;\n  min-height: 46px;\n  padding: 10px 14px;\n  border: none;\n  border-radius: 12px;\n  background-color: var(--f-verde-botao);\n  color: var(--f-azul);\n  font-family: inherit;\n  font-size: 0.85rem;\n  font-weight: 700;\n  line-height: 1.3;\n  cursor: pointer;\n}\n\n.funciona .botao-verde:hover {\n  filter: brightness(0.95);\n}\n\n/* CARROSSEL */\n\n.funciona .secao-carrossel {\n  margin-top: 22px;\n}\n\n.funciona .secao-carrossel > h2 {\n  font-size: 1rem;\n  font-weight: 800;\n  margin-bottom: 12px;\n}\n\n/* FAIXA DO CARROSSEL */\n\n.funciona .carrossel-faixa {\n  display: flex;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-behavior: smooth;\n  overscroll-behavior-x: contain;\n  scrollbar-width: none;\n  border-radius: 20px;\n}\n\n.funciona .carrossel-faixa::-webkit-scrollbar {\n  display: none;\n}\n\n/* SLIDES */\n\n.funciona .slide {\n  flex: 0 0 100%;\n  min-width: 0;\n  scroll-snap-align: start;\n  scroll-snap-stop: always;\n  display: flex;\n}\n\n.funciona .slide-card {\n  flex: 1;\n  background-color: #ffffff;\n  border: 1px solid var(--f-borda);\n  border-radius: 20px;\n  padding: 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n/* IDENTIFICAÇÃO DA ETAPA */\n\n.funciona .slide-etapa {\n  font-size: 0.75rem;\n  font-weight: 700;\n  color: var(--f-verde);\n}\n\n.funciona .slide-card h3 {\n  font-size: 1.1rem;\n  line-height: 1.25;\n  font-weight: 800;\n}\n\n.funciona .slide-texto {\n  font-size: 0.85rem;\n  line-height: 1.5;\n  color: var(--f-texto-suave);\n}\n\n/* IMAGENS */\n\n.funciona .slide-imagem {\n  width: 100%;\n  height: 150px;\n  object-fit: contain;\n  object-position: center;\n}\n\n.funciona .slide-imagem.foco-casa {\n  object-position: 85% center;\n}\n\n/* PASSOS DOS SLIDES */\n\n.funciona .passos {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.funciona .passos li {\n  display: flex;\n  gap: 10px;\n  align-items: flex-start;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n/* SELOS */\n\n.funciona .selos {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.funciona .selos li {\n  border: 1px solid var(--f-borda);\n  background-color: var(--f-fundo-card);\n  border-radius: 14px;\n  padding: 10px 12px;\n  font-size: 0.85rem;\n  font-weight: 700;\n  text-align: center;\n}\n\n/* CONTROLES DO CARROSSEL */\n\n.funciona .carrossel-controles {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  margin-top: 14px;\n}\n\n.funciona .btn-nav {\n  min-height: 44px;\n  padding: 0 14px;\n  border-radius: 22px;\n  font-family: inherit;\n  font-size: 0.85rem;\n  font-weight: 700;\n  cursor: pointer;\n  transition: opacity 0.2s;\n}\n\n.funciona .btn-voltar {\n  border: 1.5px solid var(--f-azul);\n  background: #ffffff;\n  color: var(--f-azul);\n}\n\n.funciona .btn-avancar {\n  border: 1.5px solid var(--f-azul);\n  background: var(--f-azul);\n  color: #ffffff;\n}\n\n.funciona .btn-nav:disabled {\n  opacity: 0.4;\n  cursor: default;\n}\n\n/* INDICADORES */\n\n.funciona .indicadores {\n  flex: 1;\n  display: flex;\n  justify-content: center;\n}\n\n.funciona .ponto {\n  min-width: 22px;\n  height: 44px;\n  border: none;\n  background: none;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.funciona .ponto::before {\n  content: \"\";\n  display: block;\n  width: 6px;\n  height: 6px;\n  border-radius: 3px;\n  background-color: #D5D4E7;\n  transition: width 0.25s, background-color 0.25s;\n}\n\n.funciona .ponto[aria-current=\"true\"]::before {\n  width: 20px;\n  background-color: var(--f-azul);\n}\n\n/* CARD DE SEGURANÇA */\n\n.funciona .seguranca {\n  margin-top: 16px;\n  background-color: var(--f-verde-claro);\n  border: 1px solid #B8E8D4;\n  border-radius: 20px;\n  padding: 14px;\n  color: #11694E;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n\n.funciona .seguranca-topo {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  font-size: 0.85rem;\n}\n\n.funciona .seguranca-topo strong {\n  flex: 1;\n}\n\n.funciona .selo-tag {\n  font-size: 0.65rem;\n  font-weight: 700;\n  border: 1px solid #A8DCC6;\n  border-radius: 4px;\n  padding: 2px 6px;\n  background: #ffffff;\n}\n\n.funciona .seguranca p {\n  font-size: 0.75rem;\n  line-height: 1.4;\n}\n\n.funciona .seguranca a {\n  font-size: 0.75rem;\n  font-weight: 700;\n  color: inherit;\n}\n\n/* FOCO DE TECLADO */\n\n.funciona button:focus-visible,\n.funciona a:focus-visible,\n.funciona .carrossel-faixa:focus-visible {\n  outline: 3px solid var(--f-verde-botao);\n  outline-offset: 2px;\n}\n\n/* ACESSIBILIDADE */\n\n@media (prefers-reduced-motion: reduce) {\n\n  .funciona .carrossel-faixa {\n    scroll-behavior: auto;\n  }\n\n  .funciona .ponto::before {\n    transition: none;\n  }\n\n}\n<\/style>\n\n  <!-- JavaScript comum do grupo -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n\n  <!-- JavaScript próprio da tela -->\n  <script type=\"module\">\n/* =====================================================\n   JS PRÓPRIO DA TELA \"COMO FUNCIONA A BULBE\"\n   Carrossel das 4 etapas + botão verde que leva até ele.\n   ===================================================== */\n\nconst faixa = document.getElementById(\"faixa\");\n\nconst slides = faixa.querySelectorAll(\".slide\");\n\nconst btnVoltar = document.getElementById(\"btn-voltar\");\n\nconst btnAvancar = document.getElementById(\"btn-avancar\");\n\nconst areaPontos = document.getElementById(\"indicadores\");\n\nlet atual = 0;\n\n\n/* Cria um indicador (bolinha) para cada slide */\n\nconst pontos = Array.from(slides, function (_, i) {\n\n  const p = document.createElement(\"button\");\n\n  p.type = \"button\";\n\n  p.className = \"ponto\";\n\n  p.setAttribute(\"aria-label\", \"Ir para a etapa \" + (i + 1));\n\n  p.addEventListener(\"click\", function () {\n\n    irPara(i);\n\n  });\n\n  areaPontos.appendChild(p);\n\n  return p;\n\n});\n\n\n/* Vai até um slide */\n\nfunction irPara(i) {\n\n  i = Math.max(0, Math.min(slides.length - 1, i));\n\n  faixa.scrollTo({\n    left: i * faixa.clientWidth,\n    behavior: \"smooth\"\n  });\n\n}\n\n\n/* Atualiza botões e indicadores */\n\nfunction atualizar() {\n\n  atual = Math.round(faixa.scrollLeft / faixa.clientWidth);\n\n  pontos.forEach(function (p, i) {\n\n    p.setAttribute(\n      \"aria-current\",\n      i === atual ? \"true\" : \"false\"\n    );\n\n  });\n\n  btnVoltar.disabled = atual === 0;\n\n  btnAvancar.disabled = atual === slides.length - 1;\n\n}\n\n\n/* Detecta a mudança de slide ao arrastar */\n\nlet esperando = false;\n\nfaixa.addEventListener(\"scroll\", function () {\n\n  if (esperando) return;\n\n  esperando = true;\n\n  requestAnimationFrame(function () {\n\n    esperando = false;\n\n    atualizar();\n\n  });\n\n});\n\n\n/* Botão voltar */\n\nbtnVoltar.addEventListener(\"click\", function () {\n\n  irPara(atual - 1);\n\n});\n\n\n/* Botão avançar */\n\nbtnAvancar.addEventListener(\"click\", function () {\n\n  irPara(atual + 1);\n\n});\n\n\n/* Setas do teclado */\n\nfaixa.addEventListener(\"keydown\", function (e) {\n\n  if (e.key === \"ArrowRight\") {\n\n    e.preventDefault();\n\n    irPara(atual + 1);\n\n  }\n\n  if (e.key === \"ArrowLeft\") {\n\n    e.preventDefault();\n\n    irPara(atual - 1);\n\n  }\n\n});\n\n\n/* Mantém o slide certo quando a tela muda de tamanho */\n\nwindow.addEventListener(\"resize\", function () {\n\n  faixa.scrollTo({\n    left: atual * faixa.clientWidth,\n    behavior: \"instant\"\n  });\n\n});\n\n\n/* Botão verde: rola até o carrossel */\n\ndocument.getElementById(\"ir-carrossel\").addEventListener(\"click\", function () {\n\n  document.getElementById(\"carrossel\").scrollIntoView({\n\n    block: \"start\",\n\n    behavior: \"smooth\"\n\n  });\n\n  faixa.focus({\n    preventScroll: true\n  });\n\n});\n\n\n/* Inicializa o carrossel */\n\natualizar();\n<\/script>\n<\/head>\n\n<body>\n\n  <div class=\"app\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n\n        <div class=\"status-icones\">\n\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x imos é\n                  <strong>injetada na rede da Cemig<\/strong>\n                  e transformada em créditos de energia.\n                <\/p>\n              <\/li>\n\n              <li>\n                <span class=\"num\">3<\/span>\n\n                <p>\n                  Quando você se conecta à Bulbe,\n                  <strong>passa a usar esses créditos<\/strong>\n                  e economiza na sua conta de luz.\n                <\/p>\n              <\/li>\n\n            <\/ol>\n\n            <button class=\"botao-verde\" id=\"ir-carrossel\" type=\"button\">\n              Clique aqui para entender mais a fundo como funciona\n            <\/button>\n\n          <\/div>\n\n        <\/section>\n\n        <section class=\"secao-carrossel\" id=\"carrossel\" aria-roledescription=\"carrossel\" aria-label=\"Como a energia é produzida\">\n\n          <h2>Como a energia é produzida?<\/h2>\n\n          <div class=\"carrossel-faixa\" id=\"faixa\" tabindex=\"0\">\n\n            <!-- SLIDE 1 -->\n\n            <article class=\"slide\" aria-label=\"Etapa 1 de 4\">\n\n              <div class=\"slide-card\">\n\n                <span class=\"slide-etapa\">Etapa 1 de 4<\/span>\n\n                <h3>Nós geramos energia limpa<\/h3>\n\n                <p class=\"slide-texto\">\n                  Nossas usinas ficam espalhadas por Minas Gerais.\n                  Sem fumaça e sem queimar nada.\n                <\/p>\n\n                <img class=\"slide-imagem\"\n                  src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYYAAAEECAYAAAAs+JM2AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAOdEVYdFNvZnR3YXJlAEZpZ21hnrGWYwAA28xJREFUeAHsvQeAJGW1NvxUVefpnhx3ZnPeBXZhyTkjOSOIgICimBDFrLhXuWIOFzEHDKAkAznnvCybc96dnHs6h6r6zznvWz17v1+/T++FXdE62szsTE93dXXXCc9zznMA33zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfffPPNN998880333zzzTfff  Avançar →\n            <\/button>\n\n          <\/div>\n\n          <!-- SEGURANÇA -->\n\n          <aside class=\"seguranca\">\n\n            <div class=\"seguranca-topo\">\n\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\n                <path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"/>\n              <\/svg>\n\n              <strong>Ambiente 100% seguro<\/strong>\n\n              <span class=\"selo-tag\">SSL<\/span>\n\n              <span class=\"selo-tag\">LGPD<\/span>\n\n            <\/div>\n\n            <p>\n              Dados criptografados. Você mantém controle total de suas informações.\n            <\/p>\n\n            <a href=\"#\">Ver política de privacidade<\/a>\n\n          <\/aside>\n\n        <\/section>\n\n      <\/div>\n\n    <\/main>\n\n    <!-- RODAPÉ -->\n\n    <footer class=\"rodape rodape--acao\">\n\n      <button type=\"button\" class=\"botao botao--primario\">\n        Quero aderir à Bulbe\n      <\/button>\n\n    <\/footer>\n\n  <\/div>\n\n<\/body>\n<\/html>", "pages/hu-antonio/index.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Informe seus dados · Bulbe<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo e, depois, o CSS só destas telas -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n  <style>\n/* =========================================================\n   HU do Antônio — Explicar as duas contas ao titular\n   CSS só das telas desta pasta (index.html → como-fica.html → mensagem.html).\n\n   Carregado DEPOIS do CSS comum do grupo (../../assets/css/style.css),\n   que já traz cores, fonte, cabeçalho, rodapé, títulos, botões e campos.\n   Aqui fica apenas o que é exclusivo destas telas.\n   ========================================================= */\n\n:root {\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n}\n\n\n/* ---------- Cabeçalho: etapa (1/3) e barra de progresso do cadastro ---------- */\n\n.etapa {\n  justify-self: end;\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n.progresso {\n  height: 4px;\n  margin: 0 -16px -12px;   /* encosta nas bordas do app, por baixo do cabeçalho */\n  background: rgba(255, 255, 255, 0.2);\n}\n\n.progresso__barra {\n  height: 100%;\n  background: linear-gradient(90deg, var(--verde), #19A39B);\n}\n\n\n/* ---------- Tela 3 · Valores no cartão da mensagem ---------- */\n\n.linha {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  gap: 8px;\n  padding: 4px 0;\n}\n\n.linha__nome {\n  font-size: 0.92rem;\n}\n\n.linha__valor {\n  font-size: 0.92rem;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.total {\n  margin-top: 8px;\n  padding-top: 8px;\n  border-top: 1px solid var(--borda);\n}\n\n.total .linha__valor {\n  font-size: 1.4rem;\n  font-weight: 800;\n  color: var(--azul-bulbe);\n}\n\n.economia {\n  margin-top: 8px;\n  padding: 10px 12px;\n  border-radius: 8px;\n  background: var(--verde);\n  display: flex;\n  justify-content: space-between;\n  font-size: 0.85rem;\n  font-weight: 700;\n  color: var(--verde-escuro);\n}\n\n\n/* ---------- Tela 3 · Prévia da mensagem do WhatsApp ---------- */\n\n.previa {\n  border-radius: 12px;\n  overflow: hidden;\n  border: 1px solid var(--borda);\n}\n\n.previa__topo {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 12px;\n  background: var(--whatsapp);\n  color: #FFFFFF;\n}\n\n.previa__avatar {\n  width: 32px;\n  height: 32px;\n  border-radius: 50%;\n  background: #B9D7D1;\n}\n\n.previa__contato strong {\n  display: block;\n  font-size: 0.9rem;\n}\n\n.previa__contato span {\n  font-size: 0.7rem;\n  opacity: 0.85;\n}\n\n.previa__conversa {\n  background: var(--whatsapp-chat);\n  padding: 12px;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 8px;\n}\n\n.previa__aviso {\n  align-self: center;\n  padding: 4px 10px;\n  border-radius: 8px;\n  background: #FFF3C4;\n  font-size: 0.72rem;\n  color: #5C4400;\n}\n\n.balao {\n  max-width: 92%;\n  padding: 8px 10px 6px;\n  border-radius: 10px 0 10px 10px;\n  background: var(--whatsapp-balao);\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.balao__hora {\n  display: block;\n  margin-top: 2px;\n  text-align: right;\n  font-size: 0.68rem;\n  color: #667781;\n}\n\n.cartao-bulbe {\n  margin-top: 6px;\n  border-radius: 8px;\n  overflow: hidden;\n  background: #FFFFFF;\n}\n\n.cartao-bulbe__topo {\n  padding: 10px 12px;\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.cartao-bulbe__topo .marca {\n  display: block;\n  height: 20px;\n  width: auto;\n}\n\n.cartao-bulbe__topo h3 {\n  margin-top: 4px;\n  font-size: 0.9rem;\n  line-height: 1.3;\n}\n\n.cartao-bulbe__corpo {\n  padding: 10px 12px 12px;\n}\n\n.cartao-bulbe .linha__nome,\n.cartao-bulbe .linha__valor {\n  font-size: 0.8rem;\n}\n\n.cartao-bulbe .riscado {\n  text-decoration: line-through;\n  color: var(--texto-suave);\n}\n\n.cartao-bulbe .total .linha__valor {\n  font-size: 1.15rem;\n}\n\n.cartao-bulbe .economia {\n  font-size: 0.8rem;\n}\n\n.legitimo {\n  margin-top: 10px;\n  padding: 10px;\n  border-radius: 8px;\n  background: var(--info-fundo);\n  font-size: 0.75rem;\n  line-height: 1.45;\n  color: var(--info-texto);\n}\n\n\n/* ---------- Tela 3 · Confirmação de envio ---------- */\n\n.envio-ok {\n  padding: 12px;\n  border-radius: var(--raio);\n  border: 1px solid var(--verde-borda);\n  background: var(--verde-fundo);\n  font-size: 0.8rem;\n  line-height: 1.45;\n  color: var(--verde-escuro);\n}\n\n/* =========================================================\n   Tela 2 · \"Uma fatura que vira duas\"\n   Paleta (60-30-10): neutros na Cemig e no fundo, azul da marca na Bulbe\n   e na navegação, verde só na economia e no WhatsApp.\n   O \"Continuar\" azul do rodapé é o maior peso da tela.\n   ========================================================= */\n:root {\n  --fundo-ilustra: #F6F8FB;\n  --papel-antes: #DCE3EC;\n  --papel-cemig: #B8C3D4;\n  --verde-texto: #15803D;\n  --verde-suave: #E9F8EF;\n  --verde-tracejado: #22A06B;\n}\n\n.ilustra {\n  background: var(--fundo-ilustra);\n  border-radius: 16px;\n  padding: 18px 14px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\n.ilustra__grade {\n  display: grid;\n  grid-template-columns: 1fr 52px 1fr;\n  align-items: start;\n}\n\n.coluna {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.seta {\n  align-self: start;\n}\n\n.legenda-col {\n  text-align: center;\n  line-height: 1.25;\n}\n\n.legenda-col span {\n  display: block;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.legenda-col em {\n  font-style: normal;\n  font-weight: 700;\n  color: var(--azul-bulbe);\n}\n\n.legenda-col strong {\n  font-size: 1.05rem;\n  color: var(--azul-bulbe);\n}\n\n.legenda-col--antes strong {\n  font-weight: 600;\n  color: var(--texto-suave);\n}\n\n/* ---------- Fatura: borda picotada, canto dobrado e código de barras ---------- */\n.fatura {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  text-align: center;\n  line-height: 1.2;\n  padding: 8px 8px 12px;\n  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), 93.75% 100%, 87.5% calc(100% - 6px), 81.25% 100%, 75% calc(100% - 6px), 68.75% 100%, 62.5% calc(100% - 6px), 56.25% 100%, 50% calc(100% - 6px), 43.75% 100%, 37.5% calc(100% - 6px), 31.25% 100%, 25% calc(100% - 6px), 18.75% 100%, 12.5% calc(100% - 6px), 6.25% 100%, 0 calc(100% - 6px));\n}\n\n.fatura::after {               /* canto dobrado */\n  content: \"\";\n  position: absolute;\n  top: 0;\n  right: 0;\n  width: 16px;\n  height: 16px;\n  background: linear-gradient(225deg, var(--fundo-ilustra) 50%, rgba(0, 0, 0, 0.18) 50%);\n}\n\n.fatura__rotulo {\n  font-size: 0.62rem;\n  font-weight: 700;\n  letter-spacing: 1.5px;\n  text-transform: uppercase;\n  opacity: 0.75;\n}\n\n.fatura__empresa {\n  font-size: 0.85rem;\n  font-weight: 700;\n}\n\n.fatura__logo {\n  display: block;\n  height: 19px;\n  width: auto;\n  margin: 2px 0;\n}\n\n.fatura__valor {\n  font-size: 0.95rem;\n  font-weight: 700;\n}\n\n.codigo {\n  align-self: stretch;\n  height: 14px;\n  margin-top: auto;\n  background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 4px, currentColor 4px 5px, transparent 5px 8px);\n  opacity: 0.45;\n}\n\n.fatura--antes {\n  height: 230px;\n  background: var(--papel-antes);\n  color: var(--texto-suave);\n  gap: 6px;\n}\n\n.fatura--antes .raio {\n  margin-top: 48px;\n}\n\n.pilha {\n  height: 230px;\n  display: flex;\n  flex-direction: column;\n}\n\n.economia-pedaco {\n  flex: 0 0 24px;\n  margin-bottom: 4px;\n  border: 2px dashed var(--verde-tracejado);\n  border-radius: 6px;\n  background: var(--verde-suave);\n  color: var(--verde-texto);\n  font-size: 0.72rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 3px;\n}\n\n.fatura--bulbe {\n  flex: 0 0 142px;\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  gap: 4px;\n}\n\n.fatura--bulbe .sol {\n  margin: 2px 0;\n}\n\n.fatura--cemig {\n  flex: 0 0 52px;\n  margin-top: 8px;             /* espaço: são dois papéis diferentes */\n  background: var(--papel-cemig);\n  color: #17305a;\n  justify-content: center;\n  padding-bottom: 10px;\n}\n\n.fatura__linha {\n  font-size: 0.75rem;\n  font-weight: 600;\n}\n\n.fatura__linha b {\n  font-weight: 800;\n}\n\n.resultado {\n  padding: 10px 12px;\n  border-radius: 999px;\n  background: var(--verde-suave);\n  color: var(--verde-texto);\n  font-size: 0.9rem;\n  text-align: center;\n}\n\n.resultado strong {\n  font-size: 1rem;\n}\n\n/* ---------- Card do titular ---------- */\n.card-titular {\n  background: #DDF3E6;          /* um tom acima do verde da economia (#E9F8EF), para não se confundirem */\n  border: 1px solid #6FCB9A;\n  border-radius: 12px;\n  padding: 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.card-titular h2 {\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.card-titular p {\n  font-size: 0.8rem;\n  line-height: 1.45;\n  color: var(--texto-suave);\n}\n\n/* Botão do WhatsApp: verde médio com \"degrau\" embaixo (parece apertável),\n   mais escuro que o fundo do card e mais leve que o \"Continuar\" azul. */\n.botao--whatsapp-suave {\n  min-height: 46px;\n  padding: 0 12px;\n  background: #7ccda3;\n  color: #064E3B;\n  font-size: 0.84rem;\n  font-weight: 700;\n  white-space: nowrap;\n  box-shadow: 0 2px 0 #3f9e6f;\n}\n\n.botao--whatsapp-suave:hover {\n  background: #6bc497;\n}\n\n<\/style>\n\n  <!-- JavaScript comum do grupo e o destas telas -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n  <script type=\"module\">\nconst { formatarReais, mascararWhatsApp, whatsAppValido } = window.BulbeComum;\n\n/* =========================================================\n   HU do Antônio — Explicar as duas contas ao titular\n   Telas em pages/hu-antonio/: index.html (dados) → como-fica.html (conta) → mensagem.html (prévia)\n   O envio ao titular é SIMULADO: nenhuma mensagem real é enviada.\n   As funções genéricas (valores em reais, máscara e validação de WhatsApp)\n   vêm do JavaScript comum do grupo (assets/js/main.js).\n   ========================================================= */\n\n// Valores de EXEMPLO. Na versão real, vêm da conta de luz enviada pelo cliente.\nconst VALORES = {\n  antes: 281.93,      // conta só da Cemig, antes da Bulbe\n  cemig: 52.06,       // taxas e iluminação pública que continuam na Cemig\n  bulbe: 199.87       // energia solar com desconto, cobrada pela Bulbe\n};\nVALORES.total = VALORES.cemig + VALORES.bulbe;\nVALORES.economia = VALORES.antes - VALORES.total;\n\n// Endereço de EXEMPLO. Na versão real, vem do cadastro da instalação.\nconst ENDERECO_EXEMPLO = 'Rua das Acácias, 120, Betim';\n\nconst CHAVE_CADASTRO = 'bulbe-cadastro';\n\n/* ---------- Utilitários ---------- */\n\n// sessionStorage pode falhar (aba anônima, bloqueio do navegador): nunca deixa a página quebrar.\nfunction salvarCadastro(dados) {\n  try {\n    sessionStorage.setItem(CHAVE_CADASTRO, JSON.stringify(dados));\n  } catch (erro) {\n    console.warn('Não foi possível salvar o cadastro nesta sessão.', erro);\n  }\n}\n\nfunction lerCadastro() {\n  try {\n    const bruto = sessionStorage.getItem(CHAVE_CADASTRO);\n    return bruto ? JSON.parse(bruto) : null;\n  } catch (erro) {\n    return null;\n  }\n}\n\nfunction primeiroNome(nomeCompleto) {\n  const nome = (nomeCompleto || '').trim().split(/\\s+/)[0];\n  return nome || 'Titular';\n}\n\n// Preenche elementos marcados com data-valor=\"antes|cemig|bulbe|total|economia\".\nfunction preencherValores(raiz = document) {\n  raiz.querySelectorAll('[data-valor]').forEach((el) => {\n    const chave = el.dataset.valor;\n    if (chave in VALORES) el.textContent = formatarReais(VALORES[chave]);\n  });\n}\n\n/* ---------- Tela 1: Informe seus dados ---------- */\n\nfunction iniciarTelaDados() {\n  const form = document.getElementById('form-dados');\n  const grupoTitular = document.getElementById('grupo-titular');\n  const avisoFamiliar = document.getElementById('aviso-familiar');\n  const tituloSeusDados = document.getElementById('titulo-seus-dados');\n  const botao = document.getElementById('botao-proximo');\n\n  const campos = {\n    titularNome: document.getElementById('titular-nome'),\n    titularWhats: document.getElementById('titular-whats'),\n    seuNome: document.getElementById('seu-nome'),\n    seuWhats: document.getElementById('seu-whats')\n  };\n\n  const modoAtual = () => form.querySelector('input[name=\"para-quem\"]:checked').value;\n\n  // Regras simples de validação (esboço).\n  const valido = {\n    nome: (v) => v.trim().length >= 3,\n    whats: whatsAppValido\n  };\n\n  function campoValido(input) {\n    if (input.closest('[hidden]')) return true; // campo escondido não conta\n    const regra = input.type === 'tel' ? valido.whats : valido.nome;\n    return regra(input.value);\n  }\n\n  function mostrarErro(input) {\n    const erro = document.getElementById(`${input.id}-erro`);\n    const ok = campoValido(input);\n    input.setAttribute('aria-invalid', String(!ok));\n    erro.hidden = ok;\n  }\n\n  function atualizarModo() {\n    const outraPessoa = modoAtual() === 'outra';\n    grupoTitular.hidden = !outraPessoa;\n    avisoFamiliar.hidden = !outraPessoa;\n    tituloSeusDados.textContent = outraPessoa ? 'Seus dados' : 'Seus dados (titular da conta)';\n    atualizarBotao();\n  }\n\n  function atualizarBotao() {\n    botao.disabled = !Object.values(campos).every(campoValido);\n  }\n\n  form.querySelectorAll('input[name=\"para-quem\"]').forEach((r) =>\n    r.addEventListener('change', atualizarModo)\n  );\n\n  Object.values(campos).forEach((input) => {\n    input.addEventListener('input', () => {\n      if (input.type === 'tel') input.value = mascararWhatsApp(input.value);\n      if (input.getAttribute('aria-invalid') === 'true') mostrarErro(input);\n      atualizarBotao();\n    });\n    input.addEventListener('blur', () => mostrarErro(input));\n  });\n\n  form.addEventListener('submit', (evento) => {\n    evento.preventDefault();\n    Object.values(campos).forEach(mostrarErro);\n    if (botao.disabled) return;\n\n    const outraPessoa = modoAtual() === 'outra';\n    salvarCadastro({\n      modo: outraPessoa ? 'outra' : 'mim',\n      titularNome: outraPessoa ? campos.titularNome.value.trim() : campos.seuNome.value.trim(),\n      titularWhats: outraPessoa ? campos.titularWhats.value : campos.seuWhats.value,\n      seuNome: campos.seuNome.value.trim(),\n      seuWhats: campos.seuWhats.value\n    });\n    window.__bulbeIr('como-fica.html');\n  });\n\n  atualizarModo();\n}\n\n/* ---------- Tela 2: Veja como fica a conta ---------- */\n\n// Alturas da ilustração proporcionais aos valores: a pilha \"agora\" (economia + Bulbe + Cemig)\n// tem a mesma altura da fatura \"antes\". A fatura da Cemig tem altura mínima para o texto caber.\nfunction preencherFaturas() {\n  const ALTURA_TOTAL = 230;   // mesma altura da fatura de antes, no CSS\n  const ESPACOS = 12;         // margens entre economia, Bulbe e Cemig\n  const MINIMO_CEMIG = 52;\n\n  const escala = (ALTURA_TOTAL - ESPACOS) / VALORES.antes;\n  const economia = VALORES.economia * escala;\n  const cemig = Math.max(MINIMO_CEMIG, VALORES.cemig * escala);\n  const bulbe = ALTURA_TOTAL - ESPACOS - economia - cemig;\n\n  const alturas = { economia, bulbe, cemig };\n  Object.entries(alturas).forEach(([chave, altura]) => {\n    const el = document.querySelector(`[data-altura=\"${chave}\"]`);\n    if (el) el.style.flexBasis = `${altura}px`;\n  });\n}\n\nfunction iniciarTelaConta() {\n  const cadastro = lerCadastro();\n  const outraPessoa = !cadastro || cadastro.modo === 'outra';\n\n  preencherValores();\n  preencherFaturas();\n\n  document.getElementById('titulo-conta').textContent = outraPessoa\n    ? 'Veja como fica a conta de luz do titular'\n    : 'Veja como fica a sua conta de luz';\n\n  // O aviso ao titular só faz sentido quando o cadastro é para outra pessoa.\n  document.getElementById('alerta-titular').hidden = !outraPessoa;\n}\n\n/* ---------- Tela 3: Prévia da mensagem no WhatsApp ---------- */\n\nfunction iniciarTelaMensagem() {\n  const cadastro = lerCadastro();\n  const nome = primeiroNome(cadastro && cadastro.titularNome);\n\n  preencherValores();\n  // textContent (e não innerHTML) evita injetar HTML vindo do que o usuário digitou.\n  document.querySelectorAll('[data-nome-titular]').forEach((el) => {\n    el.textContent = nome;\n  });\n  document.getElementById('contato-nome').textContent =\n    (cadastro && cadastro.titularNome) || 'Titular da conta';\n  document.getElementById('endereco').textContent = ENDERECO_EXEMPLO;\n\n  // Envio SIMULADO: nesta versão nada sai do app. Na versão real, a Bulbe envia pelo WhatsApp.\n  const botaoEnviar = document.getElementById('botao-enviar');\n  botaoEnviar.addEventListener('click', () => {\n    const status = document.getElementById('status-envio');\n    status.hidden = false;\n    status.scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n    document.getElementById('aviso-previa').textContent = 'Mensagem enviada';\n    botaoEnviar.textContent = 'Mensagem enviada';\n    botaoEnviar.disabled = true;\n  });\n}\n\n/* ---------- Roteamento simples por página ---------- */\n\nconst telas = {\n  dados: iniciarTelaDados,\n  conta: iniciarTelaConta,\n  mensagem: iniciarTelaMensagem\n};\n\n// Módulos rodam depois que a página é lida, então o HTML já está pronto aqui.\nconst iniciar = telas[document.body.dataset.tela];\nif (iniciar) iniciar();\n\n<\/script>\n<\/head>\n\n<body data-tela=\"dados\">\n\n  <div class=\"app\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"11\" rx=\"3\" stroke=\"currentColor\"/>\n            <rect x=\"2.5\" y=\"2.5\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>\n            <rect x=\"22\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n\n      <div class=\"barra-topo\">\n        <button type=\"button\" class=\"botao-icone\" aria-label=\"Voltar\" onclick=\"window.__bulbeVoltar()\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <path d=\"M15 18l-6-6 6-6\"/>\n          <\/svg>\n        <\/button>\n        <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAABzCAYAAAC2GFRUAAARxUlEQVR42u2dQW8bR5qG32rLziEZpPeW2LOYFtZe5GbyF6T1C0L/AlMJsMCcTN2ysx6IQrxzJXWaS2zSv0DyLxB1miPpW3aSBdsHLxaYg5nLAnESfXvooszRWBLZVdVdXf0+gOAEEtndX7
