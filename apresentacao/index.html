o-whatsapp\">\n          <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAOdEVYdFNvZnR3YXJlAEZpZ21hnrGWYwAAA1BJREFUeAHVVWtuEzEQHjvZwg8E4QQsF4BFIKAIIYdnC1SkEi9RoeYGtCdIcgLCCVgkxOMPjXi1CES2QrRAQV1O0OUGQaJCkHiGz6EJadI29B+M5PV6bM83883YJvqXJDef913bzB61ocHFXIZ4+w0SMUppNIVfac6hi/GdpbouVwbDZNMAIwtjE1rpAoxmYKymhGZZcUKkSQv5omkvoXcWhLj4eP/d0l8DjHwcu61I54U5Ea0mnx64W1lz3afreRIukChfSKJvaW802hfWNgQ4tzB2E/FPYOqO53kTla4Na8n599eKpFQBkUTPDt7PrgswNH81D0puo1WeH7o3SpuQsx+uleHYDWt58sWRh+WWXncuQpgFEU6YedKNzfxV//Tc5akzc1cm+gEMeANFC0phsWBccXQDnHp7KQ8AH4tKM4MPEqfzxE6hZnJM4LmPOCqt0C1UWSa9nM73ADBJDp5TStejtk4kQESuNDPmzUXTD6Tx40fILDU4daEXQGSXFRvPDFaSlg5V9AV6gCP0dCPpBxBlK4gClUcS9ADA2E7Y+tq5gYXKjAjgVRJ1AG8k8B5OcW8OxB0Xkh2rPDr2qOzqG1GYo7O5vnlwYrmxg1dOu5N0e4JkSTEF3RtUg0ZZyyJcKB6JRnyWemkr9HU1UIUushi/y84kbUdZMqIk7omArf1s2WYOvzxvVkUBXuussvAqQbbzmtKLP5VXReJ9tHxKeUumapqUHK4O+SA0wNo1AFBpzdDSPN4dxbtsJZkzT3ajyEqgsYZq811umrSyjaNs9Pu0W1V0lyHs3Gkz0Gno0OthhK0MN+r7Fk6/jGkNMdVcZpl/5rAR3qraNr0cOoBgesjfMqCXQE/y4fj0burOQdMBuAipfVzHeIsydGGnzhlPeVJFiVJa06q7SP9ZZMApGbTZ5njKZIJnpwLqI8H0SaNTXHVXN0tjsjPhTtoUBS9O5DCcwm/cvP+1Mm7SlSlCA6ccxcNR0nKGUp7B7LgCpehrgksuHn4ddjvQBtgzfSJUmsbdSYEWx119xk+iZCXpK6+Ze9Xcc/Z7p3LjkGyqFA+v9rwl7Ry4Y0asSnivonjoVfSHAlO0pA3qO1DalSZYZXYRxvq7DePRqO978X/LL1R627W936OEAAAAAElFTkSuQmCC\" alt=\"\" width=\"20\" height=\"20\">\n          Falar no WhatsApp\n        <\/a>\n        <p class=\"status-simulado\" id=\"status-whatsapp\" hidden role=\"status\">Simulação: aqui abriria a conversa com a Bulbe no WhatsApp.<\/p>\n      <\/div>\n\n      <p class=\"nota-final\">Só consultar não inicia nenhum cancelamento.<\/p>\n\n    <\/main>\n  <\/div>\n\n  <script>\n    function ajustarAltura() {\n      document.documentElement.style.setProperty(\"--altura-app\", window.innerHeight + \"px\");\n    }\n\n    ajustarAltura();\n    window.addEventListener(\"resize\", ajustarAltura);\n    window.addEventListener(\"orientationchange\", ajustarAltura);\n  <\/script>\n\n<script>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas em pages/hu-mariana/: index.html (FAQ) → mudanca-endereco.html\n   → novo-endereco.html → pedido-enviado.html\n   O pedido de transferência e o WhatsApp são SIMULADOS: nada é enviado.\n   ========================================================= */\n\nconst CHAVE_PEDIDO = 'bulbe-pedido-transferencia';\n\n/* ---------- Utilitários ---------- */\n\nconst somenteDigitos = (texto) => texto.replace(/\\D/g, '');\n\nfunction mascararCep(texto) {\n  const d = somenteDigitos(texto).slice(0, 8);\n  return d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d;\n}\n\n// sessionStorage pode falhar (aba anônima, bloqueio do navegador): nunca deixa a página quebrar.\nfunction salvarPedido(dados) {\n  try {\n    sessionStorage.setItem(CHAVE_PEDIDO, JSON.stringify(dados));\n  } catch (erro) {\n    console.warn('Não foi possível salvar o pedido nesta sessão.', erro);\n  }\n}\n\nfunction lerPedido() {\n  try {\n    const bruto = sessionStorage.getItem(CHAVE_PEDIDO);\n    return bruto ? JSON.parse(bruto) : null;\n  } catch (erro) {\n    return null;\n  }\n}\n\n/* ---------- Tela 2: Mudei de endereço ---------- */\n\nfunction iniciarTelaMudanca() {\n  // Simulação: na versão real, o link abre o WhatsApp oficial da Bulbe.\n  document.getElementById('botao-whatsapp').addEventListener('click', (evento) => {\n    evento.preventDefault();\n    document.getElementById('status-whatsapp').hidden = false;\n  });\n}\n\n/* ---------- Tela 3: Informe o novo endereço ---------- */\n\nfunction iniciarTelaEndereco() {\n  const form = document.getElementById('form-endereco');\n  const botao = document.getElementById('botao-enviar');\n\n  const campos = {\n    cep: document.getElementById('cep'),\n    rua: document.getElementById('rua'),\n    cidade: document.getElementById('cidade'),\n    conta: document.getElementById('conta')\n  };\n\n  // Regras simples de validação (esboço).\n  const valido = {\n    cep: (campo) => somenteDigitos(campo.value).length === 8,\n    // Precisa de número (ou \"s/n\"), como pede o rótulo \"Rua e número\".\n    rua: (campo) => campo.value.trim().length >= 5 && /\\d|\\bs\\/?n\\b/i.test(campo.value),\n    cidade: (campo) => campo.value.trim().length >= 2,\n    conta: (campo) => campo.files.length > 0\n  };\n\n  const campoValido = (chave) => valido[chave](campos[chave]);\n\n  function mostrarErro(chave) {\n    const campo = campos[chave];\n    const ok = campoValido(chave);\n    campo.setAttribute('aria-invalid', String(!ok));\n    document.getElementById(`${campo.id}-erro`).hidden = ok;\n  }\n\n  function atualizarBotao() {\n    botao.disabled = !Object.keys(campos).every(campoValido);\n  }\n\n  Object.keys(campos).forEach((chave) => {\n    const campo = campos[chave];\n    const evento = chave === 'conta' ? 'change' : 'input';\n    campo.addEventListener(evento, () => {\n      if (chave === 'cep') campo.value = mascararCep(campo.value);\n      if (campo.getAttribute('aria-invalid') === 'true') mostrarErro(chave);\n      atualizarBotao();\n    });\n    campo.addEventListener('blur', () => mostrarErro(chave));\n  });\n\n  form.addEventListener('submit', (evento) => {\n    evento.preventDefault();\n    Object.keys(campos).forEach(mostrarErro);\n    if (botao.disabled) return;\n\n    salvarPedido({\n      cep: campos.cep.value,\n      rua: campos.rua.value.trim(),\n      cidade: campos.cidade.value.trim(),\n      conta: campos.conta.files[0].name\n    });\n    window.__bulbeIr('pedido-enviado.html');\n  });\n}\n\n/* ---------- Tela 4: Pedido enviado ---------- */\n\nfunction iniciarTelaEnviado() {\n  const pedido = lerPedido();\n  if (!pedido) return; // sem pedido salvo, mantém o texto de exemplo do HTML\n\n  // textContent (e não innerHTML) evita injetar HTML vindo do que o usuário digitou.\n  document.getElementById('resumo-endereco').textContent =\n    `${pedido.rua}, ${pedido.cidade} (CEP ${pedido.cep})`;\n  document.getElementById('resumo-conta').textContent = pedido.conta;\n}\n\n/* ---------- Roteamento simples por página ---------- */\n\nconst telas = {\n  mudanca: iniciarTelaMudanca,\n  endereco: iniciarTelaEndereco,\n  enviado: iniciarTelaEnviado\n};\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  const iniciar = telas[document.body.dataset.tela];\n  if (iniciar) iniciar();\n});\n\n<\/script>\n<\/body>\n<\/html>\n", "pages/hu-mariana/novo-endereco.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Novo endereço · Bulbe<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n  <style>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas nesta pasta: index.html (FAQ) → mudanca-endereco.html → novo-endereco.html → pedido-enviado.html\n\n   Parte 1: base do template do grupo (mesmo CSS de pages/exemplo.html:\n            fonte Poppins, azul #08068D e app 360 x 812).\n   Parte 2: variante de adesão (cabeçalho azul, rodapé de ação)\n            e componentes das quatro telas.\n   ========================================================= */\n\n/* ---------- Parte 1 · Base do template ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\n:root {\n  --azul-bulbe: #08068D;        \n  --azul-claro: #8a9bb5;        \n  --borda: #dde3ec;             \n  --texto-suave: #5b6b82;       \n  --vermelho: #d93a2f;          \n  --fundo-pagina: #ececec;\n  --altura-app: 100dvh;         \n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.barra-topo {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin: 8px 0 14px;\n}\n\n.botao-icone {\n  background: none;\n  border: none;\n  color: var(--azul-bulbe);\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  width: 36px;\n  height: 36px;\n  position: relative;\n}\n\n.logo {\n  font-size: 1.5rem;\n  font-weight: 800;\n  letter-spacing: -0.5px;\n}\n\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.indicador {\n  position: absolute;\n  top: 0;\n  right: 0;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: var(--azul-bulbe);\n  color: #ffffff;\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 0 16px;\n}\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 4px 0 8px; }\n}\n\n/* ---------- Parte 2 · Adesão e telas da HU ---------- */\n/* =========================================================\n   Variação do template para quem AINDA NÃO É CLIENTE (adesão)\n   Uso: <div class=\"app app--adesao\">\n   - Cabeçalho: voltar + logo + etapa (sem sino e sem perfil)\n   - Rodapé: botão de ação da etapa (sem as abas do app logado)\n   Usa só as variáveis do template.css; as novas estão abaixo.\n   ========================================================= */\n\n:root {\n  --verde: #23C97B;\n  --verde-escuro: #0B3D25;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --whatsapp: #075E54;\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n  --desabilitado: #A4B3C1;\n  --raio: 10px;\n  --altura-botao: 48px;\n}\n\n/* ---------- Cabeçalho da adesão ---------- */\n/* Azul da marca com o logo branco, como no app da Bulbe.\n   Se o PR oficial deixar o cabeçalho do template azul, este bloco vira redundante. */\n\n.app--adesao .cabecalho {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone {\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  justify-self: center;\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n.app--adesao .barra-topo {\n  display: grid;\n  grid-template-columns: 44px 1fr 44px;\n  margin: 4px 0 10px;\n}\n\n.app--adesao .botao-icone {\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  text-decoration: none;\n}\n\n.etapa {\n  justify-self: end;\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n.progresso {\n  height: 4px;\n  margin: 0 -16px -12px;   /* encosta nas bordas do app, por baixo do cabeçalho */\n  background: rgba(255, 255, 255, 0.2);\n}\n\n.progresso__barra {\n  height: 100%;\n  background: linear-gradient(90deg, var(--verde), #19A39B);\n}\n\n/* ---------- Conteúdo ---------- */\n\n.app--adesao .conteudo {\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, a área de conteúdo rola (overflow do template). */\n.app--adesao .conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                      /* tipografia de título da Bulbe: Poppins SemiBold 24/32 */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n/* ---------- Rodapé de ação (no lugar das abas) ---------- */\n\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n/* ---------- Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #FFFFFF;\n  font-size: 0.95rem;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n/* ---------- Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;   /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Abas \"Para mim / Para outra pessoa\": um trilho cinza com as duas opções.\n   A marcada fica preenchida no azul da marca, com ✓ (padrão do \"Sim/Não\" da Bulbe).\n   A não marcada não tem borda, para não parecer um campo de digitação. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;   /* \"✓ Para outra pessoa\" cabe numa linha mesmo em 360 px */\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #FFFFFF;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n/* Campo de WhatsApp: ícone do WhatsApp dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;          /* (48px de altura do campo - 20px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.termos a,\n.subtitulo a,\n.link-secundario {\n  color: var(--azul-bulbe);\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela (o resumo da ilustração em palavras) */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n/* ---------- Perguntas frequentes (index.html) ---------- */\n\n.faq {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n}\n\n.faq__item {\n  border-bottom: 1px solid var(--borda);\n}\n\n.faq__pergunta,\n.faq__destaque {\n  list-style: none;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  min-height: 56px;\n  padding: 12px 0;\n  font-size: 0.9rem;\n  line-height: 1.4;\n  color: var(--texto-suave);\n  cursor: pointer;\n}\n\n.faq__mais {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border: 1.5px solid var(--azul-claro);\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--azul-claro);\n}\n\n/* Pergunta nova, com destaque: leva para a tela da HU */\n.faq__destaque {\n  margin-top: 16px;\n  padding: 12px 14px;\n  border: 2px solid #1D5FD1;\n  border-radius: 12px;\n  background: var(--info-fundo);\n  color: var(--azul-bulbe);\n  font-weight: 600;\n  text-decoration: none;\n}\n\n.faq__destaque .faq__mais {\n  border-color: #1D5FD1;\n  color: #1D5FD1;\n}\n\n.faq__destaque-texto {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 6px;\n}\n\n.selo-novo {\n  padding: 1px 8px;\n  border-radius: 999px;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.65rem;\n  font-weight: 700;\n  letter-spacing: 0.4px;\n}\n\n.faq__destaque:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.card-seguro {\n  padding: 14px;\n  border: 1px solid var(--verde-borda);\n  border-radius: 12px;\n  background: var(--verde-fundo);\n  color: var(--verde-escuro);\n  font-size: 0.8rem;\n  line-height: 1.5;\n}\n\n.card-seguro strong {\n  display: block;\n  margin-bottom: 4px;\n  font-size: 0.9rem;\n}\n\n/* ---------- Mudar de endereço (mudanca-endereco.html) ---------- */\n\n.resposta-destaque {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 16px;\n  border-radius: 14px;\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-size: 1.05rem;\n  line-height: 1.4;\n  font-weight: 600;\n}\n\n.resposta-destaque svg {\n  flex: 0 0 auto;\n}\n\n.texto-apoio {\n  font-size: 0.85rem;\n  line-height: 1.5;\n  color: var(--texto-suave);\n}\n\n.passos {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  padding: 16px;\n  border: 1px solid var(--borda);\n  border-radius: 14px;\n}\n\n.passos__titulo {\n  font-size: 1.05rem;\n  font-weight: 600;\n}\n\n.passo {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.passo__numero {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.85rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.acoes {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.botao--contorno {\n  background: #FFFFFF;\n  border: 2px solid var(--whatsapp);\n  color: var(--whatsapp);\n}\n\n.botao--contorno:hover {\n  background: var(--verde-fundo);\n}\n\n.nota-final {\n  text-align: center;\n  font-size: 0.78rem;\n  color: var(--texto-suave);\n}\n\n.status-simulado {\n  padding: 10px 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n/* ---------- Novo endereço (novo-endereco.html) ---------- */\n\n.campo__ajuda {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo--arquivo input[type=\"file\"] {\n  height: auto;\n  padding: 12px;\n  font-size: 0.85rem;\n}\n\n.campo--arquivo input[type=\"file\"]::file-selector-button {\n  margin-right: 10px;\n  padding: 6px 12px;\n  border: 1px solid var(--azul-bulbe);\n  border-radius: 8px;\n  background: #FFFFFF;\n  color: var(--azul-bulbe);\n  font: inherit;\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.linha-dupla {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n\n/* ---------- Pedido enviado (pedido-enviado.html) ---------- */\n\n.selo-sucesso {\n  align-self: center;\n  width: 64px;\n  height: 64px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.centro {\n  text-align: center;\n}\n\n.resumo {\n  padding: 14px;\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  font-size: 0.85rem;\n  line-height: 1.5;\n}\n\n.resumo dt {\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.resumo dd + dt {\n  margin-top: 8px;\n}\n\n.passo--feito .passo__numero {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.campo input::placeholder {\n  color: #A4B3C1;\n}\n\n/* Perguntas antigas: só texto, sem ação (a pergunta nova é a única que leva a outra tela) */\n.faq__pergunta {\n  cursor: default;\n}\n\n<\/style>\n  \n<\/head>\n\n<body data-tela=\"endereco\">\n\n  <div class=\"app app--adesao\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"11\" rx=\"3\" stroke=\"currentColor\"/>\n            <rect x=\"2.5\" y=\"2.5\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>\n            <rect x=\"22\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n\n      <div class=\"barra-topo\">\n        <a class=\"botao-icone\" href=\"mudanca-endereco.html\" aria-label=\"Voltar\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <path d=\"M15 18l-6-6 6-6\"/>\n          <\/svg>\n        <\/a>\n        <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAdCAYAAABcz8ldAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAOdEVYdFNvZnR3YXJlAEZpZ21hnrGWYwAABKRJREFUeAHtWs1u20YQnqWcuIALVL0FSYFu0BToreYTlH6Cuk9QCX4A07e2aCEKyd3qqadEyhPUfQLRpx5l31L0IBZo0KPZSw+O68mMuUzWqyW5FGU5CvQBC4s7P/y4w53ZXRrwOmJ4x2DwGxb0x/CeYAPWuBV8MflO/g9e+Ar+ixJ/kOb964AsGXIStje8D/cvEUIB0L4jtpC6D3K5B2ssDZ9Nvt+9K7YmHkJEl23uEyjCzyc/bOc66xmyBD =\"subtitulo\">Seu contrato continua ativo enquanto a Bulbe confirma o novo endereço.<\/p>\n        <\/div>\n\n        <fieldset>\n          <legend class=\"legenda-marcada\">Novo endereço<\/legend>\n\n          <div class=\"campo\">\n            <label for=\"cep\">CEP <span class=\"obrigatorio\">*<\/span><\/label>\n            <input type=\"text\" id=\"cep\" name=\"cep\" inputmode=\"numeric\" autocomplete=\"postal-code\" placeholder=\"00000-000\" aria-describedby=\"cep-erro\">\n            <p class=\"campo__erro\" id=\"cep-erro\" hidden>Informe um CEP com 8 números.<\/p>\n          <\/div>\n\n          <div class=\"campo\">\n            <label for=\"rua\">Rua e número <span class=\"obrigatorio\">*<\/span><\/label>\n            <input type=\"text\" id=\"rua\" name=\"rua\" autocomplete=\"street-address\" placeholder=\"Rua das Acácias, 120\" aria-describedby=\"rua-erro\">\n            <p class=\"campo__erro\" id=\"rua-erro\" hidden>Informe a rua e o número.<\/p>\n          <\/div>\n\n          <div class=\"campo\">\n            <label for=\"cidade\">Cidade <span class=\"obrigatorio\">*<\/span><\/label>\n            <input type=\"text\" id=\"cidade\" name=\"cidade\" autocomplete=\"address-level2\" placeholder=\"Contagem\" aria-describedby=\"cidade-erro\">\n            <p class=\"campo__erro\" id=\"cidade-erro\" hidden>Informe a cidade.<\/p>\n          <\/div>\n        <\/fieldset>\n\n        <fieldset>\n          <legend class=\"legenda-marcada\">Conta de luz do imóvel<\/legend>\n\n          <div class=\"campo campo--arquivo\">\n            <label for=\"conta\">Foto ou PDF da conta <span class=\"obrigatorio\">*<\/span><\/label>\n            <input type=\"file\" id=\"conta\" name=\"conta\" accept=\"image/*,application/pdf\" aria-describedby=\"conta-erro\">\n            <p class=\"campo__ajuda\">A Bulbe usa a conta para confirmar se o endereço pode receber a economia.<\/p>\n            <p class=\"campo__erro\" id=\"conta-erro\" hidden>Anexe a conta de luz do novo imóvel.<\/p>\n          <\/div>\n        <\/fieldset>\n\n        <p class=\"aviso\">Enviar o pedido não cancela o seu contrato.<\/p>\n\n      <\/form>\n    <\/main>\n\n    <footer class=\"rodape rodape--acao\">\n      <button type=\"submit\" form=\"form-endereco\" class=\"botao botao--primario\" id=\"botao-enviar\" disabled>Enviar pedido de transferência<\/button>\n    <\/footer>\n\n  <\/div>\n\n  <script>\n    function ajustarAltura() {\n      document.documentElement.style.setProperty(\"--altura-app\", window.innerHeight + \"px\");\n    }\n\n    ajustarAltura();\n    window.addEventListener(\"resize\", ajustarAltura);\n    window.addEventListener(\"orientationchange\", ajustarAltura);\n  <\/script>\n\n<script>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas em pages/hu-mariana/: index.html (FAQ) → mudanca-endereco.html\n   → novo-endereco.html → pedido-enviado.html\n   O pedido de transferência e o WhatsApp são SIMULADOS: nada é enviado.\n   ========================================================= */\n\nconst CHAVE_PEDIDO = 'bulbe-pedido-transferencia';\n\n/* ---------- Utilitários ---------- */\n\nconst somenteDigitos = (texto) => texto.replace(/\\D/g, '');\n\nfunction mascararCep(texto) {\n  const d = somenteDigitos(texto).slice(0, 8);\n  return d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d;\n}\n\n// sessionStorage pode falhar (aba anônima, bloqueio do navegador): nunca deixa a página quebrar.\nfunction salvarPedido(dados) {\n  try {\n    sessionStorage.setItem(CHAVE_PEDIDO, JSON.stringify(dados));\n  } catch (erro) {\n    console.warn('Não foi possível salvar o pedido nesta sessão.', erro);\n  }\n}\n\nfunction lerPedido() {\n  try {\n    const bruto = sessionStorage.getItem(CHAVE_PEDIDO);\n    return bruto ? JSON.parse(bruto) : null;\n  } catch (erro) {\n    return null;\n  }\n}\n\n/* ---------- Tela 2: Mudei de endereço ---------- */\n\nfunction iniciarTelaMudanca() {\n  // Simulação: na versão real, o link abre o WhatsApp oficial da Bulbe.\n  document.getElementById('botao-whatsapp').addEventListener('click', (evento) => {\n    evento.preventDefault();\n    document.getElementById('status-whatsapp').hidden = false;\n  });\n}\n\n/* ---------- Tela 3: Informe o novo endereço ---------- */\n\nfunction iniciarTelaEndereco() {\n  const form = document.getElementById('form-endereco');\n  const botao = document.getElementById('botao-enviar');\n\n  const campos = {\n    cep: document.getElementById('cep'),\n    rua: document.getElementById('rua'),\n    cidade: document.getElementById('cidade'),\n    conta: document.getElementById('conta')\n  };\n\n  // Regras simples de validação (esboço).\n  const valido = {\n    cep: (campo) => somenteDigitos(campo.value).length === 8,\n    // Precisa de número (ou \"s/n\"), como pede o rótulo \"Rua e número\".\n    rua: (campo) => campo.value.trim().length >= 5 && /\\d|\\bs\\/?n\\b/i.test(campo.value),\n    cidade: (campo) => campo.value.trim().length >= 2,\n    conta: (campo) => campo.files.length > 0\n  };\n\n  const campoValido = (chave) => valido[chave](campos[chave]);\n\n  function mostrarErro(chave) {\n    const campo = campos[chave];\n    const ok = campoValido(chave);\n    campo.setAttribute('aria-invalid', String(!ok));\n    document.getElementById(`${campo.id}-erro`).hidden = ok;\n  }\n\n  function atualizarBotao() {\n    botao.disabled = !Object.keys(campos).every(campoValido);\n  }\n\n  Object.keys(campos).forEach((chave) => {\n    const campo = campos[chave];\n    const evento = chave === 'conta' ? 'change' : 'input';\n    campo.addEventListener(evento, () => {\n      if (chave === 'cep') campo.value = mascararCep(campo.value);\n      if (campo.getAttribute('aria-invalid') === 'true') mostrarErro(chave);\n      atualizarBotao();\n    });\n    campo.addEventListener('blur', () => mostrarErro(chave));\n  });\n\n  form.addEventListener('submit', (evento) => {\n    evento.preventDefault();\n    Object.keys(campos).forEach(mostrarErro);\n    if (botao.disabled) return;\n\n    salvarPedido({\n      cep: campos.cep.value,\n      rua: campos.rua.value.trim(),\n      cidade: campos.cidade.value.trim(),\n      conta: campos.conta.files[0].name\n    });\n    window.__bulbeIr('pedido-enviado.html');\n  });\n}\n\n/* ---------- Tela 4: Pedido enviado ---------- */\n\nfunction iniciarTelaEnviado() {\n  const pedido = lerPedido();\n  if (!pedido) return; // sem pedido salvo, mantém o texto de exemplo do HTML\n\n  // textContent (e não innerHTML) evita injetar HTML vindo do que o usuário digitou.\n  document.getElementById('resumo-endereco').textContent =\n    `${pedido.rua}, ${pedido.cidade} (CEP ${pedido.cep})`;\n  document.getElementById('resumo-conta').textContent = pedido.conta;\n}\n\n/* ---------- Roteamento simples por página ---------- */\n\nconst telas = {\n  mudanca: iniciarTelaMudanca,\n  endereco: iniciarTelaEndereco,\n  enviado: iniciarTelaEnviado\n};\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  const iniciar = telas[document.body.dataset.tela];\n  if (iniciar) iniciar();\n});\n\n<\/script>\n<\/body>\n<\/html>\n", "pages/hu-mariana/pedido-enviado.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Pedido enviado · Bulbe<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n  <style>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas nesta pasta: index.html (FAQ) → mudanca-endereco.html → novo-endereco.html → pedido-enviado.html\n\n   Parte 1: base do template do grupo (mesmo CSS de pages/exemplo.html:\n            fonte Poppins, azul #08068D e app 360 x 812).\n   Parte 2: variante de adesão (cabeçalho azul, rodapé de ação)\n            e componentes das quatro telas.\n   ========================================================= */\n\n/* ---------- Parte 1 · Base do template ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\n:root {\n  --azul-bulbe: #08068D;        \n  --azul-claro: #8a9bb5;        \n  --borda: #dde3ec;             \n  --texto-suave: #5b6b82;       \n  --vermelho: #d93a2f;          \n  --fundo-pagina: #ececec;\n  --altura-app: 100dvh;         \n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.barra-topo {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin: 8px 0 14px;\n}\n\n.botao-icone {\n  background: none;\n  border: none;\n  color: var(--azul-bulbe);\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  width: 36px;\n  height: 36px;\n  position: relative;\n}\n\n.logo {\n  font-size: 1.5rem;\n  font-weight: 800;\n  letter-spacing: -0.5px;\n}\n\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n\n.indicador {\n  position: absolute;\n  top: 0;\n  right: 0;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: var(--azul-bulbe);\n  color: #ffffff;\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 0 16px;\n}\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 4px 0 8px; }\n}\n\n/* ---------- Parte 2 · Adesão e telas da HU ---------- */\n/* =========================================================\n   Variação do template para quem AINDA NÃO É CLIENTE (adesão)\n   Uso: <div class=\"app app--adesao\">\n   - Cabeçalho: voltar + logo + etapa (sem sino e sem perfil)\n   - Rodapé: botão de ação da etapa (sem as abas do app logado)\n   Usa só as variáveis do template.css; as novas estão abaixo.\n   ========================================================= */\n\n:root {\n  --verde: #23C97B;\n  --verde-escuro: #0B3D25;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --whatsapp: #075E54;\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n  --desabilitado: #A4B3C1;\n  --raio: 10px;\n  --altura-botao: 48px;\n}\n\n/* ---------- Cabeçalho da adesão ---------- */\n/* Azul da marca com o logo branco, como no app da Bulbe.\n   Se o PR oficial deixar o cabeçalho do template azul, este bloco vira redundante. */\n\n.app--adesao .cabecalho {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone {\n  color: #FFFFFF;\n}\n\n.app--adesao .botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  justify-self: center;\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n.app--adesao .barra-topo {\n  display: grid;\n  grid-template-columns: 44px 1fr 44px;\n  margin: 4px 0 10px;\n}\n\n.app--adesao .botao-icone {\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  text-decoration: none;\n}\n\n.etapa {\n  justify-self: end;\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n.progresso {\n  height: 4px;\n  margin: 0 -16px -12px;   /* encosta nas bordas do app, por baixo do cabeçalho */\n  background: rgba(255, 255, 255, 0.2);\n}\n\n.progresso__barra {\n  height: 100%;\n  background: linear-gradient(90deg, var(--verde), #19A39B);\n}\n\n/* ---------- Conteúdo ---------- */\n\n.app--adesao .conteudo {\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, a área de conteúdo rola (overflow do template). */\n.app--adesao .conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                      /* tipografia de título da Bulbe: Poppins SemiBold 24/32 */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n/* ---------- Rodapé de ação (no lugar das abas) ---------- */\n\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n/* ---------- Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #FFFFFF;\n  font-size: 0.95rem;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n/* ---------- Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;   /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Abas \"Para mim / Para outra pessoa\": um trilho cinza com as duas opções.\n   A marcada fica preenchida no azul da marca, com ✓ (padrão do \"Sim/Não\" da Bulbe).\n   A não marcada não tem borda, para não parecer um campo de digitação. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;   /* \"✓ Para outra pessoa\" cabe numa linha mesmo em 360 px */\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #FFFFFF;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n/* Campo de WhatsApp: ícone do WhatsApp dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;          /* (48px de altura do campo - 20px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.termos a,\n.subtitulo a,\n.link-secundario {\n  color: var(--azul-bulbe);\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela (o resumo da ilustração em palavras) */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n/* ---------- Perguntas frequentes (index.html) ---------- */\n\n.faq {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n}\n\n.faq__item {\n  border-bottom: 1px solid var(--borda);\n}\n\n.faq__pergunta,\n.faq__destaque {\n  list-style: none;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  min-height: 56px;\n  padding: 12px 0;\n  font-size: 0.9rem;\n  line-height: 1.4;\n  color: var(--texto-suave);\n  cursor: pointer;\n}\n\n.faq__mais {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border: 1.5px solid var(--azul-claro);\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--azul-claro);\n}\n\n/* Pergunta nova, com destaque: leva para a tela da HU */\n.faq__destaque {\n  margin-top: 16px;\n  padding: 12px 14px;\n  border: 2px solid #1D5FD1;\n  border-radius: 12px;\n  background: var(--info-fundo);\n  color: var(--azul-bulbe);\n  font-weight: 600;\n  text-decoration: none;\n}\n\n.faq__destaque .faq__mais {\n  border-color: #1D5FD1;\n  color: #1D5FD1;\n}\n\n.faq__destaque-texto {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 6px;\n}\n\n.selo-novo {\n  padding: 1px 8px;\n  border-radius: 999px;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.65rem;\n  font-weight: 700;\n  letter-spacing: 0.4px;\n}\n\n.faq__destaque:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.card-seguro {\n  padding: 14px;\n  border: 1px solid var(--verde-borda);\n  border-radius: 12px;\n  background: var(--verde-fundo);\n  color: var(--verde-escuro);\n  font-size: 0.8rem;\n  line-height: 1.5;\n}\n\n.card-seguro strong {\n  display: block;\n  margin-bottom: 4px;\n  font-size: 0.9rem;\n}\n\n/* ---------- Mudar de endereço (mudanca-endereco.html) ---------- */\n\n.resposta-destaque {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 16px;\n  border-radius: 14px;\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n  font-size: 1.05rem;\n  line-height: 1.4;\n  font-weight: 600;\n}\n\n.resposta-destaque svg {\n  flex: 0 0 auto;\n}\n\n.texto-apoio {\n  font-size: 0.85rem;\n  line-height: 1.5;\n  color: var(--texto-suave);\n}\n\n.passos {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  padding: 16px;\n  border: 1px solid var(--borda);\n  border-radius: 14px;\n}\n\n.passos__titulo {\n  font-size: 1.05rem;\n  font-weight: 600;\n}\n\n.passo {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.passo__numero {\n  flex: 0 0 auto;\n  width: 28px;\n  height: 28px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  font-size: 0.85rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.acoes {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.botao--contorno {\n  background: #FFFFFF;\n  border: 2px solid var(--whatsapp);\n  color: var(--whatsapp);\n}\n\n.botao--contorno:hover {\n  background: var(--verde-fundo);\n}\n\n.nota-final {\n  text-align: center;\n  font-size: 0.78rem;\n  color: var(--texto-suave);\n}\n\n.status-simulado {\n  padding: 10px 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n/* ---------- Novo endereço (novo-endereco.html) ---------- */\n\n.campo__ajuda {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo--arquivo input[type=\"file\"] {\n  height: auto;\n  padding: 12px;\n  font-size: 0.85rem;\n}\n\n.campo--arquivo input[type=\"file\"]::file-selector-button {\n  margin-right: 10px;\n  padding: 6px 12px;\n  border: 1px solid var(--azul-bulbe);\n  border-radius: 8px;\n  background: #FFFFFF;\n  color: var(--azul-bulbe);\n  font: inherit;\n  font-weight: 600;\n  cursor: pointer;\n}\n\n.linha-dupla {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n}\n\n/* ---------- Pedido enviado (pedido-enviado.html) ---------- */\n\n.selo-sucesso {\n  align-self: center;\n  width: 64px;\n  height: 64px;\n  border-radius: 50%;\n  background: var(--verde);\n  color: var(--verde-escuro);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.centro {\n  text-align: center;\n}\n\n.resumo {\n  padding: 14px;\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  font-size: 0.85rem;\n  line-height: 1.5;\n}\n\n.resumo dt {\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.resumo dd + dt {\n  margin-top: 8px;\n}\n\n.passo--feito .passo__numero {\n  background: var(--azul-bulbe);\n  color: #FFFFFF;\n}\n\n.campo input::placeholder {\n  color: #A4B3C1;\n}\n\n/* Perguntas antigas: só texto, sem ação (a pergunta nova é a única que leva a outra tela) */\n.faq__pergunta {\n  cursor: default;\n}\n\n<\/style>\n  \n<\/head>\n\n<body data-tela=\"enviado\">\n\n  <div class=\"app app--adesao\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"11\" rx=\"3\" stroke=\"currentColor\"/>\n            <rect x=\"2.5\" y=\"2.5\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>\n            <rect x=\"22\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n\n      <div class=\"barra-topo\">\n        <span><\/span>\n        <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAdCAYAAABcz8ldAAAACXBIWXMAAAsTAAALEwEAmpwY ogresso__barra\" style=\"width: 100%\"><\/div>\n      <\/div>\n\n    <\/header>\n\n    <main class=\"conteudo\" id=\"conteudo\">\n\n      <div class=\"selo-sucesso\" aria-hidden=\"true\">\n        <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"/><\/svg>\n      <\/div>\n\n      <div class=\"centro\">\n        <h1 class=\"titulo\">Pedido enviado<\/h1>\n        <p class=\"subtitulo\">Seu contrato continua ativo. Você não cancelou nada.<\/p>\n      <\/div>\n\n      <dl class=\"resumo\">\n        <dt>Novo endereço<\/dt>\n        <dd id=\"resumo-endereco\">Rua das Acácias, 120, Contagem<\/dd>\n        <dt>Conta de luz<\/dt>\n        <dd id=\"resumo-conta\">Arquivo anexado<\/dd>\n      <\/dl>\n\n      <ol class=\"passos\" aria-labelledby=\"titulo-proximos\">\n        <li class=\"passos__titulo\" id=\"titulo-proximos\" style=\"list-style: none\">O que acontece agora<\/li>\n        <li class=\"passo passo--feito\"><span class=\"passo__numero\" aria-hidden=\"true\">✓<\/span><span>Recebemos o novo endereço e a conta de luz.<\/span><\/li>\n        <li class=\"passo\"><span class=\"passo__numero\" aria-hidden=\"true\">2<\/span><span>A Bulbe <strong>confirma<\/strong> se o novo endereço pode receber a economia.<\/span><\/li>\n        <li class=\"passo\"><span class=\"passo__numero\" aria-hidden=\"true\">3<\/span><span>Após a qualificação, sua economia volta à fatura. A Bulbe informa o prazo quando confirmar o novo endereço.<\/span><\/li>\n      <\/ol>\n\n\n    <\/main>\n\n    <footer class=\"rodape rodape--acao\">\n      <a class=\"botao botao--primario\" href=\"index.html\">Voltar ao início<\/a>\n    <\/footer>\n\n  <\/div>\n\n  <script>\n    function ajustarAltura() {\n      document.documentElement.style.setProperty(\"--altura-app\", window.innerHeight + \"px\");\n    }\n\n    ajustarAltura();\n    window.addEventListener(\"resize\", ajustarAltura);\n    window.addEventListener(\"orientationchange\", ajustarAltura);\n  <\/script>\n\n<script>\n/* =========================================================\n   HU da Mariana: Explicar e facilitar a mudança de endereço\n   Telas em pages/hu-mariana/: index.html (FAQ) → mudanca-endereco.html\n   → novo-endereco.html → pedido-enviado.html\n   O pedido de transferência e o WhatsApp são SIMULADOS: nada é enviado.\n   ========================================================= */\n\nconst CHAVE_PEDIDO = 'bulbe-pedido-transferencia';\n\n/* ---------- Utilitários ---------- */\n\nconst somenteDigitos = (texto) => texto.replace(/\\D/g, '');\n\nfunction mascararCep(texto) {\n  const d = somenteDigitos(texto).slice(0, 8);\n  return d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d;\n}\n\n// sessionStorage pode falhar (aba anônima, bloqueio do navegador): nunca deixa a página quebrar.\nfunction salvarPedido(dados) {\n  try {\n    sessionStorage.setItem(CHAVE_PEDIDO, JSON.stringify(dados));\n  } catch (erro) {\n    console.warn('Não foi possível salvar o pedido nesta sessão.', erro);\n  }\n}\n\nfunction lerPedido() {\n  try {\n    const bruto = sessionStorage.getItem(CHAVE_PEDIDO);\n    return bruto ? JSON.parse(bruto) : null;\n  } catch (erro) {\n    return null;\n  }\n}\n\n/* ---------- Tela 2: Mudei de endereço ---------- */\n\nfunction iniciarTelaMudanca() {\n  // Simulação: na versão real, o link abre o WhatsApp oficial da Bulbe.\n  document.getElementById('botao-whatsapp').addEventListener('click', (evento) => {\n    evento.preventDefault();\n    document.getElementById('status-whatsapp').hidden = false;\n  });\n}\n\n/* ---------- Tela 3: Informe o novo endereço ---------- */\n\nfunction iniciarTelaEndereco() {\n  const form = document.getElementById('form-endereco');\n  const botao = document.getElementById('botao-enviar');\n\n  const campos = {\n    cep: document.getElementById('cep'),\n    rua: document.getElementById('rua'),\n    cidade: document.getElementById('cidade'),\n    conta: document.getElementById('conta')\n  };\n\n  // Regras simples de validação (esboço).\n  const valido = {\n    cep: (campo) => somenteDigitos(campo.value).length === 8,\n    // Precisa de número (ou \"s/n\"), como pede o rótulo \"Rua e número\".\n    rua: (campo) => campo.value.trim().length >= 5 && /\\d|\\bs\\/?n\\b/i.test(campo.value),\n    cidade: (campo) => campo.value.trim().length >= 2,\n    conta: (campo) => campo.files.length > 0\n  };\n\n  const campoValido = (chave) => valido[chave](campos[chave]);\n\n  function mostrarErro(chave) {\n    const campo = campos[chave];\n    const ok = campoValido(chave);\n    campo.setAttribute('aria-invalid', String(!ok));\n    document.getElementById(`${campo.id}-erro`).hidden = ok;\n  }\n\n  function atualizarBotao() {\n    botao.disabled = !Object.keys(campos).every(campoValido);\n  }\n\n  Object.keys(campos).forEach((chave) => {\n    const campo = campos[chave];\n    const evento = chave === 'conta' ? 'change' : 'input';\n    campo.addEventListener(evento, () => {\n      if (chave === 'cep') campo.value = mascararCep(campo.value);\n      if (campo.getAttribute('aria-invalid') === 'true') mostrarErro(chave);\n      atualizarBotao();\n    });\n    campo.addEventListener('blur', () => mostrarErro(chave));\n  });\n\n  form.addEventListener('submit', (evento) => {\n    evento.preventDefault();\n    Object.keys(campos).forEach(mostrarErro);\n    if (botao.disabled) return;\n\n    salvarPedido({\n      cep: campos.cep.value,\n      rua: campos.rua.value.trim(),\n      cidade: campos.cidade.value.trim(),\n      conta: campos.conta.files[0].name\n    });\n    window.__bulbeIr('pedido-enviado.html');\n  });\n}\n\n/* ---------- Tela 4: Pedido enviado ---------- */\n\nfunction iniciarTelaEnviado() {\n  const pedido = lerPedido();\n  if (!pedido) return; // sem pedido salvo, mantém o texto de exemplo do HTML\n\n  // textContent (e não innerHTML) evita injetar HTML vindo do que o usuário digitou.\n  document.getElementById('resumo-endereco').textContent =\n    `${pedido.rua}, ${pedido.cidade} (CEP ${pedido.cep})`;\n  document.getElementById('resumo-conta').textContent = pedido.conta;\n}\n\n/* ---------- Roteamento simples por página ---------- */\n\nconst telas = {\n  mudanca: iniciarTelaMudanca,\n  endereco: iniciarTelaEndereco,\n  enviado: iniciarTelaEnviado\n};\n\ndocument.addEventListener('DOMContentLoaded', () => {\n  const iniciar = telas[document.body.dataset.tela];\n  if (iniciar) iniciar();\n});\n\n<\/script>\n<\/body>\n<\/html>\n"};
  let telaAtual = '';
  let historico = [];

  function abrirTela(caminho, voltando) {
    if (!PAGINAS[caminho]) return;
    if (!voltando && telaAtual && telaAtual !== caminho) historico.push(telaAtual);
    telaAtual = caminho;
    app.srcdoc = PAGINAS[caminho];
  }

  // Navegação pedida de dentro do celular
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.bulbeIr) {
      // Resolve o caminho relativo (inclusive "../") a partir da tela atual
      const partes = telaAtual.split('/').slice(0, -1);
      d.bulbeIr.split('#')[0].split('/').forEach((p) => {
        if (p === '..') partes.pop(); else if (p && p !== '.') partes.push(p);
      });
      abrirTela(partes.join('/'));
    } else if (d.bulbeVoltar && historico.length) {
      abrirTela(historico.pop(), true);
    }
  });

  // ---------- Mostrar um slide ----------
  function mostrar(n, manterTela = false) {
    atual = Math.max(0, Math.min(SLIDES.length - 1, n));
    const s = SLIDES[atual];

    $('contador').textContent = `${atual + 1} de ${SLIDES.length}`;
    $('titulo').textContent = s.titulo;
    $('eyebrow').textContent = s.eyebrow || '';
    $('titulo').classList.toggle('titulo--grande', s.id === 'encerramento');
    $('historia').textContent = s.historia;

    // Quem: história, persona e integrante
    const quem = $('quem');
    quem.replaceChildren();
    if (s.hu) {
      quem.append(criar('span', s.hu, 'etiqueta etiqueta--hu'), criar('span', s.persona, 'etiqueta'), criar('span', s.autor, 'etiqueta'));
    }

    // Capa e encerramento: equipe em vez de telas e critérios
    const extra = $('extra');
    extra.replaceChildren();
    if (s.disclaimer) {
      const d = criar('p', s.disclaimer, 'disclaimer');
      extra.append(d);
    }
    if (s.dor) {
      const grade = criar('div', undefined, 'dor-grid');
      const esq = criar('div');
      esq.append(criar('div', s.dor.numero, 'dor-numero'), criar('p', s.dor.legenda, 'dor-legenda'));
      const dir = criar('div', undefined, 'dor-cards');
      s.dor.cards.forEach(([t, txt]) => {
        const c = criar('div');
        c.append(criar('h2', t), criar('p', txt));
        dir.append(c);
      });
      grade.append(esq, dir);
      extra.append(grade, criar('p', s.dor.fonte, 'dica'));
    } else if (s.grupos) {
      const g = criar('div', undefined, 'capa-grupos');
      s.grupos.forEach(([titulo, nomes]) => {
        const col = criar('div', undefined, 'capa-grupo');
        const ul = criar('ul');
        nomes.forEach((n) => ul.append(criar('li', n)));
        col.append(criar('h2', titulo), ul);
        g.append(col);
      });
      extra.append(g);
    } else if (s.capa && !s.semEquipe) {
      const lista = criar('ul', undefined, 'equipe');
      EQUIPE.forEach(([persona, nome]) => {
        const li = criar('li', nome);
        li.append(criar('span', `Persona ${persona}`));
        lista.append(li);
      });
      if (s.id === 'capa') {
        const n = criar('div', undefined, 'bloco');
        n.append(criar('h2', 'Dor escolhida'));
        const linha = criar('div');
        linha.append(criar('span', '27,7%', 'numero'));
        const p = criar('p', 'do churn da Bulbe acontece por falta de entendimento do produto.', 'dica');
        p.style.fontSize = '0.85rem';
        linha.append(p);
        n.append(linha);
        extra.append(n);
      }
      extra.append(lista);
    }

    $('bloco-telas').hidden = !s.telas || s.telas.length === 0;

    // Aviso de integração, abaixo das telas
    const nota = $('integracao');
    nota.replaceChildren();
    nota.hidden = !s.integrado;
    if (s.integrado) nota.append(criar('b', 'Fluxo integrado '), document.createTextNode(s.integrado));

    const telas = $('telas');
    telas.replaceChildren();
    (s.telas || []).forEach(([nome, caminho], i) => {
      const b = criar('button');
      b.type = 'button';
      b.append(criar('b', String(i + 1)), document.createTextNode(nome));
      b.addEventListener('click', () => abrirTela(caminho));
      telas.append(b);
    });

    // Celular: tela real ou aviso
    const temTela = s.telas && s.telas.length > 0;
    $('aviso').hidden = temTela;
    // Capa, dor e encerramento: sem celular
    const semCelular = s.id === 'capa' || !!s.semCelular;
    $('celular-area').hidden = semCelular;
    document.querySelector('.palco').classList.toggle('palco--sem-celular', semCelular);
    $('reiniciar').hidden = !temTela;
    if (temTela) {
      if (!manterTela) { historico = []; telaAtual = ''; abrirTela(s.telas[0][1]); }
    } else {
      app.removeAttribute('srcdoc'); app.src = 'about:blank'; telaAtual = ''; historico = [];
      const corpo = $('aviso-corpo');
      if (s.aviso) corpo.replaceChildren(criar('span', s.aviso.selo, 'selo'), criar('strong', s.aviso.titulo), criar('p', s.aviso.texto));
    }

    $('anterior').disabled = atual === 0;
    $('proximo').disabled = atual === SLIDES.length - 1;
    $('indice').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-current', String(i === atual)));

    // Reinicia a animação de entrada do painel
    document.querySelectorAll('.painel > *').forEach((el) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });

    if (location.hash.slice(1) !== s.id) history.replaceState(null, '', `#${s.id}`);
  }

  // ---------- Índice e controles ----------
  SLIDES.forEach((s, i) => {
    const b = criar('button', `${i + 1}. ${s.nome}`);
    b.type = 'button';
    b.addEventListener('click', () => mostrar(i));
    $('indice').append(b);
  });

  $('anterior').addEventListener('click', () => mostrar(atual - 1));
  $('proximo').addEventListener('click', () => mostrar(atual + 1));
  $('reiniciar').addEventListener('click', () => {
    const s = SLIDES[atual];
    if (s.telas && s.telas.length) { historico = []; telaAtual = ''; abrirTela(s.telas[0][1]); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') mostrar(atual + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') mostrar(atual - 1);
  });

  function slideDoEndereco() {
    const i = SLIDES.findIndex((s) => s.id === location.hash.slice(1));
    return i >= 0 ? i : 0;
  }

  window.addEventListener('hashchange', () => {
    const i = slideDoEndereco();
    if (i !== atual) mostrar(i);
  });

  window.addEventListener('resize', ajustarCelular);
  ajustarCelular();
  mostrar(slideDoEndereco());
</script>
