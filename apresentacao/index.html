ata. Olha como vai ficar:<\/p>\n\n            <div class=\"balao__cartao\">\n              <strong>Bulbe Energia<\/strong>\n              <p>Sua conta de luz vai passar a vir em duas partes com desconto garantido.<\/p>\n            <\/div>\n\n            <span class=\"balao__hora\">10:12<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n    <\/main>\n\n    <footer class=\"rodape rodape--acao\">\n      <button type=\"button\" class=\"botao botao--whatsapp\" id=\"botao-enviar\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n          <path d=\"M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21\"/>\n          <path d=\"M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1\"/>\n        <\/svg>\n        Enviar mensagem no WhatsApp\n      <\/button>\n      <p class=\"nota nota--rodape\">A Bulbe envia esta mensagem para o WhatsApp do titular.<\/p>\n    <\/footer>\n  <\/div>\n\n<\/body>\n<\/html>", "pages/exemplo-elita.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\n  <title>Bulbe - Acompanhe suas etapas<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\"\n    href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo (sempre primeiro) -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n\n  <!-- CSS individual da Elita -->\n  <style>\n/* ========================================\n   BULBE - CSS INDIVIDUAL ELITA\n   Baseado no CSS original da tela\n======================================== */\n\n:root {\n    --azul-bulbe: #08068D;\n    --azul-claro: #7889ad;\n    --azul-fundo: #eef2ff;\n    --borda: #e1e5ef;\n    --texto-suave: #515e76;\n    --verde: #23C97B;\n    --verde-linha: #bce4ca;\n}\n\n/* ========================================\n   APLICATIVO\n======================================== */\n\n.app {\n    width: min(390px, 100vw);\n    height: min(812px, 96vh);\n}\n\n@media (pointer: coarse), (max-width: 600px) {\n    .app {\n        width: 100%;\n        height: 100dvh;\n    }\n}\n\n/* ========================================\n   CABEÇALHO\n======================================== */\n\n.cabecalho {\n    padding: calc(env(safe-area-inset-top) + 4px) 16px 16px;\n}\n\n.barra-status {\n    height: 30px;\n    padding: 0 4px;\n}\n\n.barra-topo {\n    position: relative;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    min-height: 48px;\n    margin: 8px 0 4px;\n}\n\n/* Botões do cabeçalho */\n\n.botao-icone {\n    width: 38px;\n    height: 38px;\n    flex-shrink: 0;\n    border-radius: 50%;\n}\n\n/* Logo centralizada */\n\n.barra-topo .logo-img {\n    position: absolute;\n    left: 50%;\n    top: 50%;\n    transform: translate(-50%, -50%);\n    display: block;\n    width: 105px;\n    height: auto;\n    max-height: 38px;\n    object-fit: contain;\n}\n\n/* Notificações e perfil */\n\n.acoes-direita {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    margin-left: auto;\n}\n\n.indicador {\n    top: 0;\n    right: 0;\n    min-width: 17px;\n    height: 17px;\n    border-radius: 10px;\n}\n\n.perfil {\n    width: 36px;\n    height: 36px;\n    flex-shrink: 0;\n}\n\n/* ========================================\n   CONTEÚDO\n======================================== */\n\n.conteudo {\n    padding: 24px 18px 20px;\n    background-color: #ffffff;\n    scrollbar-width: thin;\n    scrollbar-color: #a2b3d5 transparent;\n}\n\n/* Introdução */\n\n.introducao {\n    margin-bottom: 28px;\n}\n\n.introducao h2 {\n    margin-bottom: 8px;\n    color: var(--azul-bulbe);\n    font-size: 1.3rem;\n    font-weight: 700;\n    line-height: 1.35;\n}\n\n.introducao p {\n    color: var(--texto-suave);\n    font-size: 0.9rem;\n    line-height: 1.6;\n}\n\n/* ========================================\n   ETAPAS E LINHA VERTICAL\n======================================== */\n\n.etapas-wrapper {\n    display: flex;\n    flex-direction: column;\n}\n\n.etapa-item {\n    position: relative;\n    display: flex;\n    align-items: flex-start;\n    gap: 12px;\n    padding: 4px 0 25px;\n}\n\n/* Linha entre os círculos */\n\n.etapa-item:not(:last-child)::after {\n    content: \"\";\n    position: absolute;\n    z-index: 0;\n    left: 13px;\n    top: 32px;\n    bottom: -1px;\n    width: 2px;\n    background-color: var(--borda);\n}\n\n/* Linha verde das etapas concluídas */\n\n.etapa-item.concluido:not(:last-child)::after {\n    background-color: var(--verde-linha);\n}\n\n/* Círculos */\n\n.etapa-icone {\n    position: relative;\n    z-index: 1;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex: 0 0 28px;\n    width: 28px;\n    height: 28px;\n    border-radius: 50%;\n    font-size: 0.82rem;\n    font-weight: 700;\n}\n\n/* Concluída */\n\n.etapa-item.concluido .etapa-icone {\n    background-color: var(--verde);\n    color: #ffffff;\n}\n\n/* Etapa atual */\n\n.etapa-item.andamento {\n    margin: 0 -8px 16px;\n    padding: 14px 10px;\n    border-radius: 12px;\n    background-color: var(--azul-fundo);\n}\n\n.etapa-item.andamento:not(:last-child)::after {\n    left: 21px;\n    top: 42px;\n    bottom: -17px;\n}\n\n.etapa-item.andamento .etapa-icone {\n    background-color: var(--azul-bulbe);\n    color: #ffffff;\n    outline: 3px solid #dce5ff;\n    outline-offset: 2px;\n}\n\n/* Etapa futura */\n\n.etapa-item.pendente .etapa-icone {\n    background-color: #e9edf5;\n    color: #647493;\n}\n\n/* Textos das etapas */\n\n.etapa-texto {\n    flex: 1;\n    min-width: 0;\n    padding-top: 2px;\n}\n\n.etapa-texto h3 {\n    color: var(--azul-bulbe);\n    font-size: 0.92rem;\n    font-weight: 700;\n    line-height: 1.45;\n    overflow-wrap: break-word;\n}\n\n.etapa-texto p {\n    margin-top: 5px;\n    color: var(--texto-suave);\n    font-size: 0.82rem;\n    line-height: 1.55;\n    overflow-wrap: break-word;\n}\n\n.etapa-item.pendente .etapa-texto h3 {\n    color: #647493;\n}\n\n.etapa-item.pendente .etapa-texto p {\n    color: #596579;\n}\n\n/* ========================================\n   AVISO INFORMATIVO\n======================================== */\n\n.aviso-fatura {\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    margin-top: 8px;\n    margin-bottom: 18px;\n    padding: 16px;\n    background-color: #eef2ff;\n    border: 1px solid #dce4ff;\n    border-radius: 14px;\n}\n\n.icone-fatura {\n    flex-shrink: 0;\n    color: var(--azul-bulbe);\n}\n\n.texto-aviso {\n    flex: 1;\n    min-width: 0;\n}\n\n.texto-aviso h3 {\n    margin-bottom: 5px;\n    color: var(--azul-bulbe);\n    font-size: 0.95rem;\n    font-weight: 700;\n}\n\n.texto-aviso p {\n    color: var(--texto-suave);\n    font-size: 0.82rem;\n    line-height: 1.55;\n}\n\n/* ========================================\n   BOTÃO PRINCIPAL\n======================================== */\n\n.btn-continuar {\n    display: block;\n    width: 100%;\n    min-height: 48px;\n    margin-bottom: 12px;\n    padding: 13px 16px;\n    background-color: var(--azul-bulbe);\n    border: none;\n    border-radius: 12px;\n    color: #ffffff;\n    font-family: inherit;\n    font-size: 0.95rem;\n    font-weight: 700;\n    cursor: pointer;\n    transition: background-color 0.2s, transform 0.2s;\n}\n\n.btn-continuar:active {\n    transform: scale(0.98);\n}\n\n/* ========================================\n   RODAPÉ E NAVEGAÇÃO\n======================================== */\n\n.rodape {\n    border-top: 1px solid var(--borda);\n}\n\n.navegacao {\n    padding: 10px 6px calc(10px + env(safe-area-inset-bottom));\n}\n\n.nav-item {\n    gap: 5px;\n    padding: 4px 0;\n    font-size: 0.73rem;\n}\n\n.nav-item.ativo {\n    color: var(--azul-bulbe);\n    font-weight: 700;\n}\n\n/* ========================================\n   CARREGAMENTO E ERROS\n======================================== */\n\n.carregando,\n.erro {\n    padding: 20px 0;\n    color: var(--texto-suave);\n    font-size: 0.88rem;\n    text-align: center;\n}\n\n/* ========================================\n   TELAS PEQUENAS\n======================================== */\n\n@media (max-width: 360px) {\n\n    .conteudo {\n        padding: 18px 14px;\n    }\n\n    .introducao h2 {\n        font-size: 1.18rem;\n    }\n\n    .etapa-item {\n        gap: 10px;\n    }\n\n    .etapa-texto h3 {\n        font-size: 0.84rem;\n    }\n\n    .etapa-texto p {\n        font-size: 0.75rem;\n    }\n\n    .aviso-fatura {\n        gap: 10px;\n        padding: 12px;\n    }\n\n    .barra-topo .logo-img {\n        width: 88px;\n    }\n}\n<\/style>\n\n  <!-- JavaScript comum do grupo -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n\n  <!-- JavaScript individual da Elita -->\n  <script type=\"module\">\n// ========================================\n// BULBE - TELA DE ACOMPANHAMENTO\n// JavaScript individual - Elita\n// ========================================\n\ndocument.addEventListener(\"DOMContentLoaded\", iniciarTela);\n\nasync function iniciarTela() {\n\n    const conteudo = document.getElementById(\"conteudo\");\n\n    // Verifica se o conteúdo existe\n    if (!conteudo) {\n        console.error(\"Elemento #conteudo não encontrado.\");\n        return;\n    }\n\n    try {\n\n        // Busca os dados do arquivo JSON\n        const resposta = { ok: true, json: async () => ({\n    \"titulo\": \"Acompanhe suas etapas\",\n    \"subtitulo\": \"Acompanhe passo a passo o processo de conexão com a Bulbe.\",\n    \"etapas\": [\n        {\n            \"titulo\": \"Cadastro concluído\",\n            \"descricao\": \"Cadastro no app realizado com sucesso.\",\n            \"status\": \"concluido\"\n        },\n        {\n            \"titulo\": \"Validação da documentação\",\n            \"descricao\": \"Seus documentos foram conferidos e validados.\",\n            \"status\": \"concluido\"\n        },\n        {\n            \"titulo\": \"Integração\",\n            \"descricao\": \"A integração foi conclída com sucesso! Você está cada vez mais pertio de aproveitar os benefícios da Bulbe.\",\n            \"status\": \"concluido\"\n        },\n\n        {\n            \"titulo\": \"Aguarde a conexão\",\n            \"descricao\": \"A conexão com a Bulbe está sendo preparada. A espera pode levar até 90 dias.\",\n            \"status\": \"andamento\"\n        },\n        {\n            \"titulo\": \"Primeira fatura Bulbe\",\n            \"descricao\": \"Primeira fatura da Bulbe estará deisponível em breve.\",\n            \"status\": \"pendente\"\n        }\n    ]\n}) };\n\n        if (!resposta.ok) {\n            throw new Error(\"Não foi possível carregar os dados.\");\n        }\n\n        const data = await resposta.json();\n\n        // Verifica se os dados possuem as informações necessárias\n        if (!data.titulo || !data.subtitulo || !Array.isArray(data.etapas)) {\n            throw new Error(\"O arquivo JSON possui dados inválidos.\");\n        }\n\n        // Monta o conteúdo da tela\n        conteudo.innerHTML = `\n\n            <section class=\"introducao\">\n\n                <h2>${data.titulo}<\/h2>\n\n                <p>${data.subtitulo}<\/p>\n\n            <\/section>\n\n            <section class=\"etapas-wrapper\">\n\n                ${data.etapas.map((etapa, index) => {\n\n                    const icone = etapa.status === \"concluido\"\n                        ? \"✓\"\n                        : index + 1;\n\n                    return `\n\n                        <div class=\"etapa-item ${etapa.status}\">\n\n                            <div class=\"etapa-icone\">\n                                ${icone}\n                            <\/div>\n\n                            <div class=\"etapa-texto\">\n\n                                <h3>${etapa.titulo}<\/h3>\n\n                                <p>${etapa.descricao}<\/p>\n\n                            <\/div>\n\n                        <\/div>\n\n                    `;\n\n                }).join(\"\")}\n\n            <\/section>\n\n            <section class=\"aviso-fatura\">\n\n                <div class=\"icone-fatura\">\n\n                    <svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\"\n                        fill=\"none\" stroke=\"currentColor\"\n                        stroke-width=\"1.5\" stroke-linecap=\"round\"\n                        stroke-linejoin=\"round\" aria-hidden=\"true\">\n\n                        <path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/>\n\n                        <path d=\"M14 2v6h6\"/>\n\n                        <path d=\"M8 13h8\"/>\n\n                        <path d=\"M8 17h5\"/>\n\n                    <\/svg>\n\n                <\/div>\n\n                <div class=\"texto-aviso\">\n\n                    <h3>Fique de olho!<\/h3>\n\n                    <p>\n                        Em breve sua primeira fatura da Bulbe estará disponível,\n                        e você poderá consultar os valores e acompanhar seus descontos. Enquato isso, continue pagando a Cemig.\n                    <\/p>\n\n                <\/div>\n\n            <\/section>\n\n            <button type=\"button\" class=\"btn-continuar\">\n                Continuar\n            <\/button>\n\n        `;\n\n    } catch (error) {\n\n        console.error(\"Erro ao carregar etapas:\", error);\n\n        conteudo.innerHTML = `\n            <p class=\"erro\">\n                Não foi possível carregar suas etapas.\n                Verifique sua conexão e tente novamente.\n            <\/p>\n        `;\n\n    }\n\n}\n<\/script>\n\n<\/head>\n\n<body>\n\n  <div class=\"app\">\n\n    <!-- CABEÇALHO -->\n    <header class=\"cabecalho\">\n\n      <!-- Barra de status -->\n      <div class=\"barra-status\">\n\n        <span>10:12<\/span>\n\n        <div class=\"status-icones\">\n\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\"\n            fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\"\n            fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"     <\/svg>\n\n          Consumo\n\n        <\/button>\n\n        <!-- Indicações -->\n        <button type=\"button\" class=\"nav-item\">\n\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\"\n            fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\n            stroke-linecap=\"round\" stroke-linejoin=\"round\"\n            aria-hidden=\"true\">\n\n            <rect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/>\n            <path d=\"M5 12v9h14v-9\"/>\n            <line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"21\"/>\n            <path d=\"M12 8c-2.5 0-4-1-4-2.5S9.5 3 11 4c.8.6 1 2.5 1 4z\"/>\n            <path d=\"M12 8c2.5 0 4-1 4-2.5S14.5 3 13 4c-.8.6-1 2.5-1 4z\"/>\n\n          <\/svg>\n\n          Indicações\n\n        <\/button>\n\n      <\/nav>\n\n    <\/footer>\n\n  <\/div>\n\n<\/body>\n<\/html>", "pages/consumo/index.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Bulbe | Consumo<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo (sempre primeiro) e CSS desta tela -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n  <style>\n/* =========================================================\n   Tela: Consumo (home de quem está logado)\n   Só o que é desta tela. O resto vem de assets/css/style.css.\n   ========================================================= */\n\n:root {\n  --con-verde: #23A455;\n  --con-verde-escuro: #1D6B3F;\n  --con-verde-fundo: #E4F3EA;\n  --con-barra-verde: #2E9E5B;\n  --con-barra-cinza: #A9B6D3;\n  --con-cartao: #EEF2F8;\n  --con-texto: #1F2340;\n}\n\n\n/* ---------- Fundo azul atrás do painel arredondado ---------- */\n\n.app--azul {\n  background: var(--azul-bulbe);\n}\n\n\n/* ---------- Painel branco ---------- */\n\n.conteudo--painel {\n  padding: 26px 16px 16px;\n  gap: 16px;\n  border-radius: 24px 24px 0 0;\n  background: #ffffff;\n}\n\n.secao-titulo {\n  margin-bottom: 8px;\n  font-size: 0.95rem;\n  font-weight: 700;\n  line-height: 1.2;\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- Economia até hoje ---------- */\n\n.economia {\n  padding: 8px 14px 6px;\n  border-left: 4px solid var(--con-verde);\n  border-radius: var(--raio);\n  background: var(--con-verde-fundo);\n}\n\n.economia__rotulo {\n  font-size: 0.75rem;\n  font-weight: 700;\n  line-height: 1.3;\n  color: var(--con-verde-escuro);\n}\n\n.economia__valor {\n  font-size: 2rem;\n  font-weight: 800;\n  line-height: 1.2;\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- Créditos na conta ---------- */\n\n.creditos-conta {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 8px 14px 8px;\n  border-left: 4px solid #2F7BD0;\n  border-radius: var(--raio);\n  background: #E7F0FB;\n  text-decoration: none;\n  color: var(--azul-bulbe);\n}\n\n.creditos-conta__texto {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n}\n\n.creditos-conta__rotulo {\n  font-size: 0.75rem;\n  font-weight: 700;\n  line-height: 1.3;\n  color: #1D5A9E;\n}\n\n.creditos-conta__valor {\n  font-size: 2rem;\n  font-weight: 800;\n  line-height: 1.2;\n}\n\n.creditos-conta__valor small {\n  font-size: 1rem;\n  font-weight: 700;\n}\n\n.creditos-conta__detalhe {\n  font-size: 0.7rem;\n  line-height: 1.3;\n  color: var(--texto-suave);\n}\n\n.creditos-conta__seta {\n  flex-shrink: 0;\n}\n\n.creditos-conta:hover {\n  background: #DCE9F8;\n}\n\n.creditos-conta:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- Comparativo de consumo ---------- */\n\n.comparativo__item {\n  margin-bottom: 6px;\n}\n\n.comparativo__nome {\n  margin-bottom: 2px;\n  font-size: 0.75rem;\n  line-height: 1.3;\n  color: var(--texto-suave);\n}\n\n.comparativo__nome--forte {\n  font-weight: 700;\n  color: var(--azul-bulbe);\n}\n\n/* A barra mais comprida (310 kWh) ocupa 100% da largura */\n.barra {\n  display: flex;\n  align-items: center;\n  box-sizing: border-box;\n  width: calc(var(--kwh) / 310 * 100%);\n  min-height: 22px;\n  padding: 0 8px;\n  border-radius: 6px;\n  font-size: 0.75rem;\n  font-weight: 700;\n  line-height: 1;\n  white-space: nowrap;\n  color: #ffffff;\n}\n\n.barra--verde { background: var(--con-barra-verde); }\n.barra--azul  { background: var(--azul-bulbe); }\n.barra--cinza { background: var(--con-barra-cinza); color: var(--azul-bulbe); }\n\n.comparativo__nota {\n  margin-top: 4px;\n  font-size: 0.7rem;\n  line-height: 1.3;\n  color: var(--texto-suave);\n}\n\n\n/* ---------- Botão de contorno ---------- */\n\n.botoes-ver {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.botao--contorno {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 42px;\n  border: 2px solid var(--azul-bulbe);\n  border-radius: 12px;\n  background: #ffffff;\n  font-size: 0.8rem;\n  font-weight: 700;\n  line-height: 1.2;\n  text-align: center;\n  text-decoration: none;\n  color: var(--azul-bulbe);\n}\n\n.botao--contorno:hover {\n  background: #F1F2FB;\n}\n\n\n/* ---------- Configurações de envio ---------- */\n\n.envios {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  list-style: none;\n}\n\n.envio {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n  padding: 12px 14px;\n  border-radius: 12px;\n  background: var(--con-cartao);\n}\n\n.envio__texto {\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  min-width: 0;\n}\n\n.envio__nome {\n  font-size: 0.85rem;\n  font-weight: 700;\n  line-height: 1.3;\n  color: var(--azul-bulbe);\n}\n\n.envio__detalhe {\n  font-size: 0.7rem;\n  line-height: 1.3;\n  color: var(--texto-suave);\n  overflow-wrap: anywhere;\n}\n\n.envio__detalhe a {\n  color: inherit;\n  text-decoration: none;\n}\n\n.selo-ativo {\n  flex-shrink: 0;\n  padding: 4px 12px;\n  border-radius: 999px;\n  background: var(--con-barra-verde);\n  font-size: 0.75rem;\n  font-weight: 700;\n  line-height: 1.2;\n  color: #ffffff;\n}\n\n\n/* ---------- Abas: linha azul na aba ativa ---------- */\n\n.nav-item {\n  position: relative;\n}\n\n.nav-item.ativo::before {\n  content: \"\";\n  position: absolute;\n  top: -9px;\n  left: 0;\n  right: 0;\n  height: 2px;\n  background: var(--azul-bulbe);\n}\n\n<\/style>\n\n  <!-- JavaScript comum do grupo -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n<\/head>\n\n<body>\n\n  <div class=\"app app--azul\">\n\n      Indicações\n        <\/button>\n\n      <\/nav>\n    <\/footer>\n\n  <\/div>\n\n<\/body>\n<\/html>\n", "pages/consumo-cenarios/index.html": "<!DOCTYPE html>\n<html lang=\"pt-br\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>Bulbe | Cenários de consumo<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo (sempre primeiro) e CSS desta tela -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n  <style>\n/* =========================================================\n   Tela: Cenários de consumo\n   Só o que é desta tela. O resto vem de assets/css/style.css.\n   ========================================================= */\n\n:root {\n  /* Cores dos três cenários */\n  --cen-verde-fundo: #E4F3EA;\n  --cen-verde-borda: #23A455;\n  --cen-verde-texto: #1D6B3F;\n\n  --cen-azul-fundo: #E7F0FB;\n  --cen-azul-borda: #2F7BD0;\n  --cen-azul-texto: #1D5A9E;\n\n  --cen-laranja-fundo: #FFF1E3;\n  --cen-laranja-borda: #F28C00;\n  --cen-laranja-texto: #B8620A;\n\n  --cen-texto: #1F2340;\n}\n\n\n/* ---------- Conteúdo ---------- */\n\n.botao-duvidas {\n  align-self: flex-end;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  line-height: 1.2;\n  margin-bottom: -4px;\n  padding: 6px 10px;\n  border: 1px solid var(--borda);\n  border-radius: 4px;\n  background: #F6F8FB;\n  font: inherit;\n  font-size: 0.7rem;\n  color: var(--cen-texto);\n  cursor: pointer;\n}\n\n.botao-duvidas:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n.subtitulo--texto {\n  font-size: 0.875rem;\n  line-height: 1.35;\n  color: var(--cen-texto);\n}\n\n\n/* ---------- Cartões dos cenários ---------- */\n\n.cenarios {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.cenario {\n  padding: 12px 14px;\n  border-left: 4px solid var(--cen-cor-borda);\n  border-radius: var(--raio);\n  background: var(--cen-cor-fundo);\n}\n\n.cenario--verde {\n  --cen-cor-borda: var(--cen-verde-borda);\n  --cen-cor-fundo: var(--cen-verde-fundo);\n  --cen-cor-texto: var(--cen-verde-texto);\n}\n\n.cenario--azul {\n  --cen-cor-borda: var(--cen-azul-borda);\n  --cen-cor-fundo: var(--cen-azul-fundo);\n  --cen-cor-texto: var(--cen-azul-texto);\n}\n\n.cenario--laranja {\n  --cen-cor-borda: var(--cen-laranja-borda);\n  --cen-cor-fundo: var(--cen-laranja-fundo);\n  --cen-cor-texto: var(--cen-laranja-texto);\n}\n\n.cenario__titulo {\n  margin-bottom: 8px;\n  font-size: 0.8rem;\n  font-weight: 700;\n  color: var(--cen-cor-texto);\n}\n\n/* Três colunas: desconto, economia, conta com a Bulbe.\n   Os rótulos ficam todos na mesma linha (alinhados embaixo) e os valores\n   na linha seguinte. As colunas podem quebrar texto, então nada sai do cartão. */\n.valores {\n  display: grid;\n  grid-template-columns: minmax(0, 1.3fr) minmax(0, 0.8fr) minmax(0, 1fr);\n  grid-template-rows: auto auto;\n  grid-auto-flow: column;\n  column-gap: 10px;\n}\n\n.valores > div {\n  display: contents;\n}\n\n.valores dt {\n  align-self: end;\n  margin-bottom: 4px;\n  font-size: 0.55rem;\n  line-height: 1.25;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: 0.2px;\n  color: var(--texto-suave);\n  overflow-wrap: anywhere;\n}\n\n.valores dd {\n  align-self: start;\n  font-size: 0.8rem;\n  line-height: 1.3;\n  font-weight: 700;\n  color: var(--cen-texto);\n  overflow-wrap: anywhere;\n}\n\n.valores .valores__destaque {\n  font-size: 1.2rem;\n  line-height: 1.15;\n  color: var(--cen-cor-texto);\n}\n\n.valores__destaque small {\n  font-size: 0.65rem;\n  line-height: 1.2;\n  font-weight: 700;\n  color: var(--texto-suave);\n}\n\n.nota-cenarios {\n  margin-top: -8px;\n  font-size: 0.65rem;\n  color: var(--texto-suave);\n}\n\n\n/* ---------- Destaque verde ---------- */\n\n.destaque-verde {\n  padding: 12px 16px;\n  border-left: 4px solid var(--cen-verde-borda);\n  border-radius: var(--raio);\n  background: var(--cen-verde-fundo);\n  font-size: 0.8rem;\n  line-height: 1.4;\n  color: var(--cen-texto);\n}\n\n.destaque-verde__titulo {\n  margin-bottom: 2px;\n  font-weight: 700;\n  color: var(--cen-verde-texto);\n}\n\n\n/* ---------- Botão de contorno (mesmo da tela Consumo) ---------- */\n\n.botao--contorno {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 42px;\n  border: 2px solid var(--azul-bulbe);\n  border-radius: 12px;\n  background: #ffffff;\n  font-size: 0.8rem;\n  font-weight: 700;\n  line-height: 1.2;\n  text-align: center;\n  text-decoration: none;\n  color: var(--azul-bulbe);\n}\n\n.botao--contorno:hover {\n  background: #F1F2FB;\n}\n\n/* Botões do fim da tela: ficam juntos, colados embaixo */\n.botoes-fim {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  margin-top: auto;\n}\n\n\n/* ---------- Abas: linha azul na aba ativa ---------- */\n\n.nav-item {\n  position: relative;\n  text-decoration: none;\n}\n\n.nav-item.ativo::before {\n  content: \"\";\n  position: absolute;\n  top: -9px;\n  left: 0;\n  right: 0;\n  height: 2px;\n  background: var(--azul-bulbe);\n}\n\n<\/style>\n\n  <!-- JavaScript comum do grupo -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n<\/head>\n\n<body>\n\n  <div class=\"app\">\n\n    <!-- Cabeçalho padrão do grupo: azul, com barra de status, voltar e logo branca -->\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"11\" rx=\"3\" stroke=\"currentColor\"/>\n            <rect x=\"2.5\" y=\"2.5\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>\n            <rect x=\"22\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n\n      <div class=\"barra-topo\">\n        <a class=\"botao-icone\" href=\"../consumo/index.html\" aria-label=\"Voltar\">\n          <svg width=\"
