r\" data-valor=\"bulbe\">R$ 199,87<\/span>\n                <\/div>\n                <div class=\"linha total\">\n                  <span class=\"linha__nome\">Total por mês<\/span>\n                  <span class=\"linha__valor\" data-valor=\"total\">R$ 251,93<\/span>\n                <\/div>\n                <div class=\"economia\">\n                  <span>Economia<\/span>\n                  <span data-valor=\"economia\">R$ 30,00<\/span>\n                <\/div>\n                <p class=\"legitimo\"><strong>A cobrança da Bulbe é verdadeira.<\/strong> Ela vai chegar pelo WhatsApp com seu nome e o endereço <span id=\"endereco\">Rua das Acácias, 120, Betim<\/span>. Dá para pagar na lotérica.<\/p>\n              <\/div>\n            <\/div>\n            <span class=\"balao__hora\">agora<\/span>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <p class=\"nota\">A Bulbe envia esta mensagem para o WhatsApp do titular, em nome de quem fez o cadastro.<\/p>\n\n      <p class=\"envio-ok\" id=\"status-envio\" role=\"status\" hidden>\n        <strong>Mensagem enviada!<\/strong> O titular vai recebê-la no WhatsApp. (Simulação: nada é enviado de verdade nesta versão.)\n      <\/p>\n\n    <\/main>\n\n    <footer class=\"rodape rodape--acao\">\n      <button type=\"button\" id=\"botao-enviar\" class=\"botao botao--whatsapp\">Enviar mensagem ao titular<\/button>\n    <\/footer>\n\n  <\/div>\n\n\n<\/body>\n<\/html>\n", "pages/hu-lucas/index.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>HU01 - Entenda suas Faturas<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo (sempre primeiro) e CSS próprio da HU -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n  <style>\n/* =========================================================\n   HU01 (Sandro/Lucas) · CSS próprio das telas\n\n   Carregado DEPOIS do CSS comum do grupo (assets/css/style.css).\n   Aqui fica só o que é desta HU: cartões, linhas de valores,\n   economia, prévia do WhatsApp e o indicador de etapa.\n   Cores, fonte, cabeçalho, rodapé, título, botões e aviso\n   vêm do CSS comum.\n   ========================================================= */\n\n:root {\n  --verde-suave: #E9F8EF;\n  --verde-texto: #15803D;\n  --card-titular-fundo: #DDF3E6;\n  --card-titular-borda: #6FCB9A;\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n}\n\n/* Indicador de etapa (1/3, 2/3, 3/3) no cabeçalho */\n.etapa {\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n/* ---------- Cartões e linhas de valores ---------- */\n\n.card {\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  padding: 12px 14px;\n}\n\n.linha {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  gap: 8px;\n  padding: 4px 0;\n}\n\n.linha__nome {\n  font-size: 0.92rem;\n}\n\n.linha__obs {\n  font-size: 0.72rem;\n  color: var(--texto-suave);\n}\n\n.linha__detalhe {\n  font-size: 0.75rem;\n  line-height: 1.45;\n  color: var(--texto-suave);\n}\n\n.linha__valor {\n  font-size: 0.92rem;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.selo {\n  padding: 2px 8px;\n  border-radius: 12px;\n  font-size: 0.7rem;\n  font-weight: 500;\n  white-space: nowrap;\n}\n\n.selo--info {\n  background: var(--info-fundo);\n  color: var(--info-texto);\n}\n\n.selo--verde {\n  background: var(--verde-suave);\n  color: var(--verde-texto);\n}\n\n.separador {\n  border: 0;\n  border-top: 1px dashed var(--borda);\n  margin: 6px 0;\n}\n\n.total {\n  margin-top: 8px;\n  padding-top: 8px;\n  border-top: 1px solid var(--borda);\n}\n\n.total .linha__valor {\n  font-size: 1.4rem;\n  color: var(--azul-bulbe);\n}\n\n.economia {\n  margin-top: 8px;\n  padding: 10px 12px;\n  border-radius: 8px;\n  background: var(--verde);\n  display: flex;\n  justify-content: space-between;\n  font-size: 0.85rem;\n  font-weight: 600;\n  color: var(--verde-escuro);\n}\n\n/* ---------- Aviso (complementos do .aviso comum) ---------- */\n\n.aviso__icone {\n  flex: 0 0 auto;\n}\n\n.aviso__titulo {\n  display: block;\n  font-weight: 500;\n}\n\n.aviso__texto {\n  margin-top: 2px;\n}\n\n/* ---------- Cartão \"avise o titular\" ---------- */\n\n.card-titular {\n  background: var(--card-titular-fundo);\n  border: 1px solid var(--card-titular-borda);\n  border-radius: 12px;\n  padding: 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.card-titular h2 {\n  font-size: 0.95rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.card-titular p {\n  font-size: 0.8rem;\n  line-height: 1.45;\n  color: var(--texto-suave);\n}\n\n/* ---------- Prévia da mensagem de WhatsApp ---------- */\n\n.previa {\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  overflow: hidden;\n}\n\n.previa__conversa {\n  background: var(--whatsapp-chat);\n  padding: 12px;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 8px;\n}\n\n.previa__aviso {\n  align-self: center;\n  padding: 4px 10px;\n  border-radius: 8px;\n  background: #FFF3C4;\n  font-size: 0.72rem;\n  color: #5C4400;\n}\n\n.balao {\n  max-width: 92%;\n  padding: 8px 10px 6px;\n  border-radius: 10px 0 10px 10px;\n  background: var(--whatsapp-balao);\n  color: #111B21;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.balao p {\n  margin-bottom: 8px;\n}\n\n.balao__cartao {\n  padding: 10px 12px;\n  border-radius: 8px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.balao__cartao strong {\n  display: block;\n  margin-bottom: 4px;\n  font-size: 0.85rem;\n}\n\n.balao__cartao p {\n  margin: 0;\n  font-size: 0.75rem;\n  opacity: 0.9;\n}\n\n.balao__hora {\n  display: block;\n  margin-top: 2px;\n  text-align: right;\n  font-size: 0.68rem;\n  color: #667781;\n}\n\n/* ---------- Rodapé ---------- */\n\n.nota--rodape {\n  margin-top: 8px;\n}\n<\/style>\n\n  <!-- JavaScript comum do grupo e JavaScript próprio da HU -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n  <script type=\"module\">\n/* =========================================================\n   HU01 (Sandro/Lucas) · JavaScript próprio das telas\n\n   Carregado como módulo, depois do JavaScript comum do grupo.\n   A formatação em reais vem do main.js comum.\n   ========================================================= */\n\nconst { formatarReais } = window.BulbeComum;\n\n// Valores de exemplo para a simulação do cliente\nconst VALORES = {\n path d=\"M12 13.5a1.5 1.5 0 0 1 1-1.5 2.6 2.6 0 1 0-3-4\"/>\n        <\/svg>\n        <div>\n          <strong class=\"aviso__titulo\">Por que ainda recebo a fatura da Cemig?<\/strong>\n          <p class=\"aviso__texto\">A Cemig mantém os fios e postes. Você paga à Cemig a taxa de infraestrutura e à Bulbe a energia com até 15% de desconto.<\/p>\n        <\/div>\n      <\/div>\n\n    <\/main>\n\n    <footer class=\"rodape rodape--acao\">\n      <a href=\"resumo-mes.html\" class=\"botao botao--primario\">Entendi a Cobrança<\/a>\n      <p class=\"nota nota--rodape\">Sem duplicidade de pagamento. Garantido pela Bulbe.<\/p>\n    <\/footer>\n  <\/div>\n\n<\/body>\n<\/html>", "pages/hu-lucas/resumo-mes.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>HU01 - Veja como fica a conta<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo (sempre primeiro) e CSS próprio da HU -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n  <style>\n/* =========================================================\n   HU01 (Sandro/Lucas) · CSS próprio das telas\n\n   Carregado DEPOIS do CSS comum do grupo (assets/css/style.css).\n   Aqui fica só o que é desta HU: cartões, linhas de valores,\n   economia, prévia do WhatsApp e o indicador de etapa.\n   Cores, fonte, cabeçalho, rodapé, título, botões e aviso\n   vêm do CSS comum.\n   ========================================================= */\n\n:root {\n  --verde-suave: #E9F8EF;\n  --verde-texto: #15803D;\n  --card-titular-fundo: #DDF3E6;\n  --card-titular-borda: #6FCB9A;\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n}\n\n/* Indicador de etapa (1/3, 2/3, 3/3) no cabeçalho */\n.etapa {\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n/* ---------- Cartões e linhas de valores ---------- */\n\n.card {\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  padding: 12px 14px;\n}\n\n.linha {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  gap: 8px;\n  padding: 4px 0;\n}\n\n.linha__nome {\n  font-size: 0.92rem;\n}\n\n.linha__obs {\n  font-size: 0.72rem;\n  color: var(--texto-suave);\n}\n\n.linha__detalhe {\n  font-size: 0.75rem;\n  line-height: 1.45;\n  color: var(--texto-suave);\n}\n\n.linha__valor {\n  font-size: 0.92rem;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.selo {\n  padding: 2px 8px;\n  border-radius: 12px;\n  font-size: 0.7rem;\n  font-weight: 500;\n  white-space: nowrap;\n}\n\n.selo--info {\n  background: var(--info-fundo);\n  color: var(--info-texto);\n}\n\n.selo--verde {\n  background: var(--verde-suave);\n  color: var(--verde-texto);\n}\n\n.separador {\n  border: 0;\n  border-top: 1px dashed var(--borda);\n  margin: 6px 0;\n}\n\n.total {\n  margin-top: 8px;\n  padding-top: 8px;\n  border-top: 1px solid var(--borda);\n}\n\n.total .linha__valor {\n  font-size: 1.4rem;\n  color: var(--azul-bulbe);\n}\n\n.economia {\n  margin-top: 8px;\n  padding: 10px 12px;\n  border-radius: 8px;\n  background: var(--verde);\n  display: flex;\n  justify-content: space-between;\n  font-size: 0.85rem;\n  font-weight: 600;\n  color: var(--verde-escuro);\n}\n\n/* ---------- Aviso (complementos do .aviso comum) ---------- */\n\n.aviso__icone {\n  flex: 0 0 auto;\n}\n\n.aviso__titulo {\n  display: block;\n  font-weight: 500;\n}\n\n.aviso__texto {\n  margin-top: 2px;\n}\n\n/* ---------- Cartão \"avise o titular\" ---------- */\n\n.card-titular {\n  background: var(--card-titular-fundo);\n  border: 1px solid var(--card-titular-borda);\n  border-radius: 12px;\n  padding: 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.card-titular h2 {\n  font-size: 0.95rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.card-titular p {\n  font-size: 0.8rem;\n  line-height: 1.45;\n  color: var(--texto-suave);\n}\n\n/* ---------- Prévia da mensagem de WhatsApp ---------- */\n\n.previa {\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  overflow: hidden;\n}\n\n.previa__conversa {\n  background: var(--whatsapp-chat);\n  padding: 12px;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 8px;\n}\n\n.previa__aviso {\n  align-self: center;\n  padding: 4px 10px;\n  border-radius: 8px;\n  background: #FFF3C4;\n  font-size: 0.72rem;\n  color: #5C4400;\n}\n\n.balao {\n  max-width: 92%;\n  padding: 8px 10px 6px;\n  border-radius: 10px 0 10px 10px;\n  background: var(--whatsapp-balao);\n  color: #111B21;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.balao p {\n  margin-bottom: 8px;\n}\n\n.balao__cartao {\n  padding: 10px 12px;\n  border-radius: 8px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.balao__cartao strong {\n  display: block;\n  margin-bottom: 4px;\n  font-size: 0.85rem;\n}\n\n.balao__cartao p {\n  margin: 0;\n  font-size: 0.75rem;\n  opacity: 0.9;\n}\n\n.balao__hora {\n  display: block;\n  margin-top: 2px;\n  text-align: right;\n  font-size: 0.68rem;\n  color: #667781;\n}\n\n/* ---------- Rodapé ---------- */\n\n.nota--rodape {\n  margin-top: 8px;\n}\n<\/style>\n\n  <!-- JavaScript comum do grupo e JavaScript próprio da HU -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n  <script type=\"module\">\n/* =========================================================\n   HU01 (Sandro/Lucas) · JavaScript próprio das telas\n\n   Carregado como módulo, depois do JavaScript comum do grupo.\n   A formatação em reais vem do main.js comum.\n   ========================================================= */\n\nconst { formatarReais } = window.BulbeComum;\n\n// Valores de exemplo para a simulação do cliente\nconst VALORES = {\n  antes: 320.00,  // Conta antiga, só Cemig\n  cemig: 52.00,   // Taxa de distribuição e iluminação\n  bulbe: 219.50   // Energia limpa da Bulbe\n};\n\nVALORES.total = VALORES.cemig + VALORES.bulbe;\nVALORES.economia = VALORES.antes - VALORES.total;\n\n// Tela 2 (resumo-mes.html): preenche os valores na tela\nfunction preencher(id, valor) {\n  const elemento = document.getElementById(id);\n  if (elemento) {\n    elemento.textContent = formatarReais(valor);\n  }\n}\n\npreencher('val-antes', VALORES.antes);\npreencher('val-cemig', VALORES.cemig);\npreencher('val-bulbe', VALORES.bulbe);\npreencher('val-total', VALORES.total);\npreencher('val-economia', VALORES.economia);\n\n// Tela 3 (mensagem.html): botão de enviar (simulação)\nconst botaoEnviar = document.getElementById('botao-enviar');\nif (botaoEnviar) {\n  botaoEnviar.addEventListener('click', () => {\n    alert('Mensagem enviada com sucesso!');\n  });\n}\n<\/script>\n<\/head>\n\n<body>\n\n  <div class=\"app\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n            <rect x=\"0\" y=\"8\" width=\"3\" height=\"4\" rx=\"1\"/>\n            <rect x=\"5\" y=\"5\" width=\"3\" height=\"7\" rx=\"1\"/>\n            <rect x=\"10\" y=\"2.5\" width=\"3\" height=\"9.5\" rx=\"1\"/>\n            <rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"/>\n          <\/svg>\n          <svg width=\"24\" height=\"12\" viewBox=\"0 0 24 12\" fill=\"none\" aria-hidden=\"true\">\n            <rect x=\"0.5\" y=\"0.5\" width=\"20\" height=\"11\" rx=\"3\" stroke=\"currentColor\"/>\n            <rect x=\"2.5\" y=\"2.5\" width=\"16\" height=\"7\" rx=\"1.5\" fill=\"currentColor\"/>\n            <rect x=\"22\" y=\"4\" width=\"2\" height=\"4\" rx=\"1\" fill=\"currentColor\"/>\n          <\/svg>\n        <\/div>\n      <\/div>\n\n      <div class=\"barra-topo\">\n        <a href=\"index.html\" class=\"botao-icone\" aria-label=\"Voltar\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <path d=\"M15 18l-6-6 6-6\"/>\n          <\/svg>\n        <\/a>\n\n        <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAABzCAYAAAC2GFRUAAARxUlEQVR42u2dQW8bR5qG32rLziEZpPeW2LOYFtZe5GbyF6T1C0L/AlMJsMCcTN2ysx6IQrxzJXWaS2zSv0DyLxB1miPpW3aSBdsHLxaYg5nLAnESfXvooszRWBLZVdVdXf0+gOAEEtndX79V7/dVVVdDijMHIQaISGqgv9Gax6C+CXFExBAQQgihgRBCCKGBEEIIoYEQQgjxjGTai02/Y4thJISQ5nB3+jhVSgaAWgDYoYEQQgi5ks+mXye/qq2RAlJAnZvJD+0nExoIIYSQ   <div>\n        <h1 class=\"titulo\">Veja como fica a conta de luz<\/h1>\n        <p class=\"subtitulo\">Valores de exemplo baseados na sua média<\/p>\n      <\/div>\n\n      <!-- Comparação (os valores são preenchidos por js/main.js) -->\n      <div class=\"card\">\n        <div class=\"linha\">\n          <span class=\"linha__nome\">Antes <span class=\"linha__obs\">(1 fatura)<\/span><\/span>\n          <strong class=\"linha__valor\" id=\"val-antes\">R$ 0,00<\/strong>\n        <\/div>\n\n        <hr class=\"separador\">\n\n        <div class=\"linha\">\n          <span class=\"linha__nome\">Agora · Cemig<\/span>\n          <strong class=\"linha__valor\" id=\"val-cemig\">R$ 0,00<\/strong>\n        <\/div>\n        <div class=\"linha\">\n          <span class=\"linha__nome\">Agora · Bulbe<\/span>\n          <strong class=\"linha__valor\" id=\"val-bulbe\">R$ 0,00<\/strong>\n        <\/div>\n\n        <div class=\"linha total\">\n          <span class=\"linha__nome\">Total por mês<\/span>\n          <strong class=\"linha__valor\" id=\"val-total\">R$ 0,00<\/strong>\n        <\/div>\n\n        <div class=\"economia\">\n          <span>Economia por mês<\/span>\n          <span id=\"val-economia\">R$ 0,00<\/span>\n        <\/div>\n      <\/div>\n\n      <!-- Avisar o titular -->\n      <div class=\"card-titular\">\n        <h2>Avise o titular antes de continuar<\/h2>\n        <p>Ele vai receber duas contas. Avise para ele não estranhar a cobrança da Bulbe.<\/p>\n        <a href=\"mensagem.html\" class=\"botao botao--whatsapp\">\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <path d=\"M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21\"/>\n            <path d=\"M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1\"/>\n          <\/svg>\n          Mostrar ao titular pelo WhatsApp\n        <\/a>\n      <\/div>\n\n    <\/main>\n\n    <footer class=\"rodape rodape--acao\">\n      <a href=\"mensagem.html\" class=\"botao botao--primario\">Continuar<\/a>\n    <\/footer>\n  <\/div>\n\n<\/body>\n<\/html>", "pages/hu-lucas/mensagem.html": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<script>\nwindow.__bulbeIr = function (destino) { parent.postMessage({ bulbeIr: destino }, '*'); };\nwindow.__bulbeVoltar = function () { parent.postMessage({ bulbeVoltar: true }, '*'); };\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var href = (a.getAttribute('href') || '').trim();\n  // Links sem destino (\"#\", vazio, javascript:) não fazem nada: no srcdoc eles abririam a apresentação dentro do celular\n  if (href === '' || href.charAt(0) === '#' || /^javascript:/i.test(href)) {\n    e.preventDefault();\n    var alvo = href.length > 1 && href.charAt(0) === '#' && document.getElementById(href.slice(1));\n    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });   // âncoras dentro da própria tela continuam rolando\n    return;\n  }\n  if (/^(https?:|mailto:|tel:)/.test(href)) return;\n  e.preventDefault();\n  if (/\\.html(#.*)?$/.test(href)) window.__bulbeIr(href);\n}, true);\n// Formulários nunca são enviados de verdade: cada tela trata o envio no próprio script\nwindow.addEventListener('submit', function (e) { e.preventDefault(); });\n<\/script>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n  <title>HU01 - Confira a mensagem<\/title>\n\n  <!-- Fonte da Bulbe -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap\">\n\n  <!-- CSS comum do grupo (sempre primeiro) e CSS próprio da HU -->\n  <style>\n/* =========================================================\n   Bulbe · CSS comum do grupo (Squad 02)\n\n   Toda página carrega este arquivo PRIMEIRO e, depois, o CSS\n   próprio, se tiver algo só dela:\n\n     <link rel=\"stylesheet\" href=\"../../assets/css/style.css\">\n     <link rel=\"stylesheet\" href=\"css/style.css\">\n\n   Regras do grupo:\n   - Aqui fica só o que é de todos: cores, fonte, tamanho da tela,\n     cabeçalho, rodapé e componentes básicos (títulos, botões, campos).\n   - O que é só da sua tela vai no SEU arquivo. Para variar algo\n     daqui, crie uma classe nova ou sobrescreva no seu arquivo.\n   - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n\n   Especificação da Bulbe: fonte Poppins, azul #08068D, tela 360 x 812.\n   A fonte é carregada no <head> de cada página (Google Fonts).\n   ========================================================= */\n\n\n/* ---------- 1. Variáveis ---------- */\n\n:root {\n  /* Marca */\n  --azul-bulbe: #08068D;\n  --azul-claro: #8a9bb5;\n  --verde: #23C97B;\n  --vermelho: #d93a2f;\n\n  /* Neutros */\n  --borda: #dde3ec;\n  --texto-suave: #5b6b82;\n  --fundo-pagina: #ececec;\n  --desabilitado: #A4B3C1;\n\n  /* Mensagens */\n  --info-fundo: #E6F0FB;\n  --info-texto: #1D4E89;\n  --verde-fundo: #F0FDF4;\n  --verde-borda: #86E0B3;\n  --verde-escuro: #0B3D25;\n  --whatsapp: #075E54;\n\n  /* Medidas */\n  --raio: 10px;\n  --altura-botao: 48px;\n  --altura-app: 100dvh;\n}\n\n\n/* ---------- 2. Base ---------- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  min-height: var(--altura-app);\n  background-color: var(--fundo-pagina);\n  font-family: \"Poppins\", \"Segoe UI\", Roboto, Arial, sans-serif;\n  color: var(--azul-bulbe);\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n/* Texto só para leitores de tela */\n.sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n\n/* ---------- 3. Moldura do app (360 x 812) ---------- */\n\n.app {\n  width: min(360px, 100vw);\n  height: min(812px, 96vh);\n  background-color: #ffffff;\n  border-radius: 20px;\n  overflow: hidden;\n  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);\n  display: flex;\n  flex-direction: column;\n}\n\n/* No celular, o app ocupa a tela inteira */\n@media (pointer: coarse), (max-width: 600px) {\n  body {\n    display: block;\n    background: #ffffff;\n  }\n\n  .app {\n    width: 100%;\n    height: var(--altura-app);\n    border-radius: 0;\n    box-shadow: none;\n  }\n}\n\n\n/* ---------- 4. Cabeçalho (azul, logo branca) ---------- */\n\n.cabecalho {\n  flex: 0 0 auto;\n  padding: env(safe-area-inset-top) 16px 12px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.barra-status {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  height: 32px;\n  padding: 0 4px;\n  font-size: 0.8rem;\n  font-weight: 600;\n}\n\n.status-icones {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n/* Três colunas: esquerda (voltar ou menu), centro (logo), direita (vazio ou sino + perfil).\n   As laterais têm a mesma largura, então a logo fica sempre no centro. */\n.barra-topo {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  margin: 4px 0 10px;\n}\n\n.barra-topo > :first-child {\n  justify-self: start;\n}\n\n.barra-topo > :last-child {\n  justify-self: end;\n}\n\n.botao-icone {\n  width: 44px;\n  height: 44px;\n  border: none;\n  border-radius: 50%;\n  background: none;\n  color: #ffffff;\n  cursor: pointer;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  position: relative;\n  text-decoration: none;\n}\n\n.botao-icone:hover {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n.logo-img {\n  display: block;\n  height: 29px;\n  width: auto;\n}\n\n/* Itens de quem está logado: sino com contador e perfil */\n.acoes-direita {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n}\n\n.indicador {\n  position: absolute;\n  top: 4px;\n  right: 4px;\n  min-width: 16px;\n  height: 16px;\n  padding: 0 4px;\n  border-radius: 8px;\n  background-color: var(--vermelho);\n  color: #ffffff;\n  font-size: 0.65rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.perfil {\n  width: 36px;\n  height: 36px;\n  border-radius: 50%;\n  background-color: #ffffff;\n  color: var(--azul-bulbe);\n  font-size: 0.8rem;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n\n/* ---------- 5. Conteúdo ---------- */\n\n.conteudo {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  overflow-x: hidden;\n  padding: 20px 16px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n\n/* Os blocos não encolhem: quando não cabem, o conteúdo rola */\n.conteudo > * {\n  flex-shrink: 0;\n}\n\n.titulo {                 /* Poppins SemiBold 24/32, espaçamento 0,4 px */\n  font-size: 1.5rem;\n  line-height: 2rem;\n  font-weight: 600;\n  letter-spacing: 0.4px;\n  color: var(--azul-bulbe);\n}\n\n.subtitulo {\n  margin-top: 4px;\n  font-size: 0.8rem;\n  color: var(--texto-suave);\n}\n\n.subtitulo a,\n.termos a {\n  color: var(--azul-bulbe);\n}\n\n.aviso {\n  display: flex;\n  gap: 8px;\n  padding: 12px;\n  border-radius: var(--raio);\n  background: var(--info-fundo);\n  color: var(--info-texto);\n  font-size: 0.8rem;\n  line-height: 1.45;\n}\n\n.termos,\n.nota {\n  font-size: 0.8rem;\n  line-height: 1.5;\n  text-align: center;\n  color: var(--texto-suave);\n}\n\n.nota {\n  font-size: 0.75rem;\n}\n\n\n/* Lista de itens em cartões (ex.: lista de clientes da página inicial) */\n.lista {\n  list-style: none;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.lista li {\n  padding: 12px 14px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font-size: 0.85rem;\n  color: var(--texto-suave);\n}\n\n.lista strong {\n  color: var(--azul-bulbe);\n}\n\n\n/* ---------- 6. Rodapé ---------- */\n\n.rodape {\n  flex: 0 0 auto;\n  background-color: #ffffff;\n}\n\n/* Rodapé de quem está logado: abas do app */\n.navegacao {\n  display: flex;\n  justify-content: space-around;\n  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n.nav-item {\n  flex: 1;\n  background: none;\n  border: none;\n  font-family: inherit;\n  color: var(--azul-claro);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 4px;\n  font-size: 0.72rem;\n  cursor: pointer;\n}\n\n.nav-item.ativo {\n  color: var(--azul-bulbe);\n  font-weight: 600;\n}\n\n/* Rodapé de fluxo (cadastro): o botão da etapa no lugar das abas */\n.rodape--acao {\n  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--borda);\n}\n\n\n/* ---------- 7. Botões ---------- */\n\n.botao {\n  width: 100%;\n  min-height: var(--altura-botao);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: none;\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 1rem;\n  font-weight: 600;\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.botao--primario {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.botao--primario:disabled {\n  background: var(--desabilitado);\n  cursor: not-allowed;\n}\n\n.botao--whatsapp {\n  background: var(--whatsapp);\n  color: #ffffff;\n  font-size: 0.95rem;\n}\n\n.botao--whatsapp:disabled {\n  opacity: 0.7;\n  cursor: default;\n}\n\n.botao:focus-visible,\n.botao-icone:focus-visible,\n.nav-item:focus-visible {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 8. Formulário ---------- */\n\nfieldset {\n  border: none;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\nlegend {\n  margin-bottom: 16px;      /* espaço para o rótulo do campo, que fica sobre a borda */\n  font-size: 0.9rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.legenda-marcada {\n  padding-left: 10px;\n  border-left: 3px solid var(--verde);\n}\n\n.obrigatorio {\n  color: var(--vermelho);\n}\n\n/* Campo com rótulo sobre a borda */\n.campo {\n  position: relative;\n}\n\n.campo label {\n  position: absolute;\n  top: -8px;\n  left: 10px;\n  padding: 0 4px;\n  background: #ffffff;\n  font-size: 0.75rem;\n  color: var(--texto-suave);\n}\n\n.campo input {\n  width: 100%;\n  height: var(--altura-botao);\n  padding: 0 12px;\n  border: 1px solid var(--borda);\n  border-radius: var(--raio);\n  font: inherit;\n  font-size: 0.95rem;\n  color: var(--azul-bulbe);\n}\n\n.campo input:focus {\n  outline: none;\n  border-color: var(--azul-bulbe);\n  box-shadow: 0 0 0 3px rgba(8, 6, 141, 0.15);\n}\n\n.campo input[aria-invalid=\"true\"] {\n  border-color: var(--vermelho);\n}\n\n.campo__erro {\n  margin: 4px 0 0 4px;\n  font-size: 0.75rem;\n  color: #B42318;\n}\n\n/* Campo de WhatsApp: ícone dentro do campo, à esquerda do número */\n.campo--whatsapp .campo__icone {\n  position: absolute;\n  top: 14px;                /* (48 px do campo - 20 px do ícone) / 2 */\n  left: 12px;\n  width: 20px;\n  height: 20px;\n  pointer-events: none;\n}\n\n.campo--whatsapp input {\n  padding-left: 42px;\n}\n\n/* Escolha entre duas opções (ex.: \"Para mim\" / \"Para outra pessoa\").\n   A marcada fica preenchida no azul da marca, com ✓. */\n.segmentado {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 4px;\n  padding: 4px;\n  border-radius: 12px;\n  background: #EEF1F6;\n}\n\n.segmentado input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.segmentado label {\n  min-height: 44px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  padding: 0 6px;\n  border-radius: 9px;\n  font-size: 0.85rem;\n  font-weight: 500;\n  white-space: nowrap;\n  color: var(--texto-suave);\n  text-align: center;\n  cursor: pointer;\n  transition: background-color 0.15s, color 0.15s;\n}\n\n.segmentado label:hover {\n  color: var(--azul-bulbe);\n}\n\n.segmentado .icone-check {\n  display: none;\n}\n\n.segmentado input:checked + label {\n  background: var(--azul-bulbe);\n  color: #ffffff;\n  font-weight: 600;\n  box-shadow: 0 1px 3px rgba(8, 6, 141, 0.3);\n}\n\n.segmentado input:checked + label .icone-check {\n  display: block;\n}\n\n.segmentado input:focus-visible + label {\n  outline: 3px solid #3D6BF2;\n  outline-offset: 2px;\n}\n\n\n/* ---------- 9. Telas baixas ---------- */\n\n@media (max-height: 520px) {\n  .barra-status { height: 24px; }\n  .barra-topo { margin: 2px 0 6px; }\n}\n\n<\/style>\n  <style>\n/* =========================================================\n   HU01 (Sandro/Lucas) · CSS próprio das telas\n\n   Carregado DEPOIS do CSS comum do grupo (assets/css/style.css).\n   Aqui fica só o que é desta HU: cartões, linhas de valores,\n   economia, prévia do WhatsApp e o indicador de etapa.\n   Cores, fonte, cabeçalho, rodapé, título, botões e aviso\n   vêm do CSS comum.\n   ========================================================= */\n\n:root {\n  --verde-suave: #E9F8EF;\n  --verde-texto: #15803D;\n  --card-titular-fundo: #DDF3E6;\n  --card-titular-borda: #6FCB9A;\n  --whatsapp-chat: #ECE5DD;\n  --whatsapp-balao: #DCF8C6;\n}\n\n/* Indicador de etapa (1/3, 2/3, 3/3) no cabeçalho */\n.etapa {\n  font-size: 0.85rem;\n  color: rgba(255, 255, 255, 0.85);\n}\n\n/* ---------- Cartões e linhas de valores ---------- */\n\n.card {\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  padding: 12px 14px;\n}\n\n.linha {\n  display: flex;\n  justify-content: space-between;\n  align-items: baseline;\n  gap: 8px;\n  padding: 4px 0;\n}\n\n.linha__nome {\n  font-size: 0.92rem;\n}\n\n.linha__obs {\n  font-size: 0.72rem;\n  color: var(--texto-suave);\n}\n\n.linha__detalhe {\n  font-size: 0.75rem;\n  line-height: 1.45;\n  color: var(--texto-suave);\n}\n\n.linha__valor {\n  font-size: 0.92rem;\n  font-weight: 600;\n  white-space: nowrap;\n}\n\n.selo {\n  padding: 2px 8px;\n  border-radius: 12px;\n  font-size: 0.7rem;\n  font-weight: 500;\n  white-space: nowrap;\n}\n\n.selo--info {\n  background: var(--info-fundo);\n  color: var(--info-texto);\n}\n\n.selo--verde {\n  background: var(--verde-suave);\n  color: var(--verde-texto);\n}\n\n.separador {\n  border: 0;\n  border-top: 1px dashed var(--borda);\n  margin: 6px 0;\n}\n\n.total {\n  margin-top: 8px;\n  padding-top: 8px;\n  border-top: 1px solid var(--borda);\n}\n\n.total .linha__valor {\n  font-size: 1.4rem;\n  color: var(--azul-bulbe);\n}\n\n.economia {\n  margin-top: 8px;\n  padding: 10px 12px;\n  border-radius: 8px;\n  background: var(--verde);\n  display: flex;\n  justify-content: space-between;\n  font-size: 0.85rem;\n  font-weight: 600;\n  color: var(--verde-escuro);\n}\n\n/* ---------- Aviso (complementos do .aviso comum) ---------- */\n\n.aviso__icone {\n  flex: 0 0 auto;\n}\n\n.aviso__titulo {\n  display: block;\n  font-weight: 500;\n}\n\n.aviso__texto {\n  margin-top: 2px;\n}\n\n/* ---------- Cartão \"avise o titular\" ---------- */\n\n.card-titular {\n  background: var(--card-titular-fundo);\n  border: 1px solid var(--card-titular-borda);\n  border-radius: 12px;\n  padding: 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.card-titular h2 {\n  font-size: 0.95rem;\n  font-weight: 600;\n  color: var(--azul-bulbe);\n}\n\n.card-titular p {\n  font-size: 0.8rem;\n  line-height: 1.45;\n  color: var(--texto-suave);\n}\n\n/* ---------- Prévia da mensagem de WhatsApp ---------- */\n\n.previa {\n  border: 1px solid var(--borda);\n  border-radius: 12px;\n  overflow: hidden;\n}\n\n.previa__conversa {\n  background: var(--whatsapp-chat);\n  padding: 12px;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 8px;\n}\n\n.previa__aviso {\n  align-self: center;\n  padding: 4px 10px;\n  border-radius: 8px;\n  background: #FFF3C4;\n  font-size: 0.72rem;\n  color: #5C4400;\n}\n\n.balao {\n  max-width: 92%;\n  padding: 8px 10px 6px;\n  border-radius: 10px 0 10px 10px;\n  background: var(--whatsapp-balao);\n  color: #111B21;\n  font-size: 0.85rem;\n  line-height: 1.45;\n}\n\n.balao p {\n  margin-bottom: 8px;\n}\n\n.balao__cartao {\n  padding: 10px 12px;\n  border-radius: 8px;\n  background: var(--azul-bulbe);\n  color: #ffffff;\n}\n\n.balao__cartao strong {\n  display: block;\n  margin-bottom: 4px;\n  font-size: 0.85rem;\n}\n\n.balao__cartao p {\n  margin: 0;\n  font-size: 0.75rem;\n  opacity: 0.9;\n}\n\n.balao__hora {\n  display: block;\n  margin-top: 2px;\n  text-align: right;\n  font-size: 0.68rem;\n  color: #667781;\n}\n\n/* ---------- Rodapé ---------- */\n\n.nota--rodape {\n  margin-top: 8px;\n}\n<\/style>\n\n  <!-- JavaScript comum do grupo e JavaScript próprio da HU -->\n  <script>\n// =========================================================\n// Bulbe · JavaScript comum do grupo (Squad 02)\n//\n// Toda página carrega este arquivo como módulo:\n//   <script type=\"module\" src=\"../../assets/js/main.js\"><\\/script>\n//\n// Ele faz o que serve para todas as páginas (ajustar a altura do app)\n// e oferece funções genéricas. Para usar uma delas no SEU script:\n//   import { formatarReais, mascararWhatsApp } from '../../assets/js/main.js';\n//\n// Regras do grupo:\n// - Aqui fica só o que é genérico. A lógica da sua tela fica no SEU arquivo.\n// - Mudança neste arquivo só com combinado do grupo, numa PR separada.\n// =========================================================\n\nconst buscarClientes = async () => [];\n\n\n// ---------- Altura do app ----------\n// No celular, 100vh nem sempre desconta a barra do navegador.\n// Usamos a altura real da janela na variável --altura-app do CSS.\n\nfunction ajustarAltura() {\n  document.documentElement.style.setProperty('--altura-app', `${window.innerHeight}px`);\n}\n\najustarAltura();\nwindow.addEventListener('resize', ajustarAltura);\nwindow.addEventListener('orientationchange', ajustarAltura);\n\n\n// ---------- Funções genéricas ----------\n\n// 1234.5 → \"R$ 1.234,50\"\nfunction formatarReais(valor) {\n  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });\n}\n\n// \"(31) 98908-2086\" → \"31989082086\"\nfunction somenteDigitos(texto) {\n  return texto.replace(/\\D/g, '');\n}\n\n// \"31989082086\" → \"(31) 98908-2086\" (vai formatando enquanto a pessoa digita)\nfunction mascararWhatsApp(texto) {\n  const d = somenteDigitos(texto).slice(0, 11);\n  if (d.length <= 2) return d.length ? `(${d}` : '';\n  if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n}\n\n// Liga a máscara a um campo: aplicarMascaraWhatsApp(document.querySelector('#meu-campo'))\nfunction aplicarMascaraWhatsApp(campo) {\n  if (!campo) return;\n  campo.addEventListener('input', () => {\n    campo.value = mascararWhatsApp(campo.value);\n  });\n}\n\n// true quando o WhatsApp tem DDD + 9 dígitos\nfunction whatsAppValido(texto) {\n  return somenteDigitos(texto).length === 11;\n}\n\n\n// ---------- Exemplo de dados: lista de clientes ----------\n// Só roda nas páginas que têm <ul id=\"lista-clientes\">.\n// Os dados vêm de data/clientes.json, pelo api.js.\n\nconst STATUS = {\n  aguardando_qualificacao: 'Aguardando qualificação',\n  em_conexao: 'Em conexão',\n  conectado: 'Conectado'\n};\n\nasync function mostrarClientes(lista) {\n  try {\n    const clientes = await buscarClientes();\n    lista.replaceChildren(...clientes.map((c) => {\n      const item = document.createElement('li');\n      const nome = document.createElement('strong');\n      nome.textContent = c.nome;\n      item.append(nome, ` · ${c.cidade} · ${STATUS[c.status] ?? c.status}`);\n      return item;\n    }));\n  } catch (erro) {\n    const item = document.createElement('li');\n    item.textContent = 'Não foi possível carregar os dados. O projeto está aberto pelo Live Server?';\n    lista.replaceChildren(item);\n    console.error(erro);\n  }\n}\n\nconst listaClientes = document.querySelector('#lista-clientes');\nif (listaClientes) {\n  mostrarClientes(listaClientes);\n}\n\nwindow.BulbeComum = { formatarReais, somenteDigitos, mascararWhatsApp, aplicarMascaraWhatsApp, whatsAppValido };\n\n<\/script>\n  <script type=\"module\">\n/* =========================================================\n   HU01 (Sandro/Lucas) · JavaScript próprio das telas\n\n   Carregado como módulo, depois do JavaScript comum do grupo.\n   A formatação em reais vem do main.js comum.\n   ========================================================= */\n\nconst { formatarReais } = window.BulbeComum;\n\n// Valores de exemplo para a simulação do cliente\nconst VALORES = {\n  antes: 320.00,  // Conta antiga, só Cemig\n  cemig: 52.00,   // Taxa de distribuição e iluminação\n  bulbe: 219.50   // Energia limpa da Bulbe\n};\n\nVALORES.total = VALORES.cemig + VALORES.bulbe;\nVALORES.economia = VALORES.antes - VALORES.total;\n\n// Tela 2 (resumo-mes.html): preenche os valores na tela\nfunction preencher(id, valor) {\n  const elemento = document.getElementById(id);\n  if (elemento) {\n    elemento.textContent = formatarReais(valor);\n  }\n}\n\npreencher('val-antes', VALORES.antes);\npreencher('val-cemig', VALORES.cemig);\npreencher('val-bulbe', VALORES.bulbe);\npreencher('val-total', VALORES.total);\npreencher('val-economia', VALORES.economia);\n\n// Tela 3 (mensagem.html): botão de enviar (simulação)\nconst botaoEnviar = document.getElementById('botao-enviar');\nif (botaoEnviar) {\n  botaoEnviar.addEventListener('click', () => {\n    alert('Mensagem enviada com sucesso!');\n  });\n}\n<\/script>\n<\/head>\n\n<body>\n\n  <div class=\"app\">\n\n    <header class=\"cabecalho\">\n\n      <div class=\"barra-status\">\n        <span>10:12<\/span>\n        <div class=\"status-icones\">\n          <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"currentColor\" aria-hidden=\"true\">\n
